    <script>
      /* pass ?piece=... (and an old shared link's #notes=...) on to the app; it tells the page how tall it is */
      (function () {
        var f = document.getElementById("cf");
        var q = location.search ? location.search.slice(1) + "&" : "";
        f.src = "games/cantus-firmus.html?" + q + "v=58" + location.hash;
        var full = false, lastH = 0;
        window.addEventListener("message", function (e) {
          if (e.source !== f.contentWindow || !e.data) return;
          if (e.data.cantusFirmusHeight) { lastH = e.data.cantusFirmusHeight; if (!full) f.style.height = lastH + "px"; }
          if ("cantusFirmusFull" in e.data) {
            full = !!e.data.cantusFirmusFull;
            f.style.cssText = full ? "position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;max-width:none;margin:0;border:0;z-index:9999" : (lastH ? "height:" + lastH + "px" : "");
            document.documentElement.style.overflow = full ? "hidden" : "";
          }
          if (e.data.cantusFirmusQuery) try { history.replaceState(null, "", "cantus-firmus.html" + e.data.cantusFirmusQuery); } catch (err) {}
        });
      })();
    </script>
