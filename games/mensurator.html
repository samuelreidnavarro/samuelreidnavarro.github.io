    function drawDiamond(ctx, x, y, size, filled) { ctx.beginPath(); ctx.moveTo(x, y - size); ctx.lineTo(x + size, y); ctx.lineTo(x, y + size); ctx.lineTo(x - size, y); ctx.closePath(); if (filled) ctx.fill(); else { ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke(); ctx.lineJoin = 'miter'; } }

    function drawMensuralNote(ctx, x, y, stateName, isInvulnerable, opacity = 1, isColored = false, isGhost = false) {
        ctx.save(); const cx = x + 12; const cy = y + 35; let isDotted = stateName.startsWith('DOTTED_'); let baseState = stateName.replace('DOTTED_', '');
        const inkA = rgba(C.ink, opacity);
        if (isGhost) { ctx.fillStyle = rgba(C.red, 0.55); ctx.strokeStyle = rgba(C.red, 0.55); }
        else if (isColored) { if (player.colorationTimer < 60 && Math.floor(Date.now() / 100) % 2 === 0) { ctx.fillStyle = inkA; ctx.strokeStyle = inkA; } else { if (!T.print) { ctx.shadowBlur = 14; ctx.shadowColor = rgba(C.mark, 0.85); } ctx.fillStyle = T.print ? C.ink : '#1f1a14'; ctx.strokeStyle = ctx.fillStyle; } }
        else { ctx.fillStyle = inkA; ctx.strokeStyle = inkA; }
        const solid = isColored || isGhost;
        if (T.white) {
            // white mensural notation by hand: void heads drawn with a broad pen, blackened when coloured
            const head = (rx, ry) => solid ? lozenge(ctx, cx, cy, rx, ry, true) : voidLozenge(ctx, cx, cy, rx, ry, 4.6);
            const stem = (len) => nib(ctx, wob(cx, cy - 11, cx + 0.4, cy - 11 - len, 0.4, 8), 3.2);
            const box = (w, h) => solid ? ctx.fillRect(cx - w / 2, cy - h / 2, w, h) : voidRect(ctx, cx - w / 2, cy - h / 2, w, h, 5);
            switch (baseState) {
                case 'FUSA': lozenge(ctx, cx, cy, 10, 12, true); stem(34); nib(ctx, [[cx, cy - 45], [cx + 8, cy - 36], [cx + 16, cy - 24]], 3); break;
                case 'SEMIMINIMA': lozenge(ctx, cx, cy, 10, 12, true); stem(24); break;
                case 'MINIMA': head(10, 12); stem(24); break;
                case 'SEMIBREVIS': head(12, 14); break;
                case 'BREVIS': box(22, 22); break;
                case 'LONGA': box(22, 22); nib(ctx, wob(cx + 10, cy + 10, cx + 10, cy + 30, 0.4), 3.2); break;
                case 'MAXIMA': box(36, 24); nib(ctx, wob(cx + 17, cy + 12, cx + 17, cy + 35, 0.4), 3.2); break;
            }
            if (isDotted) { ctx.beginPath(); ctx.arc(cx + 21, cy - 5, 3, 0, Math.PI * 2); ctx.fill(); }
            ctx.restore();
            return;
        }
        const hollow = C.paper;
        const r = T.print ? 0 : 3;
        switch(baseState) {
            case 'FUSA': drawDiamond(ctx, cx, cy, 10, true); ctx.fillRect(cx - 1.25, cy - 45, 2.5, 35); ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx, cy - 45); ctx.quadraticCurveTo(cx + 12, cy - 20, cx + 18, cy - 20); ctx.stroke(); break;
            case 'SEMIMINIMA': drawDiamond(ctx, cx, cy, 10, true); ctx.fillRect(cx - 1.25, cy - 35, 2.5, 25); break;
            case 'MINIMA': drawDiamond(ctx, cx, cy, 10, solid); ctx.fillRect(cx - 1.25, cy - 35, 2.5, 25); break;
            case 'SEMIBREVIS': drawDiamond(ctx, cx, cy, 13, solid); break;
            case 'BREVIS': ctx.lineWidth = 2.5; if (solid) { pathRoundRect(ctx, cx - 11, cy - 11, 22, 22, r); ctx.fill(); } else { pathRoundRect(ctx, cx - 11, cy - 11, 22, 22, r); ctx.stroke(); } break;
            case 'LONGA': ctx.lineWidth = 2.5; if (solid) { pathRoundRect(ctx, cx - 11, cy - 11, 22, 22, r); ctx.fill(); } else { const f = ctx.fillStyle; ctx.fillStyle = hollow; pathRoundRect(ctx, cx - 11, cy - 11, 22, 22, r); ctx.fill(); ctx.fillStyle = f; ctx.stroke(); } ctx.fillRect(cx + 9, cy, 2.5, 30); break;
            case 'MAXIMA': ctx.lineWidth = 2.5; if (solid) { pathRoundRect(ctx, cx - 18, cy - 12, 36, 24, r); ctx.fill(); } else { const f = ctx.fillStyle; ctx.fillStyle = hollow; pathRoundRect(ctx, cx - 18, cy - 12, 36, 24, r); ctx.fill(); ctx.fillStyle = f; ctx.stroke(); } ctx.fillRect(cx + 16, cy, 2.5, 35); break;
        }
        if (isDotted) { ctx.beginPath(); ctx.arc(cx + 20, cy - 5, 2.8, 0, Math.PI*2); ctx.fill(); }
        ctx.restore();
    }

    function pathRoundRect(ctx, x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }
    // Notes in white notation: void square heads cut as the broad pen makes them, heavy upright sides and thin top and bottom
    function ligHead(c, x, y, w, h, filled, k) {
        if (T.segments) y += (hashf(k * 5.3 + x) - 0.5) * 1.2; // each head its own sort
        if (filled) { c.fillRect(x, y, w, h); return; }
        if (T.hand) { voidRect(c, x + 1.5, y + 1.5, w - 3, h - 3, 4.6); return; }
        const t = 2.6, v = 4.4;
        c.fillRect(x, y, w, t); c.fillRect(x, y + h - t, w, t); c.fillRect(x, y, v, h); c.fillRect(x + w - v, y, v, h);
    }
    function ligStem(c, x, y0, y1) {
        if (T.hand) nib(c, wob(x, y0, x + 0.3, y1, 0.4, 6), 3);
        else c.fillRect(x - 1.25, Math.min(y0, y1), 2.5, Math.abs(y1 - y0));
    }
    function ligOblique(c, x, y0, w, y1, h, filled) {
        // a parallelogram with upright ends, as the obliqua is cut
        const band = (dy, t) => { c.beginPath(); c.moveTo(x, y0 + dy); c.lineTo(x + w, y1 + dy); c.lineTo(x + w, y1 + dy + t); c.lineTo(x, y0 + dy + t); c.closePath(); c.fill(); };
        if (filled) { band(0, h); return; }
        if (!T.hand) { band(0, 2.6); band(h - 2.6, 2.6); c.fillRect(x, y0, 4.4, h); c.fillRect(x + w - 4.4, y1, 4.4, h); return; }
        nib(c, [[x + 1.5, y0 + 1.5], [x + w - 1.5, y1 + 1.5], [x + w - 1.5, y1 + h - 1.5], [x + 1.5, y0 + h - 1.5], [x + 1.5, y0 + 1.5]], 4.6);
    }

    // ===================== Drawing the page =====================
    // the mensural C clef: two square heads either side of its line, on a stem
    function printCClef(c, x, y) {
        if (T.hand) {
            nib(c, wob(x, y - 24, x, y + 24, 0.6), 2.8);
            c.fillRect(x + 4, y - 15, 12, 10); c.fillRect(x + 4, y + 5, 12, 10);
            nib(c, wob(x + 16, y - 15, x + 16.3, y + 15, 0.3), 2.2);
        } else {
            c.fillRect(x, y - 25, 2.6, 50);
            c.fillRect(x + 4.5, y - 15, 12.5, 10.5); c.fillRect(x + 4.5, y + 4.5, 12.5, 10.5);
            c.fillRect(x + 15, y - 15, 2, 30);
        }
    }
    function drawClef(c, x, clef, oy = 0) {
        const y = FLOOR - (clef.line - 1) * GAP + oy;
        c.save(); c.translate(x, y); c.scale(1.2, 1.2);
        if (clef.k === 'F') printFClef(c, 0, 0); else printCClef(c, 0, 0);
        c.restore();
    }
    // b durum, the square b of mi
    function printQuadratum(c, x, y, s = 1) {
        c.save(); c.translate(x, y); c.scale(s, s);
        if (T.hand) nib(c, wob(0, -30, 0, 6, 0.4), 2.8); else c.fillRect(-1.3, -30, 2.6, 36);
        c.fillRect(-1.3, -11, 13, 3.2); c.fillRect(9, -11, 3, 17); c.fillRect(-1.3, 3, 13, 3.2);
        c.restore();
    }
    function finalBar(c, x) {
        if (T.hand) { nib(c, wob(x, STAFF_TOP, x, FLOOR, 0.6), 2.6); nib(c, wob(x + 9, STAFF_TOP, x + 9, FLOOR, 0.6), 7); }
        else { c.fillRect(x - 1.2, STAFF_TOP, 2.4, FLOOR - STAFF_TOP); c.fillRect(x + 6, STAFF_TOP, 6, FLOOR - STAFF_TOP); }
    }

    function drawGroup(c, g) {
        const n = g.notes, shaking = g.colored && g.stepped && !g.falling;
        const dy = g.dy + (g.oy || 0) + (shaking ? Math.sin(g.shake * 2) * 2 : 0);
        const filled = g.colored;
        const y = p => yP(p) + dy;
        c.fillStyle = C.ink; c.strokeStyle = C.ink;
        for (let i = 0; i < n.length; i++) {
            const a = n[i];
            if (a.obl) { const b = n[i + 1]; ligOblique(c, a.x, y(a.p) - HH / 2, a.w + b.w, y(b.p) - HH / 2, HH, filled); i++; continue; }
            ligHead(c, a.x, y(a.p) - HH / 2, a.w + 0.5, HH, filled, i + Math.round(g.x));
        }
        // where two notes of different pitch meet, a stroke joins them
        for (let i = 0; i < n.length - 1; i++) {
            if (n[i].obl) continue;
            const a = n[i], b = n[i + 1];
            if (a.p === b.p) continue;
            const y0 = Math.min(y(a.p), y(b.p)) - HH / 2, y1 = Math.max(y(a.p), y(b.p)) + HH / 2;
            ligStem(c, b.x + 1.2, y0, y1);
        }
        const f = n[0], l = n[n.length - 1], tail = 1.4 * GAP;
        if (g.stemL === 'down') ligStem(c, f.x + 1.2, y(f.p) + HH / 2 - 2, y(f.p) + HH / 2 + tail);
        else if (g.stemL === 'up') ligStem(c, f.x + 1.2, y(f.p) - HH / 2 + 2, y(f.p) - HH / 2 - tail);
        if (g.stemR || g.val === 'L' || g.val === 'MX') ligStem(c, l.x + l.w - 1.2, y(l.p) + HH / 2 - 2, y(l.p) + HH / 2 + tail);
        if (g.fermata) printFermata(c, l.x + l.w / 2, Math.min(y(l.p) - HH / 2 - 12, STAFF_TOP + (g.oy || 0) - 14));
    }

    function drawCheckpoint(c, cp) {
        const col = cp.active ? C.mark : rgba(C.mark, T.mono ? 1 : 0.3);
        c.fillStyle = col; c.strokeStyle = col;
        if (T.hand) { nib(c, wob(cp.x + 1.5, STAFF_TOP, cp.x + 1.5, FLOOR, 0.6), 2.6); nib(c, wob(cp.x + 9.5, STAFF_TOP, cp.x + 9.5, FLOOR, 0.6), 2.6); }
        else { c.fillRect(cp.x, STAFF_TOP, 2.6, FLOOR - STAFF_TOP); c.fillRect(cp.x + 8, STAFF_TOP, 2.6, FLOOR - STAFF_TOP); }
        printFermata(c, cp.x + 5.3, STAFF_TOP - 14);
        if (cp.active) { c.textAlign = 'center'; c.font = font(13, 600, true); c.fillText(cp.label, cp.x + 5, STAFF_TOP - 38); }
    }

    function drawSystem(c, s) {
        const x0 = Math.max(s.x0, cameraX - 40), x1 = Math.min(s.x1, cameraX + W + 40), oy = s.oy || 0;
        if (x1 <= x0 || STAFF_TOP + oy > cameraY + H + 60 || FLOOR + oy < cameraY - 60) return;
        drawStaff(c, x0, x1, STAFF_TOP + oy, GAP);
        c.fillStyle = C.ink; c.strokeStyle = C.ink;
        if (s.x0 > cameraX - 200) {
            drawClef(c, s.x0 + 16, s.clef, oy);
            if (s.first) printSignature(c, s.x0 + 98, yP(4) + oy, GAP);
            if (s.label) {
                // the rubric naming the mode at the head of its first line
                c.fillStyle = (T.mono || T.hand) ? C.red : C.red; c.textAlign = 'left'; c.font = font(15, 600, true);
                c.fillText(modesData[s.modeIdx].name, s.x0 + (oy ? 90 : 4), STAFF_TOP + oy - (oy ? 12 : 22));
                c.fillStyle = C.ink;
            }
        }
        if (s.x1 < cameraX + W + 60 && s.x1 !== Infinity) {
            c.strokeStyle = C.ink; c.fillStyle = C.ink;
            if (s.final) finalBar(c, s.x1 - 16);
            else if (s.custos != null) printCustos(c, s.x1 - 30, yP(s.custos) + oy);
        }
    }

    function drawWorld() {
        const L = currentLevelData;
        ctx.save(); ctx.translate(-cameraX, -cameraY);
        const vis = (x, w = 60) => x + w > cameraX - 60 && x < cameraX + W + 60;

        L.systems.forEach(s => drawSystem(ctx, s));
        if (L.inscription && vis(150, 300)) { ctx.fillStyle = C.inkSoft; ctx.textAlign = 'left'; ctx.font = font(15, 400, true); ctx.fillText(L.inscription, 150, STAFF_TOP - 22); }

        ctx.textAlign = 'left';
        L.checkpoints.forEach(cp => { if (vis(cp.x)) drawCheckpoint(ctx, cp); });
        if (gameMode === 'CLASSIC' && L.goal.x < Infinity && vis(L.goal.x - 40, 100)) {
            ctx.fillStyle = C.mark; ctx.font = font(16, 600, true); ctx.textAlign = 'right';
            ctx.fillText('Finalis', L.goal.x - 10, STAFF_TOP - 24);
        }

        if (boss.active) {
            ctx.textAlign = 'left';
            ctx.fillStyle = C.red; ctx.strokeStyle = C.red;
            // mi contra fa: b durum against b rotundum, the forbidden tritone
            printQuadratum(ctx, boss.x - 6, boss.y + 52, 1.8); printFlat(ctx, boss.x + 40, boss.y + 52, 1.8);
            pill(boss.x - 20, boss.y - 20, 90, 6, C.line);
            if (boss.hp > 0) pill(boss.x - 20, boss.y - 20, Math.max(6, 90 * (boss.hp / boss.maxHp)), 6, C.red);
            ctx.fillStyle = C.red; ctx.font = font(13, 600, true); ctx.fillText('Mi contra Fa, diabolus in musica', boss.x - 70, boss.y - 30);
            boss.projectiles.forEach(bp => { if (bp.mi) printQuadratum(ctx, bp.x + 4, bp.y + 16, 0.7); else printFlat(ctx, bp.x + 4, bp.y + 16, 0.7); });
        }

        // the perfect longa rests waiting above the staff
        L.thwomps.forEach(t => {
            if (t.dead || !vis(t.x)) return;
            const lx = t.x + (t.state === 'shaking' ? (Math.random() > 0.5 ? 2 : -2) : 0);
            ctx.fillStyle = (t.state === 'shaking' || t.state === 'falling') ? C.redHot : C.red;
            printRest(ctx, lx + t.w / 2, t.y, t.h, 9);
        });

        L.groups.forEach(g => { if (vis(g.x, g.w) && g.dy < 500) drawGroup(ctx, g); });

        // semiminims to gather: black heads with their stems
        ctx.fillStyle = C.ink; ctx.strokeStyle = C.ink;
        L.notes.forEach(n => { if (n.active && vis(n.x)) { const cy = yP(n.p) + (n.oy || 0); lozenge(ctx, n.x + 7.5, cy, 6.5, 8.5, true); ligStem(ctx, n.x + 7.5, cy - 4, cy - 30); } });

        L.powerups.forEach(it => {
            if (!it.active || !vis(it.x)) return;
            if (it.kind === 'dupla') { ctx.fillStyle = C.blue; ctx.strokeStyle = C.blue; printMensuration(ctx, it.x + 12.5, it.y + 12.5, 'C|', 14); }
            else if (it.kind === 'tempus') { ctx.fillStyle = C.ink; ctx.strokeStyle = C.ink; printMensuration(ctx, it.x + 12.5, it.y + 12.5, 'O', 14); }
            else { ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(it.x + 10, it.y + 15, 10, 0, Math.PI * 2); ctx.fill(); pathRoundRect(ctx, it.x + 5, it.y, 10, 10, 2); ctx.fill(); }
        });

        L.rests.forEach(e => {
            if (e.dead || !vis(e.x)) return;
            ctx.fillStyle = e.aggro ? C.redHot : C.red;
            printRest(ctx, e.x + e.w / 2, e.y, e.h, e.aggro ? 9 : 8);
        });
        ctx.fillStyle = C.red; ctx.strokeStyle = C.red;
        L.flats.forEach(f => { if (!f.dead && vis(f.x)) printFlat(ctx, f.x + 5, f.y + 34, 1.15); });
        L.sharps.forEach(s => { if (!s.dead && vis(s.x)) printSharp(ctx, s.x + 2, s.y + 15, 0.95); });
        ctx.fillStyle = C.ink; projectiles.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill(); });

        if (gameMode === 'GRADUS') { ctx.fillStyle = C.ink; ctx.fillRect(-1000, cameraY + H + 24, W + 2000, 1000); ctx.fillStyle = C.red; ctx.fillRect(-1000, cameraY + H + 24, W + 2000, 2); }
        if (gameMode === 'ENDLESS') { ctx.fillStyle = C.ink; ctx.fillRect(cameraX - 1000, -500, 1000 - 24, H + 1000); ctx.fillStyle = C.red; ctx.fillRect(cameraX - 26, -500, 2, H + 1000); }

        if (L.hasFuga && player.history.length === 60) { const g = player.history[0]; drawMensuralNote(ctx, g.x, g.y, noteStates[g.state], false, 0.6, false, true); }
        const isColored = player.colorationTimer > 0;
        trail.forEach((t, i) => drawMensuralNote(ctx, t.x, t.y, noteStates[t.state], false, (i + 1) / 14, isColored));
        if (!(player.invulnerableTimer > 0 && gameState === 'PLAY' && Math.floor(Date.now() / 80) % 2 === 0)) drawMensuralNote(ctx, player.x, player.y, noteStates[getStateIndex(player.stateValue)], player.invulnerableTimer > 0, 1, isColored);

        particles.forEach(p => { ctx.fillStyle = p.color === '#b30000' ? C.red : (p.color || rgba(C.soft, 0.45)); ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill(); });
        ctx.restore();
    }
    function drawFsButton() {
        // The full screen button is now an HTML button in the corner of the game (#fsBtn)
        FS_BTN.w = 0; return;
        if (!fsAvailable) { FS_BTN.w = 0; return; }
        const label = fsLabel(), b = FS_BTN;
        ctx.textAlign = 'center';
        if (T.print) {
            ctx.font = font(15, 500, false, 'sc');
            b.w = Math.ceil(ctx.measureText(label).width) + 16; b.h = THEME_BTN.h; b.y = THEME_BTN.y; b.x = THEME_BTN.x - b.w;
            ctx.fillStyle = C.red; ctx.fillText(label, b.x + b.w / 2, b.y + 19);
        } else {
            ctx.font = font(13, 600);
            b.w = Math.ceil(ctx.measureText(label).width) + 28; b.h = THEME_BTN.h; b.y = THEME_BTN.y; b.x = THEME_BTN.x - 8 - b.w;
            pill(b.x, b.y, b.w, b.h, C.paper, C.line);
            ctx.fillStyle = C.ink; ctx.fillText(label, b.x + b.w / 2, b.y + 20);
        }
    }

    function drawThemeButton() {
        const b = THEME_BTN;
        ctx.textAlign = 'center';
        if (T.print) {
            ctx.fillStyle = C.red; ctx.font = font(14, 500, false, 'sc');
            ctx.fillText('❧ ' + T.name, b.x + b.w / 2, b.y + 19);
        } else {
            pill(b.x, b.y, b.w, b.h, C.paper, C.line);
            ctx.fillStyle = C.ink; ctx.font = font(13, 600);
            ctx.fillText('◐ ' + T.name, b.x + b.w / 2, b.y + 20);
        }
    }

    function drawPrintMenu() {
        if (!menuArt) menuArt = buildMenuArt();
        ctx.drawImage(menuArt, 0, 0, W, H);
        const tx = T.hand ? 222 : 200, ty = T.hand ? 132 : 122;
        ctx.textAlign = 'left';
        ctx.fillStyle = (T.hand || T.mono) ? C.ink : C.red;
        if (T.hand) { ctx.font = `600 76px ${GOTH}`; spacing(1); }
        else { ctx.font = `62px ${FELL_BIG}`; spacing(5); }
        ctx.fillText(T.hand ? 'ensurator' : 'ENSURATOR', tx, ty);
        spacing(0);
        ctx.fillStyle = T.hand ? C.red : C.ink;
        ctx.font = T.hand ? `400 21px ${GOTH}` : `italic 19px ${FELL}`;
        ctx.textAlign = T.hand ? 'left' : 'center';
        ctx.fillText('Unmute your device for sound!', T.hand ? 222 : 400, T.hand ? 162 : 162);

        MENU_BTNS.forEach((b, i) => {
            const y = b.y + 25, hover = menuHover === i;
            if (T.hand) {
                ctx.fillStyle = i % 2 ? PIG.blue : PIG.red; ctx.font = `700 26px ${GOTH}`; ctx.textAlign = 'left';
                ctx.fillText('¶', b.x + 4, y);
                ctx.fillStyle = C.ink; ctx.font = `${i === 0 ? 600 : 500} 27px ${GOTH}`;
            } else {
                ctx.fillStyle = C.red; ctx.strokeStyle = C.red;
                fleuron(ctx, b.x + 8, y - 7, 0.9);
                ctx.fillStyle = (i === 0 && !T.mono) ? C.red : C.ink; ctx.font = `${i === 0 ? 26 : 24}px ${FELL}`;
            }
            ctx.textAlign = 'left';
            ctx.fillText(b.label, b.x + 30, y);
            if (hover) { const w = ctx.measureText(b.label).width; ctx.fillRect(b.x + 30, y + 5, w, 1.2); }
        });

        // Install and theme
        const ib = INSTALL_BTN;
        ctx.textAlign = 'center'; ctx.fillStyle = C.red; ctx.font = font(15, 500, false, 'sc');
        ctx.fillText('Install', ib.x + ib.w / 2, ib.y + 19);
        drawThemeButton();
        drawFsButton();

        const credit = 'Feedback > mensuratorgame@gmail.com  Samuel Reid Navarro  ·  ' + lastUpdateText();
        ctx.fillStyle = C.ink; ctx.textAlign = 'center';
        ctx.font = T.hand ? `400 13px ${GOTH}` : `italic 13px ${FELL}`;
        ctx.fillText(credit, W / 2, T.hand ? 368 : 362);
    }

    function drawMenu() {
        if (T.print) { drawPrintMenu(); return; }
        // Faint staff behind the title
        ctx.strokeStyle = C.line; ctx.lineWidth = 1;
        for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(60, 50.5 + i * 11); ctx.lineTo(W - 60, 50.5 + i * 11); ctx.stroke(); }
        ctx.fillStyle = C.mark;
        drawDiamond(ctx, 86, 72, 7, true);
        ctx.strokeStyle = C.mark; drawDiamond(ctx, W - 86, 83, 7, false);

        let titleSize = 58;
        const mainTitle = 'MENSURATOR';
        ctx.textAlign = 'center';
        spacing(10);
        for (;;) {
            ctx.font = font(titleSize, 800);
            if (ctx.measureText(mainTitle).width <= 540 || titleSize <= 30) break;
            titleSize -= 2;
        }
        const tw = ctx.measureText(mainTitle).width;
        ctx.fillStyle = C.paper; ctx.fillRect(W / 2 - tw / 2 - 18, 44, tw + 36, 56);
        ctx.fillStyle = C.ink;
        ctx.fillText(mainTitle, W / 2 + 5, 94);
        spacing(0);

        ctx.fillStyle = C.soft;
        ctx.font = font(13, 500);
        ctx.fillText('Unmute your device for sound!', W / 2, 130);

        MENU_BTNS.forEach((b, i) => {
            const hover = menuHover === i;
            ctx.save();
            if (b.primary) {
                const pulse = (Math.sin(Date.now() / 400) + 1) / 2;
                ctx.shadowColor = `rgba(156, 107, 60, ${0.18 + pulse * 0.22})`;
                ctx.shadowBlur = 10 + pulse * 10; ctx.shadowOffsetY = 3;
                pill(b.x, b.y, b.w, b.h, hover ? '#2a231a' : C.ink, null, 16);
            } else {
                pill(b.x, b.y, b.w, b.h, hover ? C.band : C.paper, hover ? C.mark : C.line, 16);
            }
            ctx.restore();
            const m = b.label.match(/^(.*) \((.*)\)$/);
            ctx.textAlign = 'center';
            ctx.fillStyle = b.primary ? C.paper : C.ink;
            if (m) {
                ctx.font = font(17, 700);
                ctx.fillText(m[1], b.x + b.w / 2, b.y + 26);
                ctx.fillStyle = b.primary ? 'rgba(255, 253, 248, 0.65)' : C.soft;
                ctx.font = font(11, 600); spacing(1.5);
                ctx.fillText(m[2].toUpperCase(), b.x + b.w / 2, b.y + 43);
                spacing(0);
            } else {
                ctx.font = font(17, 700);
                ctx.fillText(b.label, b.x + b.w / 2, b.y + 34);
            }
        });

        // Install Button (Top Right)
        const ib = INSTALL_BTN;
        pill(ib.x, ib.y, ib.w, ib.h, C.paper, C.line);
        ctx.fillStyle = C.ink;
        ctx.font = font(13, 600);
        ctx.textAlign = 'center';
        ctx.fillText('Install', ib.x + ib.w / 2, ib.y + 20);
        drawThemeButton();
        drawFsButton();

        const credit = 'Feedback > mensuratorgame@gmail.com  Samuel Reid Navarro  ·  ' + lastUpdateText();
        ctx.fillStyle = C.soft;
        ctx.font = font(11, 500);
        ctx.fillText(credit, W / 2, 374);
    }

    function drawStatusPill(text, color, y) {
        if (T.print) {
            ctx.font = font(15, 600, true); ctx.fillStyle = color; ctx.textAlign = 'right';
            ctx.fillText(text, W - 24, y + 15);
            return y + 22;
        }
        ctx.font = font(12, 700);
        const w = ctx.measureText(text).width + 22;
        ctx.save(); ctx.globalAlpha = 0.12; pill(W - 24 - w, y, w, 22, color); ctx.restore();
        ctx.fillStyle = color; ctx.textAlign = 'right';
        ctx.fillText(text, W - 35, y + 15);
        return y + 28;
    }
    function draw() {
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.clearRect(0, 0, W, H);
        ctx.textBaseline = 'alphabetic';
        titleDevBtn.style.display = (gameState === 'MENU') ? 'block' : 'none';
        syncTouchGameChrome();
        if (gameState === 'MENU') { drawMenu(); return; }

        if (currentLevelData && ['PLAY', 'SPLASH', 'DEATH_FREEZE', 'WIN', 'PAUSE'].includes(gameState)) {
            drawWorld();
        if (gameState === 'SPLASH') {
            veil(0.95);

            ctx.textAlign = 'center';
            const titleSplash = modesData[currentLevel].name;
            const colon = titleSplash.indexOf(':');
            const splashLabel = colon > 0 ? titleSplash.slice(0, colon) : '';
            const splashName = colon > 0 ? titleSplash.slice(colon + 1).trim() : titleSplash;
            if (splashLabel) {
                ctx.fillStyle = C.mark; ctx.font = font(13, 700, false, "sc"); spacing(3);
                ctx.fillText(splashLabel.toUpperCase(), W / 2 + 1.5, 92);
                spacing(0);
            }
            let nameSize = 42;
            for (;;) { ctx.font = font(nameSize, 800, false, "display"); if (ctx.measureText(splashName).width <= 700 || nameSize <= 22) break; nameSize -= 2; }
            ctx.fillStyle = C.ink;
            ctx.fillText(splashName, W / 2, 142);

            ctx.fillStyle = C.line; ctx.fillRect(W / 2 - 24, 166, 48, 2);

            ctx.fillStyle = C.inkSoft; ctx.font = font(17, 400, true);
            const quoteSplash = modesData[currentLevel].quote;
            const quoteParts = quoteSplash.split(' - ');
            const quoteBody = quoteParts[0];
            const quoteAuthor = quoteParts.length > 1 ? quoteParts[1] : '';
            const maxWidth = 640;
            const quoteWords = quoteBody.split(' ');
            let quoteLines = [];
            let quoteLine = '';
            for (let word of quoteWords) {
                const test = quoteLine + (quoteLine ? ' ' : '') + word;
                if (ctx.measureText(test).width > maxWidth && quoteLine) {
                    quoteLines.push(quoteLine);
                    quoteLine = word;
                } else {
                    quoteLine = test;
                }
            }
            if (quoteLine) quoteLines.push(quoteLine);
            let qy = 206;
            for (let ql of quoteLines) {
                ctx.fillText(ql, W / 2, qy);
                qy += 24;
            }
            if (quoteAuthor) {
                ctx.fillStyle = C.soft;
                ctx.font = font(13, 500);
                ctx.fillText(quoteAuthor, W / 2, qy + 4);
            }

            ctx.fillStyle = rgba(C.mark, T.print ? 1 : 0.55 + Math.sin(Date.now() / 300) * 0.45);
            ctx.font = font(14, 600);
            ctx.fillText('Press any key or tap to continue', W / 2, H - 40);
            // the mode's two pillars: where its melodies end, and where they recite
            const mi = modeInfo(currentLevel), nm = d => NOTE_NAMES[dMod(d)];
            ctx.fillStyle = C.soft; ctx.font = font(14, 500, true);
            ctx.fillText(`Finalis ${nm(mi.final)}   ·   Repercussio ${nm(mi.dom)}   ·   ${mi.plagal ? 'plagalis' : 'authenticus'}`, W / 2, H - 76);
        } else if (gameState !== 'DEATH_FREEZE' && gameState !== 'WIN' && gameState !== 'MENU' && gameState !== 'PAUSE') {
            if (currentLevel === 0 && gameMode === 'CLASSIC') {
                ctx.save();

                // Control hints at the start of the level
                if (player.x < 1000) {
                    ctx.globalAlpha = 0.7 + Math.sin(Date.now() / 400) * 0.2;
                    ctx.fillStyle = C.soft;
                    ctx.textAlign = 'center';

                    if (isTouchDevice) {
                        ctx.font = font(32, 800);
                        ctx.fillText('Touch the four quarters:  ◀  ▶  ●  ▲', W / 2, 124);
                        ctx.font = font(26, 700);
                        ctx.fillText('↓', W / 2, 156);
                        ctx.font = font(16, 500, true);
                        ctx.fillText('Unmute your device for sound!', W / 2, 184);
                        ctx.font = font(44, 700);
                        ctx.fillText('→', W / 2, 228);
                    } else {
                        ctx.font = font(32, 800);
                        ctx.fillText('Controls: WASD or ← → ↑', W / 2, 128);
                        ctx.font = font(16, 500, true);
                        ctx.fillText('Unmute your device for sound!', W / 2, 156);
                        ctx.font = font(44, 700);
                        ctx.fillText('→', W / 2, 200);
                    }
                    ctx.textAlign = 'left';
                }
                if (player.x > 2800 && player.x < 32000) {
                    ctx.globalAlpha = 0.7 + Math.sin(Date.now() / 450) * 0.2;
                    ctx.fillStyle = C.soft;
                    ctx.textAlign = 'left';
                    ctx.font = font(36, 700);
                    ctx.fillText('↠', 380, 150);
                    ctx.globalAlpha = 0.85;
                    ctx.font = font(20, 700);
                    ctx.fillText('Double tap to run!', 400, 186);
                }

                ctx.restore();
            }
        }

            if (gameState !== 'SPLASH') {
            // Soft paper band so the HUD stays readable over the level
            const hudFade = ctx.createLinearGradient(0, 0, 0, 84);
            hudFade.addColorStop(0, rgba(C.paper, 0.92));
            hudFade.addColorStop(0.7, rgba(C.paper, 0.75));
            hudFade.addColorStop(1, rgba(C.paper, 0));
            if (!T.print) { ctx.fillStyle = hudFade; ctx.fillRect(0, 0, W, 84); }

            if (gameMode === 'CLASSIC') {
                let progress = player.x / currentLevelData.goal.x; if (progress > 1) progress = 1; if (progress < 0) progress = 0;
                pill(24, H - 10, W - 48, 4, C.line);
                if (progress > 0) pill(24, H - 10, Math.max(4, (W - 48) * progress), 4, C.mark);
            }

            ctx.textAlign = 'left';
            ctx.fillStyle = (T.print && !T.mono) ? C.red : C.soft;
            ctx.font = font(11, 700, false, "sc"); spacing(2);
            const modeLabel = modesData[currentLevel].name.split(':')[0];
            ctx.fillText(modeLabel.toUpperCase(), 24, 30);
            spacing(0);

            ctx.fillStyle = C.ink;
            ctx.font = font(22, 800, false, "display");
            ctx.fillText(modesData[currentLevel].modeName, 24, 54);

            const maxQuoteWidth = 380;
            ctx.textAlign = 'center';
            ctx.fillStyle = C.inkSoft;
            ctx.font = font(14, 400, true);
            const quoteText = modesData[currentLevel].quote;

            const lastDashIndex = quoteText.lastIndexOf(' - ');
            const quoteBody = quoteText.substring(0, lastDashIndex);
            const author = quoteText.substring(lastDashIndex + 3);

            const words = quoteBody.split(' ');
            let lines = [];
            let currentLine = '';
            for (let word of words) {
                const testLine = currentLine + (currentLine ? ' ' : '') + word;
                if (ctx.measureText(testLine).width > maxQuoteWidth && currentLine) {
                    lines.push(currentLine);
                    currentLine = word;
                } else {
                    currentLine = testLine;
                }
            }
            if (currentLine) lines.push(currentLine);

            let startY = 32;
            for (let line of lines) {
                ctx.fillText(line, W / 2, startY);
                startY += 18;
            }
            ctx.fillStyle = C.soft;
            ctx.font = font(11, 500);
            ctx.fillText(author, W / 2, startY + 1);

            ctx.textAlign = 'right';
            const mins = Math.floor(levelTime / 60), secs = Math.floor(levelTime % 60);
            ctx.fillStyle = C.ink;
            ctx.font = font(22, 800, false, "display");
            ctx.fillText(mins + ':' + secs.toString().padStart(2, '0'), W - 24, 38);

            ctx.fillStyle = C.soft;
            ctx.font = font(13, 600);
            ctx.fillText('Puncta: ' + player.score, W - 24, 58);

            let statusY = 70;
            if (player.tempusTimer > 0) statusY = drawStatusPill('Tempus Perfectum!', C.ink, statusY);
            if (player.allaBreveTimer > 0) statusY = drawStatusPill('Proportio Dupla!', C.blue, statusY);
            if (player.colorationTimer > 0) statusY = drawStatusPill('Coloratio!', C.mark, statusY);
            if (currentLevelData.hasFuga && player.history.length === 60) statusY = drawStatusPill('Fuga: Canon pursues!', C.red, statusY);
            if (boss.active) {
                statusY = drawStatusPill('CAVE DIABOLUM!', C.red, statusY);

                // Blinking shoot instruction
                ctx.textAlign = 'center';
                ctx.fillStyle = C.red;
                ctx.font = font(26, 800); spacing(2);
                if (Math.floor(Date.now() / 400) % 2 === 0) {
                    ctx.fillText(isTouchDevice ? 'SHOOT!' : 'SHOOT WITH SPACEBAR!', W / 2, 120);
                }
                spacing(0);
            }

            if (!isTouchDevice) {
                ctx.fillStyle = C.soft;
                ctx.font = font(11, 500);
                ctx.textAlign = 'center';
                ctx.fillText('< > = Run/Sprint | ^ = Jump | SPACE = Shoot | ESC = Pause', W / 2, H - 18);
            }
            }
        }

        if (gameState === 'DEATH_FREEZE') {
            veil(0.8);

            ctx.textAlign = 'center';
            ctx.fillStyle = C.red;
            ctx.font = font(44, 800, false, "display"); spacing(4);
            ctx.fillText('CANTUS INTERRUPTUS', W / 2 + 2, H / 2 + 6);
            spacing(0);

            ctx.fillStyle = C.soft;
            ctx.font = font(14, 600);
            ctx.fillText('Press any key or tap to continue', W / 2, H / 2 + 48);

            if (gameMode === 'ENDLESS' || gameMode === 'GRADUS') {
                ctx.fillStyle = C.ink;
                ctx.font = font(15, 700);
                ctx.fillText(`Spatium Ultimatum: ${endlessDistance}`, W / 2, H / 2 + 80);
            }
        }

        if (gameState === 'NAME_INPUT' || gameState === 'RESULT') {
            drawNameInput();
        } else if (gameState === 'LEADERBOARD') {
            drawLeaderboard();
        } else if (gameState === 'INSTALL_PROMPT') {
            veil(0.98);
            ctx.fillStyle = C.ink;
            ctx.textAlign = 'center';
            ctx.font = font(22, 600);
            ctx.fillText('For optimal playing experience on iPhone,', W / 2, H / 2 - 34);
            ctx.fillText('press the ••• button, press Share ', W / 2, H / 2);
            ctx.fillText('and select "Add to Home Screen".', W / 2, H / 2 + 34);

            ctx.fillStyle = C.mark;
            ctx.font = font(13, 600);
            ctx.fillText('Tap anywhere to return', W / 2, H - 30);
        }
    }

    function loop(now) { 
        if (typeof now !== 'number') now = performance.now();
        let dt = now - lastTime;
        if (dt > 250) dt = 250; 
        lastTime = now;
        accumulator += dt;
        while (accumulator >= FIXED_DT_MS) {
            if (gameState === 'PLAY') levelTime += (FIXED_DT_MS / 1000) * speedSettings[difficultyIndex].mult;
            update();
            accumulator -= FIXED_DT_MS;
        }
        draw();
        fx.render();
        requestAnimationFrame(loop); 
    }
    let savedTheme = 'rubrica';
    try { savedTheme = localStorage.getItem('mensuratorTheme') || 'rubrica'; } catch (e) {}
    applyTheme(savedTheme);
    if (location.hash === '#install') { gameState = 'INSTALL_PROMPT'; history.replaceState(null, '', location.pathname); }
    fitResolution();
    syncFsLabels(); updateMobileControlLayout();
    requestAnimationFrame(loop);
</script>
</body>
</html>
