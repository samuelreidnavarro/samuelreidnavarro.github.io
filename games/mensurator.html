<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MENSURATOR</title>
    <!-- Opened from the Home Screen, the game runs without any browser bars -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mensurator">
    <meta name="theme-color" content="#efe6d3">
    <link rel="apple-touch-icon" href="mensurator-icon.png">
    <link rel="manifest" href="mensurator.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Noto+Music&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=IM+Fell+Double+Pica&family=Grenze+Gotisch:wght@400;500;600;700&display=swap">
    <style>
        :root {
            --bg: #fbf7ef;
            --paper: #fffdf8;
            --band: #f1e8d8;
            --ink: #3b3125;
            --soft: #8a7b66;
            --line: #e0d4c0;
            --mark: #9c6b3c;
            --red: #b5473a;
            --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color-scheme: light;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            font-family: var(--sans);
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        #gameWrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 12px;
        }

        body.embedded #gameWrapper { padding: 0; }
        body.embedded #canvasContainer { max-width: calc(100vh * 2); max-width: calc(100dvh * 2); }
        body.embedded #fxCanvas { box-shadow: none; }
        #canvasContainer {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 2 / 1;
            max-width: calc((100vh - 24px) * 2);
            max-width: calc((100dvh - 24px) * 2);
        }

        canvas {
            width: 100%;
            height: 100%;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 1px 2px rgba(59, 49, 37, 0.05), 0 10px 30px rgba(59, 49, 37, 0.07);
            transition: filter 0.15s;
            display: block;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .bullet-time { filter: grayscale(0.85) contrast(1.05); }
        .alla-breve { filter: saturate(1.6) hue-rotate(-12deg); }

        /* Paper-and-ink layer for the print themes; the game canvas underneath still takes the clicks */
        #fxCanvas {
            display: none; position: absolute; inset: 0; width: 100%; height: 100%;
            pointer-events: none; border-radius: 3px;
            box-shadow: 0 1px 2px rgba(40, 28, 16, 0.12), 0 10px 30px rgba(40, 28, 16, 0.12);
            transition: filter 0.15s;
        }
        body:not([data-theme="modern"]) canvas#gameCanvas { border-radius: 3px; border-color: transparent; box-shadow: none; }
        #canvasContainer:has(#gameCanvas.bullet-time) #fxCanvas { filter: grayscale(0.85) contrast(1.05); }
        #canvasContainer:has(#gameCanvas.alla-breve) #fxCanvas { filter: saturate(1.6) hue-rotate(-12deg); }
        #themeSelect {
            display: block; width: 100%; margin-top: 8px; padding: 9px 12px;
            font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink);
            background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
        }

        .html-btn {
            display: flex; align-items: center; justify-content: center;
            width: 34px; height: 34px; padding: 0;
            background: rgba(255, 253, 248, 0.85);
            color: var(--ink);
            border: 1px solid var(--line);
            font-family: inherit; font-size: 16px; font-weight: 600;
            border-radius: 999px; cursor: pointer;
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        }
        .html-btn:hover { border-color: var(--mark); }
        .html-btn:active { background: var(--band); }

        /* On-screen controls, shown only on touch devices */
        #pad {
            --b: min(66px, 17vh, calc((100vw - 80px) / 4.3));
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 34;
            display: none; justify-content: space-between; align-items: flex-end;
            padding: 0 max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            pointer-events: none;
        }
        #pad.show { display: flex; }
        .pad-cluster { display: flex; align-items: flex-end; gap: 12px; }
        .pad-dir { display: grid; grid-template-columns: var(--b) var(--b); gap: 12px; }
        .pad-dir .pad-btn[data-k="down"] { grid-column: 1 / span 2; justify-self: center; width: calc(var(--b) * 0.8); height: calc(var(--b) * 0.8); }
        .pad-btn {
            pointer-events: auto;
            width: var(--b); height: var(--b); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            background: rgba(255, 253, 248, 0.42);
            border: 1.5px solid rgba(156, 107, 60, 0.5);
            color: var(--mark); font-family: inherit; font-size: calc(var(--b) * 0.36); font-weight: 700; line-height: 1;
            box-shadow: 0 4px 14px rgba(59, 49, 37, 0.08);
            user-select: none; -webkit-user-select: none;
        }
        .pad-btn.on { background: var(--mark); color: var(--paper); border-color: var(--mark); }
        .pad-btn[data-k="jump"] { width: calc(var(--b) * 1.2); height: calc(var(--b) * 1.2); }
        .pad-btn[data-k="shoot"] { margin-bottom: calc(var(--b) * 0.75); }
        #pad:not(.kart) .pad-btn[data-k="down"] { display: none; }
        @media (max-height: 500px) and (orientation: landscape) {
            .menu-box { padding: 16px 20px; }
            .menu-box h2 { margin-bottom: 10px; }
            .slider-container { margin: 8px 0; }
            .menu-box hr { margin: 10px 0; }
        }
        body.no-fs #fsPauseBtn { display: none; }

        #tPause {
            position: fixed; top: 10px; right: 10px; width: 44px; height: 44px;
            font-size: 13px; font-weight: 800; letter-spacing: 1px; border-radius: 50%;
            background: rgba(255, 253, 248, 0.85); border: 1px solid var(--line); color: var(--ink);
            display: none; justify-content: center; align-items: center; z-index: 35;
            box-shadow: 0 4px 14px rgba(59, 49, 37, 0.08);
        }


        @media (orientation: portrait) {
            body { justify-content: flex-start; }
            #gameWrapper { flex-direction: column; justify-content: flex-start; height: 100%; }
            #canvasContainer { flex-shrink: 0; margin-top: 10px; }
        }

        #titleDevBtn {
            position: fixed;
            bottom: 12px;
            left: 12px;
            z-index: 25;
            padding: 5px 10px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--soft);
            background: transparent;
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
        }
        #titleDevBtn:hover { color: var(--ink); border-color: var(--mark); }

        /* Overlays and panels */
        .overlay {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(251, 247, 239, 0.72);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            z-index: 30; justify-content: center; align-items: center; flex-direction: column;
        }
        .menu-box {
            background: var(--paper); color: var(--ink);
            padding: 28px 32px; border: 1px solid var(--line); border-radius: 18px;
            box-shadow: 0 20px 50px rgba(59, 49, 37, 0.14);
            text-align: center; pointer-events: auto; max-width: 92%; width: 440px;
        }
        .menu-box h2 { margin: 0 0 18px; color: var(--ink); font-size: 22px; font-weight: 800; letter-spacing: 3px; }
        .menu-box p { color: var(--soft); font-size: 14px; margin: 0 0 8px; }
        .menu-box hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
        .slider-container { margin: 14px 0; font-size: 13px; font-weight: 500; color: var(--soft); text-align: left; }
        .slider-container label { display: block; }
        .slider-value { float: right; color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
        .speed-name { display: block; margin-top: 4px; color: var(--ink); font-weight: 600; font-size: 14px; }
        .slider-container input[type=range] { width: 100%; margin-top: 10px; cursor: pointer; accent-color: var(--mark); }
        .menu-btn {
            background: var(--ink); color: var(--paper); border: 1px solid var(--ink);
            padding: 11px 20px; font-family: inherit; font-size: 15px; font-weight: 600;
            border-radius: 999px; cursor: pointer; margin: 6px 4px;
        }
        .menu-btn:hover { background: #2a231a; }
        .menu-btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
        .menu-btn.ghost:hover { border-color: var(--mark); }
        .menu-btn.danger { background: transparent; color: var(--red); border-color: rgba(181, 71, 58, 0.4); }
        .menu-btn.danger:hover { border-color: var(--red); }
        .menu-btn.block { display: block; width: 100%; margin: 0 0 10px; }
        .dev-section-label { color: var(--mark); font-weight: 700; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; text-align: center; }
        .dev-stage-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
        .dev-stage-btn {
            padding: 9px 4px; font-family: inherit; font-size: 13px; font-weight: 600;
            border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
        }
        .dev-stage-btn:hover { border-color: var(--mark); }
        .dev-warp {
            display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
            margin: 12px 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
        }
        .dev-warp label { color: var(--ink); font-weight: 600; font-size: 13px; }
        .dev-warp input {
            width: 64px; padding: 6px; font-family: inherit; font-size: 15px; font-weight: 600; text-align: center;
            color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
        }
        .dev-check { color: var(--red); font-weight: 700; cursor: pointer; text-align: center; }
        .dev-check input { width: auto; margin-right: 8px; accent-color: var(--red); }

        #mobileNameInputOverlay {
            position: fixed; inset: 0; z-index: 50;
            background: rgba(251, 247, 239, 0.96);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: var(--sans); color: var(--ink); text-align: center; padding: 16px;
        }
        #mobileNameInputOverlay .t { font-size: 28px; font-weight: 800; letter-spacing: 3px; margin-bottom: 14px; }
        #mobileNameInputOverlay .s { font-size: 15px; color: var(--soft); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
        #mobileNameInputOverlay .p { font-size: 14px; font-weight: 600; color: var(--mark); margin: 16px 0 10px; }
        #mobileNameInput {
            font-family: inherit; font-size: 17px; font-weight: 600; text-align: center;
            padding: 10px 14px; width: 220px; margin-bottom: 18px;
            color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 12px; outline: none;
        }
        /* Full screen button: bottom-right corner of the game on a computer; beside the pause button on a phone */
        #fsBtn {
            position: absolute; right: 10px; bottom: 10px; z-index: 35;
            width: 36px; height: 36px; padding: 0; border-radius: 50%;
            display: none; justify-content: center; align-items: center;
            background: rgba(255, 253, 248, 0.85); border: 1px solid var(--line); color: var(--ink);
            box-shadow: 0 4px 14px rgba(59, 49, 37, 0.08); cursor: pointer; opacity: 0.6;
            transition: opacity 0.15s;
        }
        #fsBtn:hover, #fsBtn:focus-visible { opacity: 1; border-color: var(--mark); }
        #fsBtn svg { width: 18px; height: 18px; display: block; }
        #fsBtn .exit { display: none; }
        #fsBtn.is-fs .enter { display: none; }
        #fsBtn.is-fs .exit { display: block; }
        body.show-fs #fsBtn { display: flex; }
        body.touch #fsBtn { position: fixed; width: 44px; height: 44px; opacity: 0.9; }
        /* Phone held upright: the game on top, pause and full screen just under it, the controls filling the rest */
        body.touch.portrait #tPause { top: calc(var(--cb) + 8px); right: 12px; }
        body.touch.portrait #fsBtn { top: calc(var(--cb) + 8px); right: 66px; bottom: auto; }
        /* On a phone the controls are four touch areas, each a quarter of the screen: ◀ ▶ on the left half, ● ▲ on the right */
        body.touch #pad { inset: 0; padding: 0; grid-template-columns: repeat(4, 1fr); align-items: stretch; }
        body.touch #pad.show { display: grid; }
        body.touch #pad .pad-cluster { display: contents; }
        body.touch #pad .pad-btn {
            pointer-events: none; width: auto; height: auto; margin: 0; border-radius: 0;
            background: transparent; border: 0; border-right: 1px dashed rgba(156, 107, 60, 0.22); box-shadow: none;
            align-items: flex-end; padding-bottom: max(18px, calc(env(safe-area-inset-bottom) + 8px));
            font-size: 24px; color: rgba(156, 107, 60, 0.6);
        }
        body.touch #pad .pad-btn[data-k="jump"] { border-right: 0; font-size: 30px; }
        body.touch #pad .pad-btn[data-k="down"] { display: none; }
        body.touch #pad .pad-btn.on { background: rgba(156, 107, 60, 0.12); color: var(--mark); }
        body.touch.portrait { justify-content: flex-start; }
        body.touch.portrait #gameWrapper { flex-direction: column; justify-content: flex-start; height: 100%; }
        body.touch.portrait #canvasContainer { flex-shrink: 0; margin-top: max(10px, env(safe-area-inset-top)); }
        body.touch.portrait:not(.in-play) #fsBtn { right: 12px; }
        body.touch.landscape:not(.in-play) #fsBtn { top: max(10px, env(safe-area-inset-top)); }
        /* Phone on its side: buttons in the top-right corner, controls over the bottom corners */
        body.touch.landscape #tPause { top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); }
        body.touch.landscape #fsBtn { top: calc(max(10px, env(safe-area-inset-top)) + 52px); right: max(10px, env(safe-area-inset-right)); bottom: auto; }
        #mobileNameInput:focus { border-color: var(--mark); }
        #mobileNameInputOverlay .row { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div id="gameWrapper">
    <div id="canvasContainer">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="tPause">II</div>
        <button type="button" id="fsBtn" aria-label="Full screen" title="Full screen (F)">
            <svg class="enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
            <svg class="exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
        </button>
    </div>
</div>

<div id="pad" aria-hidden="true">
    <div class="pad-cluster pad-dir">
        <div class="pad-btn" data-k="left">◀</div>
        <div class="pad-btn" data-k="right">▶</div>
    </div>
    <div class="pad-cluster">
        <div class="pad-btn" data-k="shoot">●</div>
        <div class="pad-btn" data-k="jump">▲</div>
    </div>
</div>

<button type="button" id="titleDevBtn" aria-label="Developer mode">DEV</button>

<div id="devOverlay" class="overlay" style="z-index: 40;">
    <div class="menu-box" style="width: 480px; max-height: 92vh; overflow-y: auto;">
        <h2>Modus Formatoris</h2>
        <p>Stadium Classicum (I–VIII) vel pugna cum Diabolo.</p>
        <div class="dev-stage-grid" id="devStageGrid"></div>
        <button type="button" class="menu-btn danger block" id="devBossBtn">Pugna: Mi contra Fa (Boss)</button>
        <div class="dev-warp">
            <label for="devEndlessLevelInput">Endless Mode Warp (0-23):</label>
            <input type="number" id="devEndlessLevelInput" min="0" max="23" value="0">
            <button type="button" class="menu-btn" id="devEndlessJumpBtn" style="margin: 0; padding: 7px 16px;">WARP</button>
        </div>
        <div class="dev-warp">
            <label for="devBuildSelect">Build:</label>
            <select id="devBuildSelect" style="font-family: inherit; font-size: 14px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink);"></select>
            <button type="button" class="menu-btn" id="devBuildBtn" style="margin: 0; padding: 7px 16px;">OPEN</button>
        </div>
        <button type="button" class="menu-btn ghost block" id="devLeaderboardBtn">Test: Nomen in Tabella</button>
        <button type="button" class="menu-btn block" id="devCloseBtn">Claudere</button>
    </div>
</div>

<div id="pauseOverlay" class="overlay">
    <div class="menu-box" style="max-height: 88vh; overflow-y: auto;">
        <h2>PAUSATUM</h2>

        <button class="menu-btn block" onclick="togglePause()">Resume</button>
        <button class="menu-btn ghost block" onclick="quitToMenu()">Quit to Title</button>
        <button class="menu-btn ghost block" id="fsPauseBtn" onclick="toggleFullscreen()">Full screen</button>

        <hr>

        <div class="slider-container">
            <label for="themeSelect">Theme</label>
            <select id="themeSelect" onchange="applyTheme(this.value)">
                <option value="petrucci">Petrucci</option>
                <option value="attaingnant">Attaingnant</option>
                <option value="rubrica">Red &amp; Black</option>
                <option value="manuscript">Manuscript</option>
            </select>
        </div>
        <div class="slider-container">
            <label>Mensura (Game Speed) <span id="speedLabel" class="speed-name">Tempus perfectum prolatio minor</span>
            <input type="range" id="speedSlider" min="0" max="4" step="1" value="2" oninput="updateSpeedLabel()"></label>
        </div>
        <div class="slider-container">
            <label>Musica Vol <span class="slider-value" id="musicVolValue">0.8</span><input type="range" id="musicVol" min="0" max="1" step="0.05" value="0.8" oninput="updateSliderValue('musicVolValue', this.value)"></label>
        </div>
        <div class="slider-container">
            <label>Effectus Vol <span class="slider-value" id="fxVolValue">0.4</span><input type="range" id="fxVol" min="0" max="1" step="0.05" value="0.4" oninput="updateSliderValue('fxVolValue', this.value)"></label>
        </div>
        <div id="devPhysicsSection" style="display: none;">
            <hr>
            <div class="dev-section-label">⚙ DEV MODE: Physics Tweaker</div>
            <div class="slider-container">
                <label>Gravitas <span class="slider-value" id="gravityValue">0.6</span><input type="range" id="gravitySlider" min="0.2" max="1.0" step="0.1" value="0.6" oninput="updateSliderValue('gravityValue', this.value)"></label>
            </div>
            <div class="slider-container">
                <label>Saltus Altitudo (Jump Height) <span class="slider-value" id="jumpPowerValue">9</span><input type="range" id="jumpPowerSlider" min="5" max="13" step="1" value="9" oninput="updateSliderValue('jumpPowerValue', this.value)"></label>
            </div>
            <div class="slider-container">
                <label>Celeritas Pedestris (Walk Speed) <span class="slider-value" id="walkSpeedValue">6.5</span><input type="range" id="walkSpeedSlider" min="3" max="10" step="0.5" value="6.5" oninput="updateSliderValue('walkSpeedValue', this.value)"></label>
            </div>
            <div class="slider-container">
                <label>Cursus Velocitas (Sprint Speed) <span class="slider-value" id="sprintSpeedValue">12</span><input type="range" id="sprintSpeedSlider" min="8" max="16" step="1" value="12" oninput="updateSliderValue('sprintSpeedValue', this.value)"></label>
            </div>
            <div class="slider-container dev-check">
                <label>
                    <input type="checkbox" id="devInvincibilityToggle">
                    INVINCIBILITY
                </label>
            </div>
        </div>
    </div>
</div>
<script>
    // --- FULL SCREEN ---
    // iPhone Safari has no Fullscreen API: inside the site page, the site page itself lets the game cover the whole window instead
    const fsApi = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
    const inFrame = (() => { try { return window.self !== window.top && !!window.top.location.href; } catch (e) { return false; } })();
    const standaloneApp = window.matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches || navigator.standalone === true;
    const fsAvailable = !standaloneApp && (fsApi || inFrame);
    // Set by the site page: the frame covers the whole window (phone on its side, or the full screen button on iPhone)
    let pageCover = false, pageCoverByUser = false;
    let fsDeclined = false; // the player left full screen on purpose: don't put it back on its own
    // Which way the phone is held: inside the site page, ask the page (the frame itself may be wider than tall either way)
    function screenLandscape() {
        try { if (inFrame && !realFullscreen()) return window.top.innerWidth > window.top.innerHeight; } catch (e) {}
        return window.innerWidth > window.innerHeight;
    }
    function realFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
    function isFullscreen() { return realFullscreen() || pageCover; }
    function fsShownAsOn() { return realFullscreen() || pageCoverByUser; }
    function fsLabel() { return fsShownAsOn() ? 'Exit full screen' : 'Full screen'; }
    function enterFullscreen(lockLandscape) {
        const elem = document.documentElement;
        const req = elem.requestFullscreen ? elem.requestFullscreen({ navigationUI: 'hide' }) : elem.webkitRequestFullscreen();
        // Phones play best sideways; where the browser allows it, hold landscape while in full screen
        Promise.resolve(req).then(() => { if (lockLandscape && isTouchDevice && screen.orientation && screen.orientation.lock) return screen.orientation.lock('landscape'); }).catch(() => {});
    }
    function toggleFullscreen() {
        if (realFullscreen()) {
            fsDeclined = true;
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        } else if (fsApi) { fsDeclined = false; enterFullscreen(true); }

        const targetFreq = diatonic[mode.finalIndex + lHommeArme[seqIndex]];
        
        let timeMultiplier = 1.0;
        if (player.tempusTimer > 0) timeMultiplier = 1.5;
        if (player.allaBreveTimer > 0) timeMultiplier = 0.75;

        // a perfect longa rest, three spaces tall, waits above the staff and drops into its place
        if (ev.thwomp) L.thwomps.push({ x: L.x + ev.w / 2 - 11, baseY: 86, y: 86, w: 22, h: 3 * GAP, vy: 0, state: 'idle', shakeTimer: 0, dead: false, damage: 48, valueIndex: 48, type: 'LONGA_REST' });
        // a run of semiminims over the rests, rising and falling by step
        if (ev.run) {
            const cnt = Math.max(3, Math.floor(ev.w / 44)), base = 4 + Math.floor(L.R() * 2);
            for (let k = 0; k < cnt; k++) {
                const up = Math.min(k, cnt - 1 - k);
                L.notes.push({ x: L.x + 24 + (ev.w - 48) * k / Math.max(1, cnt - 1) - 7, p: Math.min(9, base + up), active: true });
            }
        }
        return ev.w;
    }

    function finishLevel(L) {
        if (L.levelIdx === 7 && !L.endless) { L.x += 60; L.arenaX = L.x; L.x += 800 - 60; }
        L.goal = { x: L.x + 20, y: 0, w: 40, h: 400 };
        L.x += 40;
        closeSystem(L, null, true);
        L.length = L.x;
        if (L.levelIdx === 7) L.length = L.arenaX + 800;
        L.done = true;
    }

    function fill(L, untilX) {
        while (!L.done && L.x < untilX) {
            if (L.queue.length < 3) planMore(L);
            const ev = L.queue.shift();
            if (ev.kind === 'end') { finishLevel(L); break; }
            if (ev.newSystem && L.sys) closeSystem(L, firstPitch(ev, L.queue));
            if (!L.sys) openSystem(L);
            if (L.x + (ev.pre || 0) + (ev.w || 120) > L.sys.x0 + L.sysLen && L.x > L.sys.x0 + 500) { closeSystem(L, firstPitch(ev, L.queue)); openSystem(L); }
            else L.x += ev.pre || 0;
            L.x += ev.kind === 'group' ? placeGroup(L, ev) : placeRest(L, ev);
        }
    }

    function prune(L) {
        const cut = cameraX - 600, keep = o => (o.x + (o.w || 20)) > cut;
        L.groups = L.groups.filter(keep); L.rests = L.rests.filter(keep); L.thwomps = L.thwomps.filter(keep);
        L.flats = L.flats.filter(keep); L.sharps = L.sharps.filter(keep); L.notes = L.notes.filter(keep); L.powerups = L.powerups.filter(keep);
        L.systems = L.systems.filter(s => s.x1 > cut);
    }

    function generateLevel(levelIndex, isEndless) {
        const seed = isEndless ? (Math.random() * 1e9) | 0 : 1201 + levelIndex * 7919;
        const L = newLevel(seed, levelIndex, isEndless ? Math.min(1, levelIndex * 0.05) : levelIndex / 7, isEndless, levelIndex);
        L.enemySpeed = 1.5 + levelIndex * 0.2;
        L.hasFuga = levelIndex === 3 || levelIndex === 5 || levelIndex === 7;
        if (L.hasFuga && !isEndless) L.inscription = 'Fuga in unisono post tempus';
        if (isEndless) { L.inkAt = 3000; fill(L, W * 3); }
        else { L.target = 7000 + levelIndex * 1700; L.inkAt = L.target * 0.3; fill(L, Infinity); }
        return L;
    }

    // ===================== Gradus ad Parnassum =====================
    // A page of staves climbed from the bottom up. Each line is read left to right and climbs the staff in a sequence,
    // as in a solmization exercise; at the end of a line the custos shows the first note of the line above,
    // and the singer runs off the right edge of the page to come back on the left.
    const PERIOD = 4 * GAP + 72;
    const SEQUENCES = [ // [intervals repeated, first position, how hard]
        [[1], 1, 0], [[2, -1], 2, 0.2], [[1, 1, -1], 3, 0.35], [[2, 2, -3], 1, 0.55], [[3, -2], 2, 0.75]
    ];
    function gradusLevel(modeIdx) {
        const L = newLevel((Math.random() * 1e9) | 0, modeIdx, 0.1, true, modeIdx);
        L.gradus = true; L.staff = 0; L.gradusT = 0; L.next = null;
        return L;
    }
    function pickSequence(L) {
        const R = L.R, fit = SEQUENCES.filter(q => q[2] <= L.diff + 0.25);
        const q = fit[Math.floor(R() * fit.length)];
        return { iv: q[0], p0: q[1] };
    }
    function gradusStaff(L) {
        const R = L.R, k = L.staff++, oy = -k * PERIOD;
        if (k > 0 && k % 6 === 0) { L.modeIdx = (L.modeIdx + 1) % modesData.length; L.labelNext = true; L.diff = Math.min(1, L.diff + 0.12); }
        L.diff = Math.min(1, L.diff + 0.015);
        const M = modeInfo(L.modeIdx), clef = M.clef;
        const sys = { x0: 0, x1: W, clef, modeIdx: L.modeIdx, first: k === 0, label: k === 0 || L.labelNext, custos: null, final: false, oy, floor: k === 0 };
        L.labelNext = false; L.systems.push(sys); L.sys = sys; L.oy = oy; L.prevGroup = null;
        let x = k === 0 ? 150 : 76;
        if (k > 0 && R() < 0.25) { L.powerups.push({ kind: R() < 0.5 ? 'tempus' : 'dupla', x: x - 10, y: yP(4) + oy - 12.5, w: 25, h: 25, active: true }); x += 46; }

        // the climb, from a low line of the staff to its top
        const seq = L.next || pickSequence(L);
        L.next = pickSequence(L);
        const dOf = p => p + (clef.k === 'F' ? 3 : 7) - 2 * (clef.line - 1);
        const notes = [{ d: dOf(seq.p0) }];
        for (let i = 0; notes.length < 14; i++) {
            const cur = notes[notes.length - 1].d;
            let nx = cur + seq.iv[i % seq.iv.length];
            if (Math.abs(semis(nx) - semis(cur)) === 6) nx = cur + Math.sign(nx - cur) * (Math.abs(nx - cur) - 1);
            if (pOf(nx, clef) > 9) break;
            notes.push({ d: nx });
            if (pOf(nx, clef) >= 8 && i % seq.iv.length === seq.iv.length - 1) break;
        }
        // b-rotundum for a B between two A's in the modes on D and F
        if ([1, 3].includes(dMod(M.final))) notes.forEach((nt, i) => { if (dMod(nt.d) === 6 && i > 0 && i < notes.length - 1 && notes[i - 1].d === nt.d - 1 && notes[i + 1].d === nt.d - 1 && R() < 0.6) nt.flat = true; });
        const groups = [];
        for (let i = 0; i < notes.length;) {
            if (i === notes.length - 1) { groups.push(single(notes[i], 'L')); break; }
            const size = Math.min(pickW(R, [[1, 3], [2, 4], [3, 2]]), notes.length - 1 - i);
            groups.push(size === 1 ? single(notes[i], R() < 0.3 ? 'L' : 'B') : makeLigature(R, notes.slice(i, i + size)));
            i += size;
        }
        const widthOf = g => g.notes.reduce((w, nt, i) => w + (nt.obl || (i > 0 && g.notes[i - 1].obl) ? OBL : g.val === 'MX' ? 2 * OBL : HW), 0);
        const room = (W - 50) - x - groups.reduce((w, g) => w + widthOf(g), 0);
        const gapBase = Math.max(16, Math.min(70 + 40 * L.diff, room / groups.length));
        groups.forEach((g, i) => {
            g.colored = i < groups.length - 1 && R() < 0.08 + 0.3 * L.diff;
            const gap = i === 0 ? 0 : gapBase * (0.75 + R() * 0.5);
            // a rest written in a wide gap, where the singer must leap through or over it
            if (gap > 58 && R() < 0.15 + 0.45 * L.diff) {
                const pg = groups[i - 1], lp = 2 * Math.min(4, Math.round((pOf(pg.notes[pg.notes.length - 1].d, clef) + 3) / 2));
                const breve = R() < 0.4 * L.diff, top = yP(lp) + oy;
                L.rests.push({ x: x + gap / 2 - 6, y: top, w: 12, h: breve ? GAP : STEP, baseVx: 0, vx: 0, minX: x + gap / 2 - 6, maxX: x + gap / 2 - 6, aggro: false, dead: false, damage: breve ? 16 : 8, valueIndex: breve ? 16 : 8, type: breve ? 'BREVIS_REST' : 'SEMIBREVIS_REST' });
            }
            L.x = x + gap;
            x = L.x + placeGroup(L, g);
        });
        // the next line may be in a new mode and clef: the custos names its first note on this line's staff
        const nextClef = modeInfo((k + 1) % 6 === 0 ? (L.modeIdx + 1) % modesData.length : L.modeIdx).clef;
        const nextD = L.next.p0 + (nextClef.k === 'F' ? 3 : 7) - 2 * (nextClef.line - 1);
        sys.custos = Math.max(-1, Math.min(10, pOf(nextD, clef)));
        L.x = 0;
    }
    function pruneGradus(L) {
        const low = cameraY + H + 400;
        L.groups = L.groups.filter(g => FLOOR + g.oy - 200 < low); L.rests = L.rests.filter(o => o.y < low); L.flats = L.flats.filter(o => o.y < low);
        L.notes = L.notes.filter(n => yP(n.p) + (n.oy || 0) < low); L.powerups = L.powerups.filter(o => o.y < low);
        L.systems = L.systems.filter(s => STAFF_TOP + s.oy < low);
    }

    // ===================== Running the game =====================
    function startGame() {
        unlockAudio();
        previousState = 'PLAY';
        // Read the board now so the end of the run knows whether the score makes it
        const lbMode = gameMode === 'ENDLESS' ? 'ENDLESS' : 'CLASSIC';
        if (gameMode !== 'GRADUS' && Date.now() - (boardReadAt[lbMode] || 0) > 30000) { boardReadAt[lbMode] = Date.now(); loadLeaderboard(lbMode); }

        // Back from a fall in Ars Antiqua: the same piece, from the last clausula, keeping time and score
        if (gameState === 'DEATH_FREEZE' && gameMode === 'CLASSIC') {
            boss.active = false;
            boss.projectiles = [];
            currentLevelData = generateLevel(currentLevel, false);
            currentLevelData.checkpoints.forEach(cp => { if (cp.x < respawnPoint.x) cp.active = false; });
            resetPlayer(respawnPoint.x, respawnPoint.y);
            gameState = 'SPLASH';
            return;
        }

        levelTime = 0;
        player.score = 0;
        endlessDistance = 0;
        respawnPoint = { x: 50, y: 150 };
        boss = { active: false, x: 0, y: 0, hp: 40, maxHp: 40, vy: 2.5, timer: 0, projectiles: [] };
        if (gameMode === 'ENDLESS' && window.endlessStartLevel > 0) { currentLevel = window.endlessStartLevel; window.endlessStartLevel = null; }
        currentLevelData = gameMode === 'GRADUS' ? gradusLevel(currentLevel) : generateLevel(currentLevel, gameMode === 'ENDLESS');

        if (window.skipToBoss) { respawnPoint.x = currentLevelData.arenaX - 300; window.skipToBoss = false; }
        resetPlayer(respawnPoint.x, respawnPoint.y);
        gameState = 'SPLASH';
    }

    function updateFlashingEffects() {
        if (player.tempusTimer > 0) { if (player.tempusTimer < 60 && Math.floor(Date.now() / 100) % 2 === 0) canvas.classList.remove('bullet-time'); else canvas.classList.add('bullet-time'); } else canvas.classList.remove('bullet-time');
        if (player.allaBreveTimer > 0) { if (player.allaBreveTimer < 60 && Math.floor(Date.now() / 100) % 2 === 0) canvas.classList.remove('alla-breve'); else canvas.classList.add('alla-breve'); } else canvas.classList.remove('alla-breve');
    }

    function resetPlayer(startX, startY) {
        Object.assign(player, { x: startX, y: startY, vx: 0, vy: 0, jumps: 0, stateValue: 4, invulnerableTimer: 60, isSprinting: false, isTripleSprinting: false, tempusTimer: 0, colorationTimer: 0, allaBreveTimer: 0, history: [], bounceTimer: 0, slide: 0, grounded: false, face: 1 });
        rightTapCount = 0; leftTapCount = 0;
        updateFlashingEffects(); trail = []; projectiles = []; particles = [];
        cameraX = Math.max(0, player.x - W / 3); endlessAutoScroll = cameraX; cameraY = 0;
    }

    function checkCollision(r1, r2) { return r1.x < r2.x + (r2.width || r2.w) && r1.x + (r1.width || r1.w) > r2.x && r1.y < r2.y + (r2.height || r2.h) && r1.y + (r1.height || r1.h) > r2.y; }

    function getStateIndex(value) {
        for (let i = 0; i < noteValues.length; i++) if (noteValues[i] === value) return i;
        for (let i = noteValues.length - 1; i >= 0; i--) if (noteValues[i] <= value) return i;
        return 0;
    }

    function takeDamage(amount = 2, killer = null, isHalving = false) {
        if (devInvincible) return;
        const before = player.stateValue;
        // a rest longer than the note that meets it silences it at once
        if (killer && killer.type && killer.type.includes('REST') && killer.valueIndex > before) {
            lastKiller = killer; deathPlayerState = before;
            die(true); return;
        }
        playSound('damage'); spawnBlood(player.x, player.y, 40);
        player.score = Math.max(0, player.score - 5);
        player.isSprinting = false; player.isTripleSprinting = false;
        if (isHalving) player.stateValue = Math.floor(player.stateValue / 2);
        else player.stateValue -= Math.floor(killer && killer.valueIndex !== undefined ? killer.valueIndex : amount);
        if (player.stateValue <= 0) { player.stateValue = 0; lastKiller = killer; deathPlayerState = before; die(true); }
        else player.invulnerableTimer = 60;
    }

    function stompBounce(value) {
        const sm = speedSettings[difficultyIndex].mult;
        player.vy = -11 * sm; player.vx = 15 * sm * player.face; player.bounceTimer = 15; player.jumps = 1;
        player.stateValue = Math.min(player.stateValue + (value || 4), 64);
        player.score += 10;
        playSound('bounce');
    }

    function handleEnemyCollision(enemy, halving) {
        if (enemy.dead) return;
        const pRect = { x: player.x + 2, y: player.y + 2, w: player.width - 4, h: player.height - 4 };
        const eRect = { x: enemy.x + 2, y: enemy.y + 2, w: enemy.w - 4, h: enemy.h - 4 };
        if (!checkCollision(pRect, eRect)) return;
        const centered = player.x + player.width / 2 > enemy.x - 15 && player.x + player.width / 2 < enemy.x + enemy.w + 15;
        const stomp = player.vy > 0 && player.y + player.height - player.vy <= enemy.y + 20 && centered;
        if (stomp) { enemy.dead = true; stompBounce(enemy.valueIndex); spawnDust(enemy.x, enemy.y); spawnBlood(enemy.x, enemy.y); }
        else if (player.colorationTimer > 0) { enemy.dead = true; playSound('smash'); spawnDust(enemy.x, enemy.y); spawnBlood(enemy.x, enemy.y); }
        else if (player.invulnerableTimer <= 0) takeDamage(enemy.valueIndex || 2, enemy, halving);
    }

    // where the foot comes down: the bottom line of a staff, or the top of a note head (an obliqua is a slope)
    function surfaceTop(s, g, fx) { const t = Math.min(1, Math.max(0, (fx - s.x) / s.w)); return s.t0 + (s.t1 - s.t0) * t + g.dy; }
    function findFooting(L, prevFeet, wasGrounded) {
        const fx = player.x + player.width / 2, feet = player.y + player.height;
        let best = null;
        for (const sys of L.systems) if (sys.floor !== false && fx >= sys.x0 - 4 && fx <= sys.x1 + 4 && prevFeet <= FLOOR + 2 && feet >= FLOOR) best = { top: FLOOR, g: null, s: null };
        for (const g of L.groups) {
            if (g.falling || fx < g.x - 8 || fx > g.x + g.w + 8) continue;
            for (const s of g.surf) {
                if (fx < s.x - 7 || fx > s.x + s.w + 7) continue;
                const top = surfaceTop(s, g, fx);
                // land from above, or walk up a single step of the staff
                const ok = (prevFeet <= top + 3 && feet >= top) || (wasGrounded && feet >= top && feet - top <= STEP + 4);
                if (ok && (!best || top < best.top)) best = { top, g, s };
            }
        }
        return best;
    }

    function die(silent) {
        if (!silent) playSound('death');
        player.vx = 0; player.vy = 0;
        gameState = 'DEATH_FREEZE';
        if (musicTimeout) clearTimeout(musicTimeout);
    }

    function update() {
        if (gameState !== 'PLAY') return;
        const L = currentLevelData;
        const speedMult = speedSettings[difficultyIndex].mult;
        const phys = getDevPhysics();

        if (player.tempusTimer > 0) player.tempusTimer -= speedMult;
        if (player.allaBreveTimer > 0) player.allaBreveTimer -= speedMult;
        if (player.colorationTimer > 0) player.colorationTimer -= speedMult;
        updateFlashingEffects();
        let timeModBase = player.tempusTimer > 0 ? 0.5 : 1.0;
        if (player.colorationTimer > 0) timeModBase *= 0.6;
        const timeMod = timeModBase * speedMult;

        if (L.gradus) { while (-L.staff * PERIOD > cameraY - 2 * H) gradusStaff(L); if (++L.pruneT % 120 === 0) pruneGradus(L); }
        else if (L.endless) { fill(L, cameraX + W * 3); if (++L.pruneT % 120 === 0) prune(L); }

        player.history.push({ x: player.x, y: player.y, state: getStateIndex(player.stateValue) }); if (player.history.length > 60) player.history.shift();
        if ((player.isSprinting || player.isTripleSprinting) && (keys.left || keys.right)) { if (trail.length > 5) trail.shift(); trail.push({ x: player.x, y: player.y, state: getStateIndex(player.stateValue) }); } else if (trail.length > 0) trail.shift();

        // puncta fired by the player
        const shootables = L.rests.concat(L.flats, L.sharps);
        for (let i = projectiles.length - 1; i >= 0; i--) {
            const p = projectiles[i]; p.x += p.vx * speedMult; let hit = false;
            if (boss.active && boss.hp > 0 && checkCollision({ x: p.x, y: p.y, w: 8, h: 8 }, { x: boss.x - 20, y: boss.y, w: 90, h: 80 })) {
                boss.hp--; hit = true; playSound('bossHit'); spawnBlood(boss.x, boss.y + 20);
                if (boss.hp <= 0) { boss.active = false; player.score += 50; endRun(); return; }
            }
            shootables.forEach(e => { if (!e.dead && checkCollision({ x: p.x, y: p.y, w: 8, h: 8 }, e)) { e.dead = true; hit = true; playSound('smash'); spawnBlood(e.x, e.y); } });
            if (hit || p.x > cameraX + 900 || p.x < cameraX - 100) projectiles.splice(i, 1);
        }

        // Mi contra fa: the devil in music waits at the end of the eighth mode
        if (gameMode === 'CLASSIC' && L.levelIdx === 7 && !boss.active && boss.hp > 0 && player.x > L.arenaX) {
            cameraX = L.arenaX; boss.active = true; boss.x = cameraX + 640; boss.y = 200; L.hasFuga = false;
        }
        if (boss.active) {
            boss.y += boss.vy * speedMult; if (boss.y < 110 || boss.y > 270) boss.vy *= -1;
            boss.timer += speedMult;
            if (Math.floor(boss.timer) % 50 === 0) boss.projectiles.push({ x: boss.x, y: boss.y + 30, vx: -10, mi: boss.projectiles.length % 2 === 0 });
            for (let i = boss.projectiles.length - 1; i >= 0; i--) {
                const bp = boss.projectiles[i]; bp.x += bp.vx * speedMult;
                if (player.invulnerableTimer <= 0 && checkCollision({ x: bp.x, y: bp.y, w: 20, h: 20 }, player)) { takeDamage(2, { type: 'BOSS_PROJ' }); player.invulnerableTimer = 60; boss.projectiles.splice(i, 1); }
                else if (bp.x < cameraX - 50) boss.projectiles.splice(i, 1);
            }
            if (gameState !== 'PLAY') return;
        }

        for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.vy += 0.3 * speedMult; p.x += p.vx * speedMult; p.y += p.vy * speedMult; p.life -= 0.02 * speedMult; if (p.life <= 0) particles.splice(i, 1); }

        // --- walking and running ---
        let walk = phys.walkSpeed * speedMult, sprint = phys.sprintSpeed * speedMult;
        if (player.isTripleSprinting) sprint *= 1.8;
        if (player.allaBreveTimer > 0) { walk *= 1.6; sprint *= 1.6; }
        player.jumpPower = -phys.jumpPower;
        if (keys.right) player.face = 1; else if (keys.left) player.face = -1;
        if (player.bounceTimer > 0) {
            player.bounceTimer -= speedMult; player.vx *= 0.96;
            if (keys.right) player.vx += 0.5 * speedMult; if (keys.left) player.vx -= 0.5 * speedMult;
        } else {
            const running = player.isSprinting || player.isTripleSprinting;
            const target = keys.right ? (running ? sprint : walk) : keys.left ? -(running ? sprint : walk) : 0;
            player.vx = target + player.slide;
        }
        player.slide *= player.onSlope ? 1 : 0.9;
        if (boss.active && player.x + player.vx < cameraX) player.vx = 0;
        player.x += player.vx;
        if (player.x < 0 && gameMode !== 'GRADUS') player.x = 0;

        // --- the camera ---
        if (gameMode === 'GRADUS') {
            // the page climbs on its own after a moment; the ink rises behind
            L.gradusT += speedMult;
            if (L.gradusT > 120) endlessAutoScroll -= (1.1 + currentLevel * 0.25) * timeMod;
            cameraY = Math.min(0, endlessAutoScroll, player.y - H * 0.6); cameraX = 0;
            endlessDistance = Math.max(0, Math.floor(-player.y / 150));
            if (player.x < -20) player.x = W; if (player.x > W) player.x = -20;
        } else if (gameMode === 'ENDLESS') {
            const smod = 2.5 + currentLevel * 0.7 + endlessDistance / 500;
            endlessAutoScroll += smod * timeMod; cameraX = endlessAutoScroll; endlessDistance = Math.floor(cameraX / 150);
            if (player.x < cameraX - 24) { if (devInvincible) { player.x = cameraX - 24; } else { die(); return; } }
            if (player.x > cameraX + W - player.width) player.x = cameraX + W - player.width;
        } else if (!boss.active) {
            cameraX = Math.max(0, Math.min(player.x - W / 3, L.length - W));
        } else if (player.x > cameraX + W - player.width) player.x = cameraX + W - player.width;

        // --- falling and landing ---
        const wasGrounded = player.grounded;
        let gravity = phys.gravity * speedMult;
        if (keys.up && player.vy < 0) gravity *= 0.625;
        player.vy = Math.min(player.vy + gravity, 18 * speedMult);
        const prevFeet = player.y + player.height;
        player.y += player.vy;
        player.grounded = false; player.onSlope = false;
        if (player.vy >= 0) {
            const f = findFooting(L, prevFeet, wasGrounded && player.vy <= gravity + 0.01);
            if (f) {
                player.y = f.top - player.height; player.vy = 0; player.grounded = true; player.jumps = 0;
                if (f.g) {
                    f.g.stepped = true;
                    if (f.s.t1 !== f.s.t0) { player.onSlope = true; player.slide = Math.max(-7, Math.min(7, player.slide + Math.sign(f.s.t1 - f.s.t0) * 0.45 * speedMult)); }
                }
            }
        }
        if (player.y > cameraY + H + 50) { die(); return; }

        // blackened ligatures give way a moment after they are trodden on
        for (const g of L.groups) {
            if (g.colored && g.stepped && !g.falling) { g.shake += timeMod; if (g.shake > 30) g.falling = true; }
            if (g.falling) { g.vy += 0.5 * timeMod; g.dy += g.vy; }
        }

        // perfect longa rests drop into the staff
        L.thwomps.forEach(t => {
            if (t.dead) return;
            const landY = FLOOR - t.h;
            if (t.state === 'idle') { if (Math.abs(player.x + player.width / 2 - (t.x + t.w / 2)) < 150) { t.state = 'shaking'; t.shakeTimer = 30; } }
            else if (t.state === 'shaking') { t.shakeTimer -= timeMod; if (t.shakeTimer <= 0) t.state = 'falling'; }
            else if (t.state === 'falling') { t.vy += 1.5 * timeMod; t.y += t.vy * timeMod; if (t.y >= landY) { t.y = landY; t.vy = 0; t.state = 'grounded'; t.timer = 60; playSound('smash'); spawnDust(t.x + t.w / 2, FLOOR - 30); } }
            else if (t.state === 'grounded') { t.timer -= timeMod; if (t.timer <= 0) t.state = 'rising'; }
            else if (t.state === 'rising') { t.y -= 2 * timeMod; if (t.y <= t.baseY) { t.y = t.baseY; t.state = 'idle'; } }
            handleEnemyCollision(t, false);
        });

        if (player.invulnerableTimer > 0) player.invulnerableTimer -= speedMult;
        if (gameState !== 'PLAY') return;
        // the canon: the same note, one tempus behind
        if (L.hasFuga && player.history.length === 60 && player.invulnerableTimer <= 0 && player.colorationTimer <= 0) {
            const g = player.history[0];
            if (checkCollision(player, { x: g.x, y: g.y, width: player.width, height: player.height })) takeDamage(2, { type: 'GHOST' });
        }

        // rests pace their silence, and hurry toward a note that comes near
        L.rests.forEach(e => {
            if (e.dead) return;
            const dist = player.x - e.x;
            if (Math.abs(dist) < 250 && Math.abs(player.y - e.y) < 100) {
                e.aggro = true;
                e.vx = dist > 0 && e.x < e.maxX ? e.baseVx * 1.8 : dist < 0 && e.x > e.minX ? -e.baseVx * 1.8 : 0;
            } else {
                e.aggro = false;
                if (Math.abs(e.vx) !== e.baseVx) e.vx = e.vx >= 0 ? e.baseVx : -e.baseVx;
                if (e.x <= e.minX) e.vx = e.baseVx; if (e.x >= e.maxX) e.vx = -e.baseVx;
            }
            e.x = Math.max(e.minX, Math.min(e.maxX, e.x + e.vx * timeMod));
            handleEnemyCollision(e, false);
        });

        // the b-rotundum springs up from its B; the diesis hovers over the note it raises
        L.flats.forEach(f => {
            if (f.dead) return;
            f.timer -= timeMod;
            if (f.state === 'idle' && f.timer <= 0) { f.state = 'jumping'; f.vy = -9 * speedMult; }
            else if (f.state === 'jumping') { f.vy += 0.5 * timeMod; f.y += f.vy * timeMod; if (f.y >= f.baseY && f.vy > 0) { f.y = f.baseY; f.state = 'idle'; f.timer = Math.random() * 60 + 40; } }
            handleEnemyCollision(f, true);
        });
        L.sharps.forEach(s => {
            if (s.dead) return;
            s.time += 0.05 * timeMod; s.y = s.baseY + Math.sin(s.time) * 34;
            handleEnemyCollision(s, true);
        });

        // semiminims and signs to gather
        L.notes.forEach(n => {
            if (!n.active) return;
            if (checkCollision(player, { x: n.x, y: yP(n.p) - 26 + (n.oy || 0), w: 16, h: 36 })) {
                n.active = false; player.score += 1;
                if (player.stateValue < 64) player.stateValue = Math.min(player.stateValue * 1.5, 64);
                playSound('point');
                if (!player.grounded && player.vy > -6) { player.vy = -7 * speedMult; player.jumps = Math.min(player.jumps, 1); }
            }
        });
        L.powerups.forEach(it => {
            if (!it.active || !checkCollision(player, it)) return;
            it.active = false;
            if (it.kind === 'tempus') { player.tempusTimer = 360; playSound('tempus'); }
            else if (it.kind === 'dupla') { player.allaBreveTimer = 480; playSound('allaBreve'); }
            else { player.colorationTimer = 360; playSound('point'); }
            updateFlashingEffects();
        });

        if (gameMode === 'CLASSIC') {
            L.checkpoints.forEach(cp => { if (cp.active && player.x + player.width >= cp.x) { cp.active = false; respawnPoint = { x: cp.x + 24, y: 150 }; playSound('point'); } });
            if (player.x >= L.goal.x && !boss.active && L.levelIdx !== 7) {
                if (currentLevel + 1 < 8) {
                    currentLevel++; respawnPoint = { x: 50, y: 150 };
                    currentLevelData = generateLevel(currentLevel, false);
                    resetPlayer(respawnPoint.x, respawnPoint.y);
                    if (musicTimeout) clearTimeout(musicTimeout);
                    gameState = 'SPLASH';
                } else endRun();
            }
        } else if (gameMode === 'GRADUS') {
            for (const s of L.systems) {
                if (s.label && s.modeIdx !== currentLevel && player.y + player.height < FLOOR + s.oy) { currentLevel = s.modeIdx; startBGM(currentLevel); }
            }
        } else {
            // a new mode begins where its rubric stands at the head of a line
            for (const s of L.systems) {
                if (s.label && s.modeIdx !== currentLevel && player.x > s.x0 && s.x0 > 0) {
                    currentLevel = s.modeIdx; startBGM(currentLevel);
                    L.hasFuga = currentLevel === 3 || currentLevel === 5 || currentLevel === 7;
                    player.history = [];
                }
            }
        }
    }
    // --- Inputs & Unified Menu Handling ---
    function pressRight() { keys.right = true; let now = Date.now(); if (now - lastRightTap < 250) rightTapCount++; else rightTapCount = 1; lastRightTap = now; if (rightTapCount >= 3) player.isTripleSprinting = true; else if (rightTapCount >= 2) player.isSprinting = true; }
    function releaseRight() { keys.right = false; player.isSprinting = false; player.isTripleSprinting = false; }

    function releaseLeft() { keys.left = false; player.isSprinting = false; player.isTripleSprinting = false; }
    function pressJump() { keys.up = true; if (gameState === 'PLAY') { let sm = speedSettings[difficultyIndex].mult; let maxJumps = (getStateIndex(player.stateValue) >= 10) ? 3 : 2; if (player.jumps < maxJumps) { player.vy = player.jumpPower * sm; spawnDust(player.x, player.y); player.grounded = false; player.jumps++; playSound('jump'); } } }

        const inGame = isTouchDevice && !['MENU', 'LEADERBOARD', 'INSTALL_PROMPT'].includes(gameState);

        if (e.code === 'Escape') {

            if (gameState === 'DEATH_FREEZE' || gameState === 'WIN') {

                }
            }
            return;
        }

        if ((gameState === 'WIN') && !e.repeat) {
            if (gameState === 'WIN') gameState = 'MENU'; 
            return;
        }

        if (gameState === 'RESULT') {
            if (!e.repeat && Date.now() - resultAt > 600) nextRunAfterResult();
            return;

            } else if (e.key === 'Backspace') {
                inputName = inputName.slice(0, -1);
            } else if (e.key.length === 1 && inputName.length < 15) {
                inputName += e.key;
            }
            return;
        }

        if (gameState === 'LEADERBOARD') {
            if (e.key === 'Escape') {
                gameState = 'MENU';
            }
            return;
        }

        if (gameState === 'INSTALL_PROMPT') {
            gameState = 'MENU';
            return;
        }

        if (gameState === 'SPLASH' && !e.repeat) {
            advanceSplash();
            return;
        }

            if (e.code === 'KeyM') { isMuted = !isMuted; if (isMuted && musicTimeout) clearTimeout(musicTimeout); return; }

                else if (e.key === '3') { gameMode = 'GRADUS'; currentLevel = 0; startGame(); }

            return;
        }

        if (gameState !== 'PLAY' && gameState !== 'PAUSE') return;

        if (!e.repeat) {
            if (e.code === 'ArrowRight' || e.code === 'KeyD') pressRight();
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') pressLeft();
            if (e.code === 'ArrowUp' || e.code === 'KeyW') pressJump();
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
            if (e.code === 'Space') pressShoot();
        }
        if (e.code === 'KeyM') { isMuted = !isMuted; if (isMuted && musicTimeout) clearTimeout(musicTimeout); if (!isMuted && gameState === 'PLAY') startBGM(currentLevel); }
    });

    function handleTouchZones(e) {
        if (gameState === 'NAME_INPUT') {
            // If player is tapping on the HTML overlay (input box or buttons), let browser handle it!
            if (e.target.closest('#mobileNameInputOverlay')) {
                return; 
            }
            e.preventDefault();
            showMobileNameInput();
            return;
        }
        
        if (gameState === 'LEADERBOARD') {
            e.preventDefault();
            // Check if close button was touched
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0] || e.changedTouches[0];
            const x = (touch.clientX - rect.left) / (rect.width / W);
            const y = (touch.clientY - rect.top) / (rect.height / H);
            
            const closeBtnSize = 30;
            const closeBtnX = W - closeBtnSize - 10;
            const closeBtnY = 10;
            
            if (x >= closeBtnX && x <= closeBtnX + closeBtnSize && 
                y >= closeBtnY && y <= closeBtnY + closeBtnSize) {
                gameState = 'MENU';
            }
            return;
        }
        
        for (const id of [...padFingers.keys()]) if (![...e.touches].some(t => t.identifier === id)) padFingers.delete(id);
        if (gameState !== 'PLAY') return;
        if (e.target.closest && e.target.closest('#tPause')) return;
        e.preventDefault();

        // the left thumb always steers (◀ first quarter, ▶ second), the right thumb always shoots (third) or jumps (fourth),
        // so a thumb that drifts while playing is never dropped
        const vw = window.innerWidth;
        const held = new Set();
        for (const t of e.touches) {
            let side = padFingers.get(t.identifier);
            if (!side) { side = t.clientX < vw / 2 ? 'dir' : 'act'; padFingers.set(t.identifier, side); }
            held.add(side === 'dir' ? (t.clientX < vw / 4 ? 'left' : 'right') : (t.clientX < vw * 3 / 4 ? 'shoot' : 'jump'));
        }
        setPadKey('left', held.has('left'), pressLeft, releaseLeft, keys.left);
        setPadKey('right', held.has('right'), pressRight, releaseRight, keys.right);
        setPadKey('jump', held.has('jump'), pressJump, releaseJump, keys.up);
        setPadKey('shoot', held.has('shoot'), pressShoot, releaseShoot, keys.space);
    }
