<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choir book</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 27 16 16 29 5 16Z' fill='%2324479A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+Double+Pica:ital@0;1&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<!--
  Choir book: a reader for mensural polyphony (score, parts, choir book openings).
  Reads Humdrum **kern files such as those of the Josquin Research Project.
  Everything is in this one file; a few pieces live in games/choirbook/*.krn (see PIECES below),
  the full library (games/choirbook/catalogue.json) is loaded from the public repositories of the
  Josquin Research Project, the 1520s Project and music21 (Palestrina). The catalogue was made
  with the data of ReDiX by Ugo Bindini (https://github.com/ugobindini/redix).
  Note shapes, clefs and accidentals are outlines from the Bravura music font
  by Steinberg Media Technologies, used under the SIL Open Font License 1.1.
-->
<style>
:root{
  --ground:#FBF7EF; --surface:#F4EDE0; --text:#2A2218; --muted:#7D6F5B; --line:#D6C8B0;
  --accent:#8E2A1E; --accent-ink:#F7F2E6;
  --leaf:#F3E8CC; --leaf-ink:#2A2218; --leaf-muted:#7A6A4E; --rule:#8E2A1E;
  --sel:#8E2A1E; --hov:#B8624A; --play:#8E2A1E; --del:#8E2A1E;
  --paper:none; --pen:#8E2A1E;
  color-scheme: light;
}
*{box-sizing:border-box}
.embedded,.embedded body{overflow:hidden;height:auto}
.embedded #title{display:none}
.embedded header.top .lede, .embedded header.top h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.embedded header.top{justify-content:flex-end;margin-bottom:6px}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--text);
  font:400 19px/1.45 "IM Fell English","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
.wrap{max-width:none;margin:0 auto;padding:22px clamp(14px,2.6vw,44px) 40px}
header.top{display:flex;flex-wrap:wrap;gap:14px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-family:"IM Fell Double Pica","IM Fell English",Georgia,serif;font-weight:400;font-size:clamp(2.2rem,4.4vw,3.2rem);line-height:1.02;margin:0;letter-spacing:-.012em}
.lede{margin:.4rem 0 0;color:var(--muted);font-style:italic;max-width:62ch}
.share{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.libwrap{position:relative}
.libbtn{display:inline-flex;align-items:center;gap:8px;background:var(--text);color:var(--ground);border-color:var(--text)}
.libbtn .chev{width:12px;height:12px;fill:currentColor}
.library{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:min(760px,calc(100vw - 28px));max-height:min(78vh,760px);
  overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px 10px;
  box-shadow:0 18px 40px -16px rgba(0,0,0,.45)}
.library h2{font-family:"IM Fell Double Pica","IM Fell English",Georgia,serif;font-size:17px;font-weight:700;margin:12px 8px 2px}
.library .gnote{margin:0 8px 6px;color:var(--muted);font-style:italic;font-size:14.5px}
.libhint{margin:6px 8px 4px;color:var(--muted);font-style:italic;font-size:14.5px}
.libtools{display:flex;flex-wrap:wrap;gap:6px;margin:6px 4px 4px;position:sticky;top:-6px;background:var(--surface);padding:6px 0;z-index:1}
.libtools input,.libtools select{font:inherit;font-size:15px;color:var(--text);background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-height:34px}
.libtools input{flex:1 1 220px}
.libtools select{flex:0 1 auto;max-width:100%}
.library .pc{display:block;width:100%;text-align:left;height:auto;min-height:0;line-height:1.3;padding:7px 10px;margin:0 0 4px;border:1px solid transparent;background:transparent;border-radius:6px}
.library .pc:hover:not(:disabled){border-color:var(--line);background:var(--ground)}
.library .pc[aria-current=true]{border-color:var(--text)}
.library .pc .t{display:block;font-size:17px}
.library .pc .c{display:block;font-size:14px;color:var(--muted);font-style:italic}
.library .more{display:block;margin:8px auto 2px}
.srcnote{margin:8px 2px 0;color:var(--muted);font-style:italic;font-size:14px}
.srcnote a{color:inherit}
.markbar{display:flex;align-items:center;gap:10px;margin:8px 2px 0;font-size:15px}
.markbar[hidden]{display:none}
#pages g.mark use,#pages g.mark .ink{fill:#2F4F8F}
#pages g.mark .ledger{stroke:#2F4F8F}
.catitem{display:block;width:100%;text-align:left;padding:10px 10px 8px;margin:0 0 6px;border:1px solid var(--line);background:transparent;border-radius:6px;height:auto;min-height:0;line-height:1.3}
.catitem:hover:not(:disabled){border-color:var(--text);background:var(--ground)}
.catitem .cathead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.catitem .t{font-family:"IM Fell Double Pica","IM Fell English",Georgia,serif;font-size:19px;font-weight:700}
.catitem .cnt{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;white-space:nowrap}
.catitem .d{display:block;font-size:14px;color:var(--muted);font-style:italic;margin-top:1px}
.catitem .pv{display:block;margin-top:6px;height:46px;background:var(--leaf);border-radius:3px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.catitem .pv svg{display:block;height:46px;width:auto}
.catitem .pv .staff{stroke:var(--rule)}
.catitem .pv use{fill:var(--leaf-ink)}
.catitem .pv .ledger{stroke:var(--leaf-ink)}
.catitem .first{display:block;margin-top:4px;font-size:13.5px;color:var(--muted)}
.libnav{padding:2px 0 0}
.libback{height:34px;min-height:34px;padding:0 10px 0 6px;gap:4px;background:transparent;border-color:transparent;color:var(--text)}
.libback:hover{border-color:var(--line);background:var(--ground)}
.libback .chev{width:12px;height:12px}
.catitem .chev{width:11px;height:11px}
.cfitem{display:block;width:100%;text-align:left;padding:8px 10px 6px;border:1px solid transparent;background:transparent;border-radius:6px;min-height:0;line-height:1.3}
.cfitem:hover:not(:disabled){border-color:var(--line);background:var(--ground)}
.cfitem .t{display:block;font-size:16.5px}
.cfitem .d{display:block;font-size:14px;color:var(--muted);font-style:italic;margin-top:1px}
.cfitem .pv{display:block;margin-top:6px;height:46px;background:var(--leaf);border-radius:3px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.cfitem .pv svg{display:block;height:46px;width:auto}
.cfitem .pv .staff{stroke:var(--rule)}
.cfitem .pv use{fill:var(--leaf-ink)}
.cfitem .pv .ledger{stroke:var(--leaf-ink)}
.cfitem .t,.cfitem .d,.catitem .d,.catitem .first{white-space:normal}
.catitem .pv .punct,.cfitem .pv .punct,.catitem .pv .prest,.cfitem .pv .prest{fill:var(--leaf-ink)}
#dotBtn svg{width:20px;height:20px;fill:currentColor}

button{font:inherit;font-size:15.5px;color:var(--text);background:var(--surface);border:1px solid var(--line);
  border-radius:6px;min-height:40px;padding:0 14px;cursor:pointer;line-height:1}
button:hover:not(:disabled){border-color:var(--text)}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.42;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=number]{font:inherit;font-size:15.5px;color:var(--text);background:var(--surface);
  border:1px solid var(--line);border-radius:6px;min-height:38px;padding:0 8px}
input[type=number]{width:4.6em}
input[type=range]{accent-color:var(--accent);width:120px}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;margin:0}

.tools{background:var(--ground);padding:6px 0 12px;z-index:5}
@media (min-width:760px) and (min-height:620px){ .tools{position:sticky;top:0} }
.tools .row{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-start}
.grp{display:flex;flex-direction:column;gap:5px}
.gl{font-size:14px;color:var(--muted);font-style:italic;white-space:nowrap}
.btns{display:flex;gap:4px;flex-wrap:wrap}
.ib{width:44px;height:44px;padding:0;display:grid;place-items:center}
.ib svg{width:36px;height:36px;fill:currentColor;overflow:visible}
.ib.small svg{width:22px;height:22px}
.seg{display:flex}
.seg button{border-radius:0}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0;margin-left:-1px}
.tb{min-height:44px}
.pop{position:relative}
.popbtn{min-width:56px}
.popbtn .chev{width:11px;height:11px;fill:currentColor;margin-left:8px}
.popbody{display:none;position:absolute;left:-6px;top:calc(100% - 2px);z-index:15;padding:6px;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 28px -12px rgba(0,0,0,.4)}
.pop:hover .popbody,.pop:focus-within .popbody,.pop.open .popbody{display:block}
.popbody{width:max-content}
.popbody .btns:not(.col){flex-wrap:nowrap}
.popbody .col{flex-direction:column}
.popbody .col .tb{justify-content:flex-start;text-align:left;white-space:nowrap}
#advBtn .chev{transition:transform .15s}#advBtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.advt{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:8px 6px 4px;margin-top:2px;border-top:1px solid var(--line)}
.advt[hidden]{display:none}
.advt .seg{display:flex}.advt .seg button{flex:1;justify-content:center}
.advt select{min-height:40px}
.advt .ivrow{display:flex;gap:6px}.advt .ivrow select{flex:1 1 auto;min-width:0}.advt .ivrow select[hidden]{display:none}
.advt .check{display:flex;align-items:center;gap:8px;white-space:nowrap}
.popbody .col .advt #advGo{justify-content:center;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (max-width:700px){#popXform{position:static}#popXform .popbody{left:0;right:0;width:auto}.advt .check{white-space:normal}#popLook{position:static}#popLook .popbody{left:0;right:0;width:auto}.staffset{grid-template-columns:auto 1fr}.staffset input[type=range]{width:100%}}
.staffset{display:grid;grid-template-columns:auto 150px;gap:8px 12px;align-items:center;padding:4px 8px}
.staffset input[type=range]{width:150px}
.staffset .btns{display:flex;gap:2px}
.staffset .btns .tb{min-width:44px}
.tools .row .spacer{flex:1}
.tools .row .ctl{align-self:flex-start;margin-top:20px}
.tools .row #clear{align-self:flex-start;margin-top:15px}

.settings{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;margin:2px 0 12px}
label.ctl{display:flex;align-items:center;gap:8px;color:var(--muted)}
.settings .spacer{flex:1}

.leaf{position:relative;background:#EFE3C7 var(--paper);background-size:512px 512px;color:var(--leaf-ink);border-radius:3px;padding:16px 22px 18px;
  box-shadow:0 1px 1px rgba(60,40,10,.14),0 14px 32px -14px rgba(50,34,8,.42),inset 0 0 70px rgba(150,108,40,.13),inset 0 0 0 1px rgba(120,90,40,.16)}
#title{display:block;width:100%;font:italic 400 1.4rem/1.3 "IM Fell English","Palatino Linotype",Palatino,Georgia,serif;
  color:var(--leaf-ink);background:transparent;border:0;border-bottom:1px dashed transparent;padding:2px 0 4px;border-radius:0}
#title:hover{border-bottom-color:rgba(31,26,20,.25)}
#title:focus-visible{outline:none;border-bottom-color:var(--sel)}
#title::placeholder{color:rgba(31,26,20,.42)}
#score{margin-top:4px;cursor:crosshair;touch-action:manipulation;user-select:none;-webkit-user-select:none;border-radius:2px}
#score:focus-visible{outline:1.5px solid rgba(142,42,30,.4);outline-offset:6px}
#score svg{display:block;overflow:visible}
#score .staff{stroke:var(--rule)}
#score .ledger{stroke:var(--leaf-ink)}
#score use,#score .bar,#score .dot{fill:var(--leaf-ink)}
#score .punct,#score .prest{fill:var(--leaf-ink)}
#score .it.hov .punct,#score .it.hov .prest{fill:var(--hov)}
#score .it.sel .punct,#score .it.sel .prest{fill:var(--sel)}
#score .it.play .punct,#score .it.play .prest{fill:var(--play)}
#score use.clefhov{fill:var(--hov)}
#score .it.hov use{fill:var(--hov)}
#score .it.hov .ledger{stroke:var(--hov)}
#score .menshov{stroke:var(--hov)}
#score .it.dim{opacity:.28}
#score use.sigghost{opacity:.26}
#score use.sigghost.on{opacity:.85;fill:var(--hov)}
#score .it.sel use{fill:var(--sel)}
#score .it.sel .ledger{stroke:var(--sel)}
#score .it.play use{fill:var(--play)}
#score .it.play .ledger{stroke:var(--play)}
#score .selbg{fill:var(--sel);opacity:.1}
#score .ghost{opacity:.62}
#score .mic{opacity:.5;pointer-events:none}
#score .take use,#score .take .punct,#score .take .prest{fill:var(--pen)}
#score .take .ledger{stroke:var(--pen)}
#score .take .tie{fill:none;stroke:var(--pen);stroke-width:.12;stroke-linecap:round}
#score .mic .micdot,#score .mic use{fill:var(--pen)}
#score .mic .ledger{stroke:var(--pen)}
#mic svg{width:17px;height:17px;margin:0 4px -3px -2px;fill:currentColor}
.split{display:inline-flex;align-items:center}
.latrow{display:flex;align-items:center;gap:6px;padding:6px 6px 2px 10px;margin-top:4px;border-top:1px solid var(--line);color:var(--muted);font-size:16px}
.latrow input{width:4.2em;height:30px;min-height:30px;text-align:center}
.latrow #micClap{margin-left:auto}
#singOpts{padding:0 7px;min-width:0}
#singOpts .chev{margin-left:0}
#score .ghost use{fill:var(--sel)}
#score .ghost .ledger{stroke:var(--sel)}
#score .caret{fill:var(--sel);opacity:.75}
#score .hint{fill:var(--leaf-muted);font:italic 1.15px "IM Fell English","Palatino Linotype",Palatino,Georgia,serif}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.transport{display:flex;flex-wrap:wrap;align-items:flex-start;gap:18px 34px;margin-top:16px;padding-top:18px;border-top:1px solid var(--line)}
.tp-play{display:flex;gap:8px;align-items:center}
#play{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-width:110px;font-size:17px;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px}
#play svg{width:14px;height:14px;fill:currentColor}
.tactus{display:flex;flex-direction:column;gap:8px}
.vignette{width:176px;height:142px;background:var(--leaf);border:1.5px solid var(--leaf-ink);outline:1px solid var(--leaf-ink);
  outline-offset:-5px;overflow:hidden;border-radius:1px}
.handbox{position:absolute;right:0;top:4px;width:calc(250px * var(--hand-sc,1));height:calc(202px * var(--hand-sc,1));opacity:var(--hand-op,.3);pointer-events:none;z-index:0;transition:top .35s ease}
.handbox svg{display:block;width:100%;height:100%;transform:scaleX(-1)}
#title,#score{position:relative;z-index:1}
.tempo-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.eq{font-size:22px;color:var(--text);padding:0 2px}
.permin{color:var(--muted);margin-right:6px}
.unitpick{position:relative}
.unitbtn{width:58px;grid-template-columns:1fr 12px;gap:0;padding:0 4px 0 2px}
.unitbtn svg{width:34px;height:34px;fill:currentColor}
.unitbtn .chev{width:12px;height:12px;fill:currentColor}
#unitList{left:0;bottom:calc(100% + 6px);min-width:190px}
.menu{position:absolute;z-index:20;margin:0;padding:4px;list-style:none;color:var(--text);
  background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 28px -10px rgba(0,0,0,.35)}
.menu:focus{outline:none}
.menu li{display:flex;align-items:center;gap:10px;padding:3px 12px 3px 4px;border-radius:4px;cursor:pointer;font-size:16px}
.menu li svg{width:32px;height:32px;fill:currentColor;flex:none}
.menu li[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.menu li.active:not([aria-selected="true"]){outline:2px solid var(--accent);outline-offset:-2px}
.menu li:hover:not([aria-selected="true"]){background:color-mix(in srgb,var(--accent) 12%,transparent)}
#clefMenu{display:grid;grid-template-columns:repeat(5,64px);gap:2px;padding:6px}
#clefMenu[hidden]{display:none}
#clefMenu li{flex-direction:column;gap:0;padding:4px 2px 4px;font-size:14px;text-align:center;line-height:1.2}
#clefMenu li svg{width:40px;height:78px;overflow:visible}
#clefMenu li.flatopt{grid-column:span 5;flex-direction:row;justify-content:center;gap:8px;padding:4px 8px;border-top:1px solid var(--line);border-radius:0 0 4px 4px;margin-top:2px}
#clefMenu li.flatopt svg{width:40px;height:30px}
#clefMenu li.off{opacity:.3;pointer-events:none}
.stepper{display:flex}
.stepper button{min-width:38px;padding:0;font-size:20px;border-radius:0}
.stepper button:first-child{border-radius:6px 0 0 6px}
.stepper button:last-child{border-radius:0 6px 6px 0}
.stepper input{border-radius:0;border-left:0;border-right:0;width:3.6em;text-align:center;min-height:40px;font-size:17px;
  -moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#heart{color:var(--rule)}
#heart svg{width:22px;height:22px}
.tune{display:grid;grid-template-columns:auto 150px 3.4em;gap:4px 10px;align-items:center;margin-top:6px;padding-top:8px;border-top:1px solid var(--line);width:100%}
.tune .tg{grid-column:1/-1;font-style:italic;color:var(--muted);font-size:15px;margin-top:4px}
.tune label{color:var(--muted);font-size:16px}
.tune input[type=range]{width:150px}
.tune output{font-variant-numeric:tabular-nums;font-size:15px;color:var(--text);text-align:right}
.tp-side[hidden]{display:none}
.tp-side{display:flex;flex-direction:column;gap:8px;align-items:flex-start}

details.help{margin-top:26px;max-width:760px}
details.help summary{cursor:pointer;color:var(--text);font-size:17px}
.help p{color:var(--muted);margin:.6rem 0}
.help table{border-collapse:collapse;margin-top:8px;font-size:16px}
.help td{padding:5px 18px 5px 0;vertical-align:top}
.help td:first-child{white-space:nowrap}
kbd{font:inherit;font-size:14.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 6px;background:var(--surface)}
footer{margin-top:30px;color:var(--muted);font-size:14.5px}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--ground);
  padding:10px 16px;border-radius:6px;font-size:16px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){ #toast{transition:none} }
@media (max-width:640px){
  .wrap{padding:18px 14px 40px}
  .leaf{padding:12px 12px 14px}
  .ib{width:40px;height:40px}
  .ib svg{width:32px;height:32px}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ================= Layout v2: one control height, one rhythm ================= */
:root{--h:40px}
button,select,input[type=number]{height:var(--h);min-height:var(--h);font-size:16px}
button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;white-space:nowrap}
select{padding:0 10px}
.ib{width:var(--h);padding:0}
.ib svg{width:22px;height:22px;fill:currentColor}
.tb{min-height:var(--h)}
.cfitem{height:auto;min-height:0;display:block}
.chev{width:11px;height:11px;fill:currentColor;flex:none}
header.top{margin-bottom:10px}
.tools{padding:4px 0 10px;position:static}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 8px}
.bar .spacer,.transport .spacer{flex:1 1 16px}
.vsep{width:1px;height:24px;background:var(--line);margin:0 6px;flex:none}
.pop{position:relative}
.popbtn{min-width:0}
.popbtn svg:not(.chev){width:22px;height:22px;fill:currentColor}
#accBtns{display:flex;gap:4px}
#accBtns .ib svg{width:20px;height:22px}
label.ctl{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:16px}
.libbtn{gap:8px}
.leaf{margin-top:2px}

/* Manuscript paper (same recipe as the Cantus firmus app) */
(function(){
  try {
    const rng = seed => { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; };
    const noise = (seed, cell, w, h) => {
      const r = rng(seed), gw = Math.ceil(w / cell) + 2, gh = Math.ceil(h / cell) + 2, g = new Float32Array(gw * gh);
      for (let i = 0; i < g.length; i++) g[i] = r();
      return (x, y) => {
        const fx = x / cell, fy = y / cell, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
        const ix = ((x0 % (gw - 1)) + gw - 1) % (gw - 1), iy = ((y0 % (gh - 1)) + gh - 1) % (gh - 1);
        const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
        const a = g[iy * gw + ix], b = g[iy * gw + ix + 1], c = g[(iy + 1) * gw + ix], d = g[(iy + 1) * gw + ix + 1];
        return a + (b - a) * sx + (c - a + (a - b + d - c) * sx) * sy;
      };
    };
    const w = 512, h = 512, ox = 64, oy = 64, gw = w + ox, gh = h + oy, k = w / 1600;
    const fine = noise(11, 1.6 * k + 1, w, h), mid = noise(12, 9 * k + 2, w, h), big = noise(13, 180 * k, w, h), fox = noise(14, 40 * k, w, h);
    const P = [239, 227, 199], FOX = 0.05;
    const src = new Float32Array(gw * gh * 3);
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
      const i = (y * gw + x) * 3;
      const n = (big(x, y) - 0.5) * 13 + (mid(x, y) - 0.5) * 6 + (fine(x, y) - 0.5) * 5;
      const laid = (mid(x * 0.15, y * 2.5) - 0.5) * 7;
      const wv = (mid(x * 0.3, y * 0.3) - 0.5) * 60 * k;
      const fx = Math.max(0, fox(x + wv, y - wv) * 0.7 + big(x * 2, y * 2) * 0.3 - (1 - FOX * 2.6)) * 90;
      src[i] = P[0] + n + laid - fx * 0.4; src[i + 1] = P[1] + n + laid - fx * 0.7; src[i + 2] = P[2] + n * 1.2 + laid - fx;
    }
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'), img = cx.createImageData(w, h), d = img.data;
    const at = (x, y, c) => src[(y * gw + x) * 3 + c];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const tx = x < ox ? x / ox : 1, ty = y < oy ? y / oy : 1, i = (y * w + x) * 4;
      for (let c = 0; c < 3; c++) {
        const row = yy => at(x, yy, c) * tx + (x < ox ? at(x + w, yy, c) * (1 - tx) : 0);
        d[i + c] = row(y) * ty + (y < oy ? row(y + h) * (1 - ty) : 0);
      }
      d[i + 3] = 255;
    }
    cx.putImageData(img, 0, 0);
    document.documentElement.style.setProperty('--paper', `url(${cv.toDataURL('image/jpeg', 0.88)})`);
  } catch (e) { /* plain beige is fine */ }
})();

/* ------------------------------------------------------------------ */
/* Humdrum **kern reader                                               */
/* ------------------------------------------------------------------ */

      { const bm = s.match(/^=+(\d+)/); if (bm && !barNums.some(b => b.n === +bm[1])) barNums.push({n: +bm[1], t: rt(t)}); }
      continue;

      v.events.push(ev); v.t = rt(v.t + ev.d);

/* ------------------------------------------------------------------ */
/* Mensuration signs                                                   */
/* ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ */
/* From sounding durations to notated shapes                           */
/* ------------------------------------------------------------------ */

/* clef for a voice: as encoded, or a mensural C/F clef that keeps the range on the staff */

  if (!steps.length) return 'c3';

/* ------------------------------------------------------------------ */
/* State                                                               */
/* ------------------------------------------------------------------ */
const KEY = 'choirbook:v1';
const st = {
  piece: PIECES[0], view: 'score', nota: 'real', clefs: 'mens', bars: 'tick', staff: 'red', dashes: 'on', ed: 'on',
  size: 1.75, hs: 1, vs: 1, tempo: 90, beatHand: true, beatPend: false, beatTick: false, handOp: 0.3, handSize: 1, vol: 70, loop: false, verse: 0, paper: 'A4', orient: 'portrait', flow: 'vertical', paperCol: 'parchment', vis: {}

if (st.bars === 'mstrich') st.bars = 'full';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

let piece = null;           /* parsed piece */

let pieceKey = null;
const cache = {};

/* per-voice switches: in the layout, notes, lyrics */
function vis(i){
  const all = st.vis[pieceKey] || (st.vis[pieceKey] = {});
  return all[i] || (all[i] = {on: true, notes: true, lyr: true});

/* ------------------------------------------------------------------ */
/* Text measuring                                                      */
/* ------------------------------------------------------------------ */
const mctx = document.createElement('canvas').getContext('2d');

  mctx.font = `${italic ? 'italic ' : ''}100px "IM Fell English", Georgia, serif`;
  return mctx.measureText(s).width / 100 * size;
}

/* ------------------------------------------------------------------ */
/* Preparing voices for layout                                         */
/* ------------------------------------------------------------------ */
const LYR = 1.7;   /* lyric size, staff spaces */
const decoder = document.createElement('textarea');
function prepare(){
  const mode = st.nota;
  piece.voices.forEach((v, i) => {
    v.idx = i;
    v.clef = chooseClef(v, st.clefs);
    const syms = notate(piece, v, mode);
    const C = CLEFS[v.clef];
    for (const s of syms) {
      s.pos = s.rest ? null : s.step - C.bottom;
      const g = s.rest ? SHAPE_REST[s.g] : s.g + (s.col ? 'c' : '');
      s.glyph = g;

        const key = keyAt(v, s.t), letter = LETTERS[((s.step % 7) + 7) % 7];

      if (s.mens) s.left += mensW(s.mens) + 1.3;
      s.right = s.hw + (s.dot ? 0.75 : 0);

/* ------------------------------------------------------------------ */
/* Horizontal layout                                                   */
/* ------------------------------------------------------------------ */
const spring = d => 0.05 + 0.25 * Math.min(1, st.hs) + (0.8 + 2.3 * Math.pow(Math.max(d, 0.05), 0.6)) * st.hs;

/* columns for a set of voices over [a, b) */
function columns(vlist, a, b, withLyrics){
  const map = new Map();
  const col = t => { const k = rt(t); let c = map.get(k); if (!c) { c = {t: k, items: new Map(), bar: null}; map.set(k, c); } return c; };
  for (const v of vlist) for (const s of v.syms) if (s.t >= a - EPS && s.t < b - EPS) col(s.t).items.set(v, s);
  for (const br of piece.bars) if (br.t > a + EPS && br.t < b - EPS) col(br.t).bar = br.type;
  const cols = [...map.values()].sort((x, y) => x.t - y.t);
  /* spacing */
  const lastX = new Map(), lastD = new Map(), lastSyl = new Map();
  let prev = null;
  const barOn = st.bars === 'full' || st.bars === 'tick';
  /* the lowest quarter of the spacing slider lets notes and syllables crowd, even overlap */
  const tight = Math.min(1, st.hs / 0.6), squeeze = 0.3 + 0.7 * tight;
  for (const c of cols) {
    let left = 0, right = 0.3;
    for (const s of c.items.values()) { left = Math.max(left, s.left); right = Math.max(right, s.right); }
    c.left = left; c.right = right;
    const needBar = c.bar && (barOn || c.bar === 'double');
    let x = prev ? prev.x + (prev.right + left) * squeeze + 0.08 * tight + 0.47 * Math.min(1, st.hs) + (needBar ? 0.5 * tight + 0.4 * Math.min(1, st.hs) : 0) : left;
    for (const [v, s] of c.items) {
      if (lastX.has(v)) x = Math.max(x, lastX.get(v) + spring(lastD.get(v)) + (needBar ? 0.5 : 0));
      if (withLyrics(v) && s.text && lastSyl.has(v)) x = Math.max(x, lastSyl.get(v) + (s.tw / 2 - s.hw / 2) * squeeze + 0.25 * tight + 0.3 * Math.min(1, st.hs));
    }
    c.x = x;
    for (const [v, s] of c.items) {
      lastX.set(v, x); lastD.set(v, s.d);
      if (withLyrics(v) && s.text) lastSyl.set(v, x + (s.hw / 2 + s.tw / 2 + (s.hy ? 0.9 : 0)) * squeeze);
    }
    prev = c;
  }
  /* clean break points: no voice holds a note across the column */
  const ptr = new Map(vlist.map(v => [v, 0]));
  for (const c of cols) {
    c.clean = true;
    for (const v of vlist) {
      const syms = v.syms;
      let i = ptr.get(v);
      while (i < syms.length && syms[i].end <= c.t + EPS) i++;
      ptr.set(v, i);
      if (i < syms.length && syms[i].t < c.t - EPS) { c.clean = false; break; }
    }
  }
  return cols;
}

/* break columns into lines of the given width; returns [{from, to}] */
function breakLines(cols, avail, firstAvail){
  const lines = [];
  let i = 0;
  const CUST = 2.2;
  while (i < cols.length) {
    const W = lines.length === 0 && firstAvail !== undefined ? firstAvail : avail;
    let j = i + 1, lastClean = -1;
    while (j < cols.length) {
      const width = cols[j].x - cols[i].x + cols[i].left + cols[j].right + CUST;
      if (width > W) break;
      if (cols[j].clean) lastClean = j;
      j++;
    }
    let end = j;
    if (j < cols.length && lastClean > i) end = lastClean;
    lines.push({from: i, to: end});
    i = end;
  }
  return lines;
}

/* ------------------------------------------------------------------ */
/* Drawing                                                             */
/* ------------------------------------------------------------------ */
const use = (k, x, y) => `<use href="#g-${k}" x="${f(x)}" y="${f(y)}"/>`;
const useT = (k, x, y, sx, sy) => `<use href="#g-${k}" transform="translate(${f(x)} ${f(y)}) scale(${sx} ${sy})"/>`;
const hl = (x1, x2, y, cls, w) => `<line class="${cls}" x1="${f(x1)}" x2="${f(x2)}" y1="${f(y)}" y2="${f(y)}" stroke-width="${w}"/>`;
const vl = (x, y1, y2, cls, w) => `<line class="${cls}" x1="${f(x)}" x2="${f(x)}" y1="${f(y1)}" y2="${f(y2)}" stroke-width="${w}"/>`;

function clefSvg(c, x, top){
  const C = CLEFS[c];
  let s = use(C.g, x, top + (8 - C.pos) * 0.5);
  if (C.oct) s += `<g transform="translate(${f(x + (gw(C.g) - gw('n8') * 0.8) / 2)} ${f(top + (8 - C.pos) * 0.5 + GLY[C.g].b[3] + 1.15)}) scale(0.8)">${use('n8', 0, 0)}</g>`;
  return s;
}
const clefW = c => gw(CLEFS[c].g);
function keySig(v, t, clef){
  const k = keyAt(v, t), C = CLEFS[clef], out = [];
  for (const L of Object.keys(k)) {

    let best = null;
    for (let oct = 0; oct < 9; oct++) { const step = 7 * oct + idx, p = step - C.bottom; if (p >= 0 && p <= 8) best = p; }
    if (best === null) for (let oct = 0; oct < 9; oct++) { const step = 7 * oct + idx, p = step - C.bottom; if (p >= -1 && p <= 9) best = p; }

}
function mensSvg(sign, x, top){

  }
  if (stroke && (hasC || hasO)) o += vl(cx, cy - 1.75, cy + 1.75, 'ms', 0.2);
  if (dot) o += `<circle class="ink" cx="${f(cx)}" cy="${f(cy)}" r="0.2"/>`;
  if (num) {
    const nx = hasC || hasO ? x + 2.5 : x;
    o += `<text x="${f(nx)}" y="${f(cy + 1.05)}" font-size="3">${num}</text>`;

}
function ledgers(pos, x, w, top){

  for (let p = 10; p <= pos; p += 2) s += hl(x - 0.4, x + w + 0.4, top + 4 - p * 0.5, 'ledger', 0.16);

const rrect = (x, y1, y2) => `<rect class="ink" x="${f(x)}" y="${f(y1)}" width="0.42" height="${f(y2 - y1)}"/>`;
function restSvg(s, cx, top){

function fermata(cx, y){

/* how far a symbol reaches above and below the staff (staff spaces from the top line) */
function extent(s){

  let lo = y - 0.8, hi = y + 0.8;
  const flip = isFlipped(s);
  if (STEMMED[s.g]) { if (flip) hi = y + 3.6; else lo = y - 3.6; }

const isFlipped = s => (STEMMED[s.g] && s.pos >= 7) || (TAILED[s.g] && s.pos <= -1);

function symSvg(s, X, top, showNotes){

  const hy = s.rest ? top + 0.5 : top + 4 - s.pos * 0.5 - 1;

function symInner(s, X, top){

  if (s.rest) { o += restSvg(s, hx + s.hw / 2, top); return o; }

  o += isFlipped(s) ? useT(s.glyph, hx, y, 1, -1) : use(s.glyph, hx, y);

    o += `<g transform="translate(${f(hx + s.hw / 2 - gw(s.edAcc) * 0.36)} ${f(ay)}) scale(0.72)">${use(s.edAcc, 0, 0)}</g>`;
  }

    const fy = Math.min(top - 0.7, y - (STEMMED[s.g] && !isFlipped(s) ? 4.1 : 1.2));

function custosSvg(s, x, top){

  return `<use href="#g-${s.pos >= 5 ? 'cd' : 'cu'}" transform="translate(${f(x)} ${f(y + 0.4)}) scale(0.8)"/>`;

/* One line of one voice's staff. ctx: {v, cols(from..to), xs, top, x0, x1, last, showNotes, showLyr, first} */
function staffLine(o){
  const {v, top, x0, x1} = o;
  let s = '';
  for (let k = 0; k < 5; k++) s += hl(x0, x1, top + k, 'staff', 0.12);
  /* clef, key */
  const t0 = o.t0;
  const clef = v.clef;
  s += clefSvg(clef, x0 + 0.5, top);
  let x = x0 + 0.5 + clefW(clef) + 0.5;
  for (const k of keySig(v, t0, clef)) { s += use(k.g, x, top + 4 - k.pos * 0.5); x += gw(k.g) + 0.15; }
  /* notes */
  const show = o.showNotes;
  for (let i = o.from; i < o.to; i++) {
    const c = o.cols[i], sym = c.items.get(v);
    if (!sym) continue;
    const X = o.xs[i];
    s += symSvg(sym, X, top, show);
    if (o.showLyr && sym.text) {
      s += `<text x="${f(X + sym.hw / 2)}" y="${f(o.lyrY)}" font-size="${LYR}" text-anchor="middle">${esc(sym.text)}</text>`;
    }
  }
  /* hyphens between syllables, ties */
  let prevSyl = null;
  const syms = [];
  for (let i = o.from; i < o.to; i++) { const sym = o.cols[i].items.get(v); if (sym) syms.push([sym, o.xs[i]]); }
  if (o.showLyr) {
    for (const [sym, X] of syms) {
      if (sym.text) {
        if (prevSyl && prevSyl[0].hy) {
          const a = prevSyl[1] + prevSyl[0].hw / 2 + prevSyl[0].tw / 2, b = X + sym.hw / 2 - sym.tw / 2;
          if (b - a > 0.6) s += hl((a + b) / 2 - 0.3, (a + b) / 2 + 0.3, o.lyrY - 0.45, 'barl', 0.1);
        }
        prevSyl = [sym, X];
      }
    }
    if (prevSyl && prevSyl[0].hy && !o.last) {
      const a = prevSyl[1] + prevSyl[0].hw / 2 + prevSyl[0].tw / 2;
      if (o.lineEnd - a > 0.8) s += hl(a + 0.3, a + 0.9, o.lyrY - 0.45, 'barl', 0.1);
    }

      const [sym, X] = syms[k];

        let lo = 0;
        for (let q = k; q <= k2; q++) lo = Math.min(lo, extent(syms[q][0])[0]);
        s += `<text x="${f((xa + xb) / 2)}" y="${f(top + lo - 0.5)}" font-size="1.7" text-anchor="middle" font-style="italic">3</text>`;
      }
    }
  }
  /* custos at the end of the line */
  if (!o.last && show && o.next) s += custosSvg(o.next, x1 - 2.0, top);

}

/* barlines for a group of staves at column x */
/* segs: the stretches between the staves where a line may run (the lyrics are left clear) */
function barSvg(type, x, tops, single, segs){
  let s = '';
  const style = st.bars;
  const between = xx => { for (const g of segs) for (const [a, b] of g) if (b - a > 0.2) s += vl(xx, a, b, 'barl', 0.14); };
  if (type === 'double') {
    for (const t of tops) { s += vl(x - 0.25, t, t + 4, 'barl', 0.14) + vl(x + 0.25, t, t + 4, 'barl', 0.14); }
    if (style === 'full') { between(x - 0.25); between(x + 0.25); }
    return s;
  }
  if (style === 'none') return '';
  if (style === 'full') {
    for (const t of tops) s += vl(x, t, t + 4, 'barl', 0.14);
    between(x);
  } else if (style === 'tick') {
    for (const t of tops) s += vl(x, t - 0.9, t + 1, 'barl', 0.14);
  }

}
function finalBar(x, tops){
  let s = '';
  for (const t of tops) s += `<rect class="ink" x="${f(x)}" y="${f(t)}" width="0.16" height="4"/><rect class="ink" x="${f(x + 0.4)}" y="${f(t)}" width="0.5" height="4"/>`;
  return s;
}

/* ------------------------------------------------------------------ */
/* Systems: a set of voices laid out together, line by line            */
/* ------------------------------------------------------------------ */
function headerW(v){
  const k = keySig(v, 0, v.clef).length;
  return 0.5 + clefW(v.clef) + 0.5 + k * 1.0 + 0.6;
}
/* build lines for voices over [a,b) at width W; returns lines with x positions */
function buildLines(vlist, a, b, W, opts = {}){
  const lyrOn = v => vis(v.idx).lyr;
  const cols = columns(vlist, a, b, lyrOn);
  if (!cols.length) return [];
  const hw = Math.max(...vlist.map(headerW));
  const indent = opts.indent || 0;
  const avail = W - hw;
  const br = breakLines(cols, avail, avail - indent);
  const allEnd = b >= piece.end - EPS;
  return br.map((L, li) => {
    const ind = li === 0 ? indent : 0;
    const startX = ind + hw + cols[L.from].left;
    const last = li === br.length - 1;
    const lastCol = cols[L.to - 1];
    const natural = lastCol.x - cols[L.from].x;
    const room = W - ind - hw - cols[L.from].left - lastCol.right - (last && allEnd ? 1.6 : 2.4);
    let k = natural > 0 ? room / natural : 1;
    if (last && (k > 1.3 || opts.ragged)) k = 1;
    if (last && opts.raggedLast) k = Math.min(k, 1);

    for (let i = L.from; i < L.to; i++) xs[i] = startX + (cols[i].x - cols[L.from].x) * k;
    const endX = last ? (allEnd ? xs[L.to - 1] + lastCol.right + 1.2 : Math.max(xs[L.to - 1] + lastCol.right + 2.4, opts.ragged ? 0 : W)) : W;

/* vertical room a voice needs in a line */
function lineRoom(v, line){
  const m = Math.min(1, st.vs), pad = 0.15 + 0.25 * m;

  for (let i = line.from; i < line.to; i++) {
    const s = line.cols[i].items.get(v);
    if (!s) continue;
    const e = extent(s);
    lo = Math.min(lo, e[0] - pad); hi = Math.max(hi, e[1] + pad);
  }
  const lyr = vis(v.idx).lyr && v.syms.some(s => s.text);

function nextSym(v, t){
  return v.syms.find(s => s.t >= t - EPS) || null;
}

  let s = '';
  for (const sec of piece.sections) {
    if (sec.t < line.t0 - EPS || sec.t >= line.tEnd - EPS) continue;
    let i = line.cols.findIndex((c, k) => k >= line.from && k < line.to && c.t >= sec.t - EPS);
    if (i < 0) continue;
    const x = sec.t < EPS ? line.x0 : line.xs[i] - 0.5;
    s += `<text x="${f(x)}" y="${f(top)}" font-size="1.9" font-style="italic">${esc(sec.label)}</text>`;

/* draw one system (several voices stacked) at y; returns {svg, h} */
function drawSystem(vlist, line, y, opts = {}){
  const rooms = vlist.map(v => lineRoom(v, line));
  const gap = 1.2 * st.vs;
  const tops = [];
  let yy = y;
  const secRoom = piece.sections.some(sec => sec.t >= line.t0 - EPS && sec.t < line.tEnd - EPS) ? 2.6 : 0;
  yy += secRoom;
  vlist.forEach((v, k) => {
    yy += rooms[k].above + (k ? gap : 0);
    tops.push(yy);
    yy += 4 + rooms[k].below;
  });
  let s = '';
  if (secRoom) s += sectionLabels(line, tops[0] - rooms[0].above - 0.4, line.x1);
  vlist.forEach((v, k) => {
    const sh = vis(v.idx);
    s += staffLine({v, cols: line.cols, from: line.from, to: line.to, xs: line.xs, top: tops[k], x0: line.x0, x1: line.x1,

      next: nextSym(v, line.tEnd)});

  });

  const single = vlist.length === 1;
  const segs = [];
  for (let k = 0; k + 1 < vlist.length; k++) {
    const a = tops[k] + 4, b = tops[k + 1];
    const hasLyr = vis(vlist[k].idx).lyr && vlist[k].syms.some(q => q.text);
    if (hasLyr) { const ly = tops[k] + rooms[k].lyrY; segs.push([[a, ly - 1.7], [ly + 0.7, b]]); }

    if (br && br.type === 'double') s += barSvg('double', line.x1 - 0.4, tops, single, segs);

  return {svg: s, h: yy - y, tops};
}

/* ------------------------------------------------------------------ */
/* Pages                                                               */
/* ------------------------------------------------------------------ */
const PAPER = {A3: [297, 420], A4: [210, 297], A5: [148, 210]};
function pageGeom(){
  let [w, h] = PAPER[st.paper] || PAPER.A4;
  if (st.orient === 'landscape') [w, h] = [h, w];

function titleBlock(G, x0, x1, y, sub){

  let h = 4.6;

function visibleVoices(){ return piece.voices.filter(v => vis(v.idx).on); }

function layoutScore(G){

  const names = vlist.map(v => v.name);
  const indent = Math.max(...names.map(n => textW(n, 1.8, true))) + 1.4;

function paginate(G, lines, vlist, optsFor, sub){

  if (first) { const tb = titleBlock(G, G.M, G.W - G.M, y, sub); body += tb.svg; y += tb.h; }

    const probe = drawSystem(vlist, line, 0, optsFor(line, li));
    if (y + probe.h > G.H - G.M && body) newPage();
    const sys = drawSystem(vlist, line, y, optsFor(line, li));
    body += `<g transform="translate(${f(G.M)} 0)">${sys.svg}</g>`;

    const lines = buildLines([v], 0, piece.end + 1, W, {});
    out.push(...paginate(G, lines, [v], () => ({}), v.name));

}

/* Choir book: openings with the voices spread over the two pages; every opening covers the same music in each voice */
function choirSides(vlist){
  const n = vlist.length;
  if (n === 1) return [[vlist[0]], []];
  if (n === 2) return [[vlist[0]], [vlist[1]]];
  if (n === 3) return [[vlist[0]], [vlist[1], vlist[2]]];

function layoutChoir(G){
  const vlist = visibleVoices();
  if (!vlist.length) return [];
  const sides = choirSides(vlist);
  const W = G.W - 2 * G.M;
  /* each voice's own columns, spaced once */
  const lyrOn = v => vis(v.idx).lyr;
  const vcols = new Map(vlist.map(v => [v, columns([v], 0, piece.end + 1, lyrOn)]));
  /* opening boundaries where no voice holds a note across */
  const times = new Set();
  for (const v of vlist) for (const s of v.syms) times.add(s.t);
  for (const b of piece.bars) times.add(b.t);
  const holds = (v, t) => v.syms.some(s => s.t < t - EPS && s.end > t + EPS);
  let cands = [...times].filter(t => t > EPS && vlist.every(v => !holds(v, t))).sort((a, b) => a - b);
  cands.push(piece.end + 1);
  /* lines a voice needs for [a,b) */
  const hdr = new Map(vlist.map(v => [v, headerW(v)]));
  const linesNeeded = (v, a, b) => {
    const cols = vcols.get(v).filter(c => c.t >= a - EPS && c.t < b - EPS);
    if (!cols.length) return 0;
    return breakLines(cols, W - hdr.get(v)).length;
  };
  const sysPitch = v => {
    const lyr = vis(v.idx).lyr && v.syms.some(s => s.text);
    return 4 + 1.2 + 1.2 * Math.min(1, st.vs) + (lyr ? 3.0 : 0) + 1.6 * st.vs;
  };
  /* region heights per side; the first opening carries the title */
  const tb = titleBlock(G, G.M, G.W - G.M, G.M, null);
  const capacity = (side, top) => {
    const H = G.H - G.M - top;
    const n = side.length || 1;
    const per = H / n;
    return side.map(v => Math.max(1, Math.floor((per - 2.4) / sysPitch(v))));
  };
  const openings = [];
  let a = 0, guard = 0;
  while (a < piece.end - EPS && guard++ < 500) {
    const top = G.M + (openings.length === 0 ? tb.h : 0) + 0.4;
    const caps = new Map();
    sides.forEach(side => capacity(side, top).forEach((c, k) => caps.set(side[k], c)));
    const fits = b => vlist.every(v => linesNeeded(v, a, b) <= caps.get(v));
    let lo = cands.findIndex(t => t > a + EPS);
    if (lo < 0) break;
    let hi = cands.length - 1, best = lo;
    if (fits(cands[hi])) best = hi;
    else {
      while (lo <= hi) { const mid = (lo + hi) >> 1; if (fits(cands[mid])) { best = mid; lo = mid + 1; } else hi = mid - 1; }
    }
    const b = cands[best];
    openings.push({a, b, top, caps});
    a = b;
  }
  /* draw */
  const pages = [];
  openings.forEach((op, oi) => {
    sides.forEach((side, si) => {
      let body = '';
      if (oi === 0 && si === 0) body += titleBlock(G, G.M, G.W - G.M, G.M, null).svg;
      const H = G.H - G.M - op.top, per = H / (side.length || 1);
      side.forEach((v, k) => {
        const y0 = op.top + per * k;
        body += `<text x="${f(G.M)}" y="${f(y0 + 1.6)}" font-size="1.8" font-style="italic">${esc(v.name)}</text>`;
        const lines = buildLines([v], op.a, op.b, W, {raggedLast: true});
        const pitch = sysPitch(v);
        lines.forEach((line, li) => {
          const room = lineRoom(v, line);
          const ty = y0 + 2.4 + li * pitch + Math.max(1.2, Math.min(room.above, 2.4));
          const sys = drawSystem([v], line, ty - Math.min(room.above, 2.4) - 0, {});
          body += `<g transform="translate(${f(G.M)} 0)">${sys.svg}</g>`;
        });
      });
      pages.push({svg: pageSvg(G, body), side: si, opening: oi});
    });
  });
  return pages;
}

const pagesEl = $('#pages'), viewerEl = $('#viewer');
let defsDone = false;
function defs(){
  if (defsDone) return;
  const d = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  d.setAttribute('width', '0'); d.setAttribute('height', '0'); d.style.position = 'absolute';
  d.innerHTML = '<defs>' + Object.entries(GLY).map(([k, v]) => `<path id="g-${k}" d="${v.d}"/>`).join('') + '</defs>';
  document.body.appendChild(d);
  defsDone = true;
}
function render(){
  if (!piece) return;
  defs();
  prepare();
  const G = pageGeom();
  document.getElementById('pagerule').textContent = `@page{size:${st.paper} ${st.orient};margin:0}`;
  let html = '';
  const horiz = st.flow === 'horizontal';
  const avail = (viewerEl.clientWidth || window.innerWidth) - (horiz ? (window.innerWidth <= 700 ? 60 : 140) : 40);
  const pxmm = 96 / 25.4;
  /* side by side, a page (or an opening) fits the height of the window */
  const availH = Math.max(320, (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--vh')) || 700) - 60);
  const fitH = horiz ? availH / (G.hmm * pxmm) : Infinity;
  if (st.view === 'choir') {
    const pages = layoutChoir(G);
    const sc = Math.min(1.25, avail / (2 * G.wmm * pxmm), fitH);
    for (let i = 0; i < pages.length; i += 2) {
      html += `<div class="opening">`;
      for (const p of pages.slice(i, i + 2)) html += pageDiv(p.svg, G, sc, '');
      html += `</div>`;
    }
    if (!pages.length) html = '<p class="msg">No voices are shown.</p>';
  } else {
    const pages = st.view === 'parts' ? layoutParts(G) : layoutScore(G);
    const sc = Math.min(1.25, avail / (G.wmm * pxmm), fitH);
    pages.forEach((p, i) => { html += pageDiv(p, G, sc, `<span class="pnum">${i + 1}</span>`); });
    if (!pages.length) html = '<p class="msg">No voices are shown.</p>';
  }
  pagesEl.innerHTML = html;
  if (typeof showSel === 'function' && ed.sel) showSel();
  applyMark();
  if (!play) { handTop = -1; $('#handBox').style.top = ''; $('#pendBox').style.top = ''; }
  syncNav();
  postHeight();
}
/* pages side by side: the arrows move one page (one opening in the choir book) left or right */
const navItems = () => [...pagesEl.children].filter(c => c.classList.contains('page') || c.classList.contains('opening'));
function navIndex(){
  const items = navItems(), mid = viewerEl.scrollLeft + viewerEl.clientWidth / 2;
  let best = 0, bd = Infinity;
  items.forEach((c, i) => { const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid); if (d < bd) { bd = d; best = i; } });
  return best;
}
function goPage(dir){
  const items = navItems(); if (!items.length) return;
  const i = Math.max(0, Math.min(items.length - 1, navIndex() + dir)), c = items[i];
  viewerEl.scrollTo({left: c.offsetLeft + c.offsetWidth / 2 - viewerEl.clientWidth / 2, behavior: 'smooth'});
}
function syncNav(){
  const horiz = st.flow === 'horizontal';
  const max = viewerEl.scrollWidth - viewerEl.clientWidth;
  $('#pgPrev').disabled = !horiz || viewerEl.scrollLeft <= 2;
  $('#pgNext').disabled = !horiz || viewerEl.scrollLeft >= max - 2;
}
$('#pgPrev').addEventListener('click', () => goPage(-1));
$('#pgNext').addEventListener('click', () => goPage(1));
viewerEl.addEventListener('scroll', () => syncNav(), {passive: true});
viewerEl.addEventListener('wheel', e => {
  if (st.flow !== 'horizontal' || e.ctrlKey || Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
  if (!e.target.closest('.page')) return;
  const max = viewerEl.scrollWidth - viewerEl.clientWidth;
  const d = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? viewerEl.clientWidth : 1);
  if ((d < 0 && viewerEl.scrollLeft <= 0) || (d > 0 && viewerEl.scrollLeft >= max - 1)) return;   /* at the end of the row the website scrolls on */
  e.preventDefault();
  viewerEl.scrollLeft += d;
}, {passive: false});
/* bring a note into sight: in the row of pages, and in the window (or the site page around the app) */
function bringIntoView(el, force){
  const r = el.getBoundingClientRect();
  let top = 0, bottom = window.innerHeight;
  if (EMBED) {
    try { const fr = window.frameElement.getBoundingClientRect(), H = window.top.innerHeight; top = -fr.top; bottom = H - fr.top; }
    catch (e) { top = 0; bottom = window.innerHeight; }
  }
  const vr = viewerEl.getBoundingClientRect();
  const offX = st.flow === 'horizontal' && (r.left < vr.left + 50 || r.right > vr.right - 50);
  const offY = r.top < top + 20 || r.bottom > bottom - 20;
  if (!force && !offX && !offY) return false;
  if (offX) { const c = navItems().find(c => c.contains(el)); if (c) viewerEl.scrollTo({left: c.offsetLeft + c.offsetWidth / 2 - viewerEl.clientWidth / 2, behavior: 'smooth'}); }
  if (offY) {
    const y = r.top - top - (bottom - top) / 3;
    if (EMBED) { try { window.top.scrollBy({top: y, behavior: 'smooth'}); return true; } catch (e) {} }
    window.scrollBy({top: y, behavior: 'smooth'});
  }

}
function pageDiv(svg, G, sc, extra){
  return `<div class="page" style="width:${f(G.wmm * 96 / 25.4 * sc)}px;height:${f(G.hmm * 96 / 25.4 * sc)}px" data-w="${G.wmm}" data-h="${G.hmm}">${svg}${extra}</div>`;
}

window.addEventListener('beforeprint', () => {

window.addEventListener('afterprint', () => {
  document.querySelectorAll('.page').forEach(p => { p.style.width = p.dataset.sw; p.style.height = p.dataset.sh; });
});

  '1520': ['The 1520s Project', 'https://1520s-project.org', 'CC BY-NC 4.0'],
  pal: ['music21 corpus (Palestrina, encoded by John Miller)', 'https://github.com/cuthbertLab/music21', '']};
let catPromise = null;
function loadCatalogue(){
  if (!catPromise) catPromise = fetch('choirbook/catalogue.json').then(r => r.json()).then(j => {
    CAT = j; CAT.pieces.forEach(e => { CATBY[e.k] = e; });

}
function catUrl(e){
  if (e.h) return 'choirbook/redix-progressio/' + e.k + '.krn';

function setAddress(key, extra){

}

let mark = null;
function barTime(n){

function applyMark(){

  const t0 = barTime(mark.from);
  let t1 = barTime(mark.to + 1); if (t1 === null) t1 = piece.end;
  box.hidden = false;
  $('#markTxt').textContent = mark.from === mark.to ? `Bar ${mark.from} is marked in blue.` : `Bars ${mark.from}–${mark.to} are marked in blue.`;
  if (t0 === null) { $('#markTxt').textContent = `Bar ${mark.from} was not found in this score.`; return; }
  let first = null;
  for (const v of piece.voices) for (const q of (v.syms || [])) {

async function loadPiece(file){

/* ------------------------------------------------------------------ */
/* Writing **kern back out (for edits, and to download)                */
/* ------------------------------------------------------------------ */
function recipOf(d){
  for (let dots = 0; dots <= 2; dots++) {
    const base = d / (2 - Math.pow(0.5, dots));
    const k = Math.log2(base);
    if (Math.abs(k - Math.round(k)) < 1e-6 && k >= -7 && k <= 3) {
      const r = Math.round(k) >= 1 ? '0'.repeat(Math.round(k)) : String(Math.round(1 / base));
      return r + '.'.repeat(dots);
    }
  }
  /* rational value M/N of a whole note: N%M */
  for (let n = 1; n <= 96; n++) { const m = d * n; if (Math.abs(m - Math.round(m)) < 1e-6) return n + '%' + Math.round(m); }
  return '1';
}
function pitchTok(step){
  const oct = Math.floor(step / 7), L = LETTERS[((step % 7) + 7) % 7];
  return oct >= 4 ? L.repeat(oct - 3) : L.toUpperCase().repeat(4 - oct);
}
function noteTok(e, tie){
  let s = recipOf(e.d);
  if (e.rest) s += 'r';
  else {
    s = (tie === 'start' ? '[' : '') + s + pitchTok(e.step);
    if (e.alt !== null && e.alt !== undefined) s += e.alt < 0 ? '-'.repeat(-e.alt) : e.alt > 0 ? '#'.repeat(e.alt) : 'n';
    if (e.ed) s += 'i';
    if (tie === 'mid') s += '_';
    if (tie === 'end') s += ']';
  }
  if (e.long) s += 'l';
  if (e.ferm) s += ';';
  return s;
}
function retime(v){
  let t = 0;
  for (const e of v.events) { e.t = rt(t); t = rt(t + e.d); }
  v.end = t;
  const at = ei => ei < v.events.length ? v.events[ei].t : v.end;
  for (const arr of [v.mets, v.keys, v.clefs]) for (const m of arr) m.t = at(m.ei);
}
function writeKern(P){
  const vs = P.voices.slice().reverse();          /* file order: lowest voice first */
  P.voices.forEach(retime);
  P.end = Math.max(...P.voices.map(v => v.end));
  const out = [];
  for (const [k, val] of Object.entries(P.meta)) out.push(`!!!${k}: ${val}`);
  const cols = [];
  vs.forEach(v => { cols.push({v, text: -1}); for (let k = 0; k < Math.max(v.verses, 0); k++) cols.push({v, text: k}); });
  const line = f2 => cols.map(c => f2(c)).join('\t');
  out.push(line(c => c.text < 0 ? '**kern' : '**text'));
  out.push(line(c => c.text < 0 ? `*I"${c.v.name}` : '*'));
  if (vs.some(v => v.abbr)) out.push(line(c => c.text < 0 && c.v.abbr ? `*I'${c.v.abbr}` : '*'));
  /* every event split at the barlines, with ties */
  const barT = P.bars.map(b => b.t);
  const pieces = new Map();
  vs.forEach(v => {
    const list = [];
    v.events.forEach((e, ei) => {
      let a = e.t; const b = rt(e.t + e.d);
      const cuts = barT.filter(t => t > a + EPS && t < b - EPS);
      const ts = [a, ...cuts, b];
      for (let q = 0; q + 1 < ts.length; q++) {
        const part = Object.assign({}, e, {d: rt(ts[q + 1] - ts[q]), t: ts[q]});
        let tie = null;
        if (!e.rest && ts.length > 2) tie = q === 0 ? (e.tieEnd || e.tieMid ? 'mid' : 'start') : q === ts.length - 2 ? (e.tieStart || e.tieMid ? 'mid' : 'end') : 'mid';
        else if (!e.rest) tie = e.tieStart && !e.tieEnd ? 'start' : e.tieMid ? 'mid' : e.tieEnd && !e.tieStart ? 'end' : null;
        if (q) part.syl = [], part.ferm = false;
        if (q < ts.length - 2) part.long = false;
        list.push({t: rt(part.t), e: part, tie, ei, first: q === 0});
      }
    });
    pieces.set(v, list);
  });
  const markersAt = (v, t) => ({
    clef: v.clefs.filter(m => eq(m.t, t)), key: v.keys.filter(m => eq(m.t, t)), met: v.mets.filter(m => eq(m.t, t))
  });
  const times = new Set([0]);
  vs.forEach(v => pieces.get(v).forEach(p => times.add(p.t)));
  barT.forEach(t => times.add(t));
  vs.forEach(v => [...v.mets, ...v.keys, ...v.clefs].forEach(m => times.add(rt(m.t))));
  const sorted = [...times].sort((a, b) => a - b);
  const ptr = new Map(vs.map(v => [v, 0]));
  out.push(line(() => '=1-'));
  for (const t of sorted) {
    const bar = P.bars.find(b => eq(b.t, t) && !eq(t, P.end));
    if (bar) out.push(line(() => bar.type === 'double' ? '=||' : '='));
    for (const kind of ['clef', 'key', 'met']) {
      const any = vs.some(v => markersAt(v, t)[kind].length);
      if (!any) continue;
      out.push(line(c => {
        if (c.text >= 0) return '*';
        const m = markersAt(c.v, t)[kind][0];
        if (!m) return '*';
        return kind === 'clef' ? `*clef${m.c}` : kind === 'key' ? `*k[${m.raw ?? Object.entries(m.alts).map(([l, a]) => l + (a < 0 ? '-' : '#')).join('')}]` : `*met(${m.sign})`;
      }));
    }
    const sec = P.sections.find(x => eq(x.t, t));
    if (sec) out.push('!!section: ' + sec.label);
    const row = new Map();
    vs.forEach(v => { const L = pieces.get(v); let i = ptr.get(v); if (i < L.length && eq(L[i].t, t)) { row.set(v, L[i]); ptr.set(v, i + 1); } });
    if (!row.size) continue;
    out.push(line(c => {
      const p = row.get(c.v);
      if (!p) return '.';
      if (c.text < 0) return noteTok(p.e, p.tie);
      const sy = p.first && p.e.syl && p.e.syl[c.text];
      return sy ? sy : '.';
    }));
  }
  out.push(line(() => '=='));
  out.push(line(() => '*-'));
  return out.join('\n') + '\n';
}

/* ------------------------------------------------------------------ */
/* Editing                                                             */
/* ------------------------------------------------------------------ */
const ed = {on: false, sel: null, undo: [], redo: [], val: 'S'};   /* sel: {vi, ei} */
const EKEY = k => 'choirbook:edit:' + k;
const VALS = [['Mx', 8], ['L', 4], ['B', 2], ['S', 1], ['M', 0.5], ['Sm', 0.25], ['F', 0.125]];
function selSym(){
  if (!ed.sel || !piece) return null;
  const v = piece.voices[ed.sel.vi];
  if (!v || !v.syms) return null;
  return v.syms.find(s => s.src && s.src.includes(ed.sel.ei)) || null;
}
function commit(mutate){
  const before = piece.text || writeKern(piece);
  mutate();
  const text = writeKern(piece);
  ed.undo.push(before); ed.redo = [];
  applyText(text);
}
function applyText(text){
  const sel = ed.sel;
  const keep = piece;
  try { piece = parseKern(text); } catch (e) { piece = keep; return; }
  piece.text = text;
  try { localStorage.setItem(EKEY(pieceKey), text); } catch (e) {}
  if (sel) { const v = piece.voices[sel.vi]; if (!v || sel.ei >= v.events.length) ed.sel = v && v.events.length ? {vi: sel.vi, ei: v.events.length - 1} : null; }
  syncEdit(); syncUI(); render();
}
function implied(v, step, t){
  const k = keyAt(v, t), L = LETTERS[((step % 7) + 7) % 7];
  return k[L] ? k[L] : null;
}
function curVoice(){ return ed.sel ? piece.voices[ed.sel.vi] : null; }
function srcOf(){ const s = selSym(); return s ? s.src : ed.sel ? [ed.sel.ei] : []; }
/* written value of the selection under its sign, for the value buttons */
function propAt(v, t){ return mensInfo(metAt(v, t)).p; }
const OPS = {
  step(dir){
    const v = curVoice(); if (!v) return;
    commit(() => { for (const i of srcOf()) { const e = v.events[i]; if (e.rest) continue; e.step += dir; e.alt = implied(v, e.step, e.t); e.ed = false; } });
  },
  acc(a){
    const v = curVoice(); if (!v) return;
    commit(() => { for (const i of srcOf()) { const e = v.events[i]; if (e.rest) continue; const imp = implied(v, e.step, e.t) || 0; e.alt = (e.alt ?? imp) === a && a !== imp ? (imp || null) : a; e.ed = false; } });
  },
  value(g){
    const v = curVoice(); if (!v) return;
    const src = srcOf(); if (!src.length) return;
    const val = VALS.find(x => x[0] === g)[1];
    commit(() => {
      const e = v.events[src[0]];
      e.d = rt(val / propAt(v, e.t)); e.tieStart = e.tieEnd = e.tieMid = false; e.long = g === 'L' && e.long;
      dropEvents(v, src.slice(1));
    });
    ed.val = g; syncEdit();
  },
  dot(){
    const v = curVoice(), s = selSym(); if (!v || !s) return;
    const src = srcOf();
    commit(() => {
      const e = v.events[src[0]];
      const total = src.reduce((a, i) => a + v.events[i].d, 0);
      e.d = rt(s.dot ? total / 1.5 : total * 1.5); e.tieStart = e.tieEnd = e.tieMid = false;
      dropEvents(v, src.slice(1));
    });
  },
  rest(){
    const v = curVoice(); if (!v) return;
    const src = srcOf();
    commit(() => {
      for (const i of src) {
        const e = v.events[i];
        if (e.rest) {
          let j = i - 1; while (j >= 0 && v.events[j].rest) j--;
          e.rest = false; e.step = j >= 0 ? v.events[j].step : CLEFS[v.clef || 'c3'].bottom + 4; e.alt = implied(v, e.step, e.t); e.ed = false;
        } else { e.rest = true; e.tieStart = e.tieEnd = e.tieMid = false; }
      }
    });
  },
  del(){
    const v = curVoice(); if (!v) return;
    const src = srcOf();
    /* a note becomes a rest of the same length so the other voices stay aligned; a rest is removed */
    if (src.some(i => !v.events[i].rest)) { commit(() => { for (const i of src) { const e = v.events[i]; e.rest = true; e.tieStart = e.tieEnd = e.tieMid = false; const nx = v.events[i + 1]; if (e.syl && e.syl.some(Boolean) && nx && !nx.rest && !(nx.syl || []).some(Boolean)) nx.syl = e.syl; e.syl = []; } }); return; }
    commit(() => dropEvents(v, src));
    if (ed.sel) ed.sel.ei = Math.max(0, Math.min(src[0], piece.voices[ed.sel.vi].events.length - 1));
    render();
  },
  insert(letter){
    const v = curVoice(); if (!v) return;
    const src = srcOf(), at = src.length ? src[src.length - 1] + 1 : v.events.length;
    let ref = null; for (let j = at - 1; j >= 0; j--) if (!v.events[j].rest) { ref = v.events[j].step; break; }
    if (ref === null) ref = CLEFS[v.clef || 'c3'].bottom + 4;
    const idx = LETTERS.indexOf(letter);
    let step = Math.round((ref - idx) / 7) * 7 + idx;
    const val = VALS.find(x => x[0] === ed.val)[1];
    const t = at < v.events.length ? v.events[at].t : v.end;
    commit(() => {
      const e = {d: rt(val / propAt(v, t)), rest: letter === 'r', step, alt: null, ed: false, syl: [], t};
      if (!e.rest) e.alt = implied(v, step, t);
      v.events.splice(at, 0, e);
      for (const arr of [v.mets, v.keys, v.clefs]) for (const m of arr) if (m.ei > at || (m.ei === at && at > 0)) m.ei++;

  },
  move(dir){
    if (!ed.sel) return;
    const v = curVoice(), s = selSym();
    const k = v.syms.indexOf(s) + dir;
    if (k >= 0 && k < v.syms.length) ed.sel = {vi: ed.sel.vi, ei: v.syms[k].src[0]};
    showSel(true);
  },
  xform(kind){
    const v = curVoice(); if (!v) return;
    commit(() => {
      for (const e of v.events) {
        if (kind === 'octup' || kind === 'octdn') { if (!e.rest) e.step += kind === 'octup' ? 7 : -7; }
        else if (kind === 'tonup' || kind === 'tondn') { if (!e.rest) { e.step += kind === 'tonup' ? 1 : -1; e.alt = implied(v, e.step, e.t); e.ed = false; } }
        else if (kind === 'dbl') e.d = rt(e.d * 2);
        else if (kind === 'hlv') e.d = rt(e.d / 2);
      }
    });
  }
};
function dropEvents(v, list){
  const sorted = list.slice().sort((a, b) => b - a);
  for (const i of sorted) {
    const e = v.events[i];
    /* keep the syllable on the next note */
    if (e.syl && e.syl.some(Boolean) && v.events[i + 1] && !(v.events[i + 1].syl || []).some(Boolean)) v.events[i + 1].syl = e.syl;
    v.events.splice(i, 1);

}
function undo(){ if (!ed.undo.length) return; ed.redo.push(piece.text || writeKern(piece)); applyText(ed.undo.pop()); }
function redo(){ if (!ed.redo.length) return; ed.undo.push(piece.text || writeKern(piece)); applyText(ed.redo.pop()); }
function showSel(scroll){
  document.querySelectorAll('#pages g.sel').forEach(g => g.classList.remove('sel'));
  const s = selSym();
  if (!s) { syncEdit(); return; }
  let first = null;
  piece.voices[ed.sel.vi].syms.filter(q => q.src && q.src[0] === s.src[0]).forEach(q => document.querySelectorAll('#pages g.' + q.id).forEach(g => { g.classList.add('sel'); first = first || g; }));

  syncEdit();
}
/* clicking a note selects it (in any view); with Edit off it only marks where Play starts */
pagesEl.addEventListener('click', e => {

let handEl = null, handAngle = -1, pendEl = null, pendAngle = 99;
function setHand(deg){
  if (!handEl) return;
  const a = Math.round(deg * 10) / 10;
  if (a === handAngle) return;
  handAngle = a;
  handEl.setAttribute('transform', `rotate(${-a * 0.51} -170 118)`);
}
function setPend(deg){
  if (!pendEl) pendEl = document.getElementById('pendRot');
  if (!pendEl) return;
  const a = Math.round(deg * 10) / 10;
  if (a === pendAngle) return;
  pendAngle = a;
  pendEl.setAttribute('transform', `rotate(${a} 98 150)`);
}
function syncBeat(){
  const on = {hand: st.beatHand, pendulum: st.beatPend, tick: st.beatTick};
  document.querySelectorAll('#beatList button').forEach(b => b.setAttribute('aria-pressed', String(!!on[b.dataset.beat])));
  $('#handBox').hidden = !st.beatHand; $('#pendBox').hidden = !st.beatPend;
  $('#pendBox').classList.toggle('both', st.beatHand && st.beatPend);
  const r = document.documentElement.style;
  r.setProperty('--hand-op', String(st.handOp)); r.setProperty('--hand-sc', String(st.handSize));
  $('#handOp').value = st.handOp; $('#handSize').value = st.handSize;
}
handEl = $('#handRot'); handEl.innerHTML = HAND_SVG; setHand(0); setPend(0);
$('#beatList').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const k = b.dataset.beat;
  if (k === 'hand') st.beatHand = !st.beatHand; else if (k === 'pendulum') st.beatPend = !st.beatPend; else st.beatTick = !st.beatTick;
  save(); syncBeat(); if (k === 'tick') restartPlay();
});
$('#handOp').addEventListener('input', e => { st.handOp = +e.target.value; save(); syncBeat(); });
$('#handSize').addEventListener('input', e => { st.handSize = +e.target.value; save(); syncBeat(); });
syncBeat();
function metroClick(t, dest){
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(1500, t);
  o.frequency.exponentialRampToValueAtTime(820, t + 0.035);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.55, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0005, t + 0.07);
  o.connect(g); g.connect(dest);
  o.start(t); o.stop(t + 0.08);
  return o;
}

/* the music box fills the window (or the visitor's window, when embedded), with the controls above and below it */
function sizeViewer(){
  let H = window.innerHeight;
  if (EMBED) { try { H = window.top.innerHeight; } catch (e) { H = Math.max(window.screen.availHeight - 160, 600); } }
  const used = ($('.tools').offsetHeight || 60) + ($('.transport').offsetHeight || 70) + (EMBED ? 40 : 120);
  document.documentElement.style.setProperty('--vh', Math.max(380, H - used) + 'px');
}

/* ------------------------------------------------------------------ */
/* Playback: a small organ, every shown voice                          */
/* ------------------------------------------------------------------ */
const SEMI = [0, 2, 4, 5, 7, 9, 11];
let actx = null, wave = null, play = null;
const volGain = () => 0.9 * Math.pow((st.vol ?? 70) / 100, 2) / Math.sqrt(Math.max(1, visibleVoices().length));
function midiOf(s){
  const oct = Math.floor(s.step / 7), idx = ((s.step % 7) + 7) % 7;
  return 12 * (oct + 1) + SEMI[idx] + (s.alt || 0);
}
function setPlayIcon(on){
  $('#playIcon').setAttribute('d', on ? 'M2 1.5h3.6v11H2Zm6.4 0H12v11H8.4Z' : 'M2 1 13 7 2 13Z');
  $('#play').setAttribute('aria-label', on ? 'Stop' : 'Play'); $('#play').title = on ? 'Stop (space bar)' : 'Play (space bar)';
}
function stopPlay(){
  if (!play) return;
  play.nodes.forEach(n => { try { n.stop(); } catch (e) {} });
  play.master.gain.setTargetAtTime(0, actx.currentTime, 0.03);
  cancelAnimationFrame(play.raf);
  document.querySelectorAll('svg g.on').forEach(g => g.classList.remove('on'));
  play = null; setPlayIcon(false); setHand(0); setPend(0);
}
/* where the music stands while it plays, in semibreves */
const playPos = () => play ? Math.max(0, (actx.currentTime - play.t0) / play.spb) : 0;
function restartPlay(){ if (!play) return; const at = playPos(); stopPlay(); startPlay(at); }
function startPlay(from){
  if (!piece) return;
  /* Play starts at the selected note (or the beginning) */
  if (typeof from !== 'number') { const s = selSym(); from = s ? s.t : 0; }
  from = Math.max(0, Math.min(from, piece.end));
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  if (!wave) {
    const n = 9, re = new Float32Array(n), im = new Float32Array(n);
    [0, 1, 0.55, 0.32, 0.22, 0.12, 0.08, 0.05, 0.03].forEach((a, i) => { im[i] = a; });
    wave = actx.createPeriodicWave(re, im);
  }
  const voices = visibleVoices();
  const spb = 60 / Math.max(20, st.tempo || 90);       /* seconds per semibreve */
  const master = actx.createGain(); master.gain.value = volGain();
  master.connect(actx.destination);
  const start = actx.currentTime + 0.12, t0 = start - from * spb, nodes = [], events = [];
  voices.forEach(v => {
    const pan = actx.createStereoPanner ? actx.createStereoPanner() : null;
    const out = pan || master;
    if (pan) { pan.pan.value = voices.length > 1 ? -0.5 + v.idx / (piece.voices.length - 1 || 1) : 0; pan.connect(master); }
    for (let k = 0; k < v.syms.length; k++) {
      const s = v.syms[k];
      if (s.rest) continue;
      /* tied pieces sound as one note */
      let d = s.d, j = k;
      while (v.syms[j].tieNext && v.syms[j + 1] && !v.syms[j + 1].rest && v.syms[j + 1].step === s.step) { j++; d += v.syms[j].d; }
      const a0 = t0 + s.t * spb, b = t0 + (s.t + d) * spb;
      if (b <= start + 0.02) { k = j; continue; }
      const a = Math.max(a0, start);
      const o = actx.createOscillator(), g = actx.createGain();
      o.setPeriodicWave(wave);
      o.frequency.value = 440 * Math.pow(2, (midiOf(s) - 69) / 12);
      g.gain.setValueAtTime(0, a);
      g.gain.linearRampToValueAtTime(0.32, a + 0.03);
      g.gain.setValueAtTime(0.32, Math.max(a + 0.03, b - 0.06));
      g.gain.linearRampToValueAtTime(0, b);
      o.connect(g); g.connect(out);
      o.start(a); o.stop(b + 0.05);
      nodes.push(o);
      for (let q = k; q <= j; q++) events.push({a: t0 + v.syms[q].t * spb, b: t0 + v.syms[q].end * spb, id: v.syms[q].id});
      k = j;
    }
  });
  const end = t0 + piece.end * spb;
  if (st.beatTick) for (let k = Math.ceil(from - EPS); t0 + k * spb < end - 0.02; k++) nodes.push(metroClick(t0 + k * spb, actx.destination));
  /* how many semibreves the hand counts per breve: three under a perfect sign */
  const top = voices[0];
  play = {nodes, master, raf: 0, t0, spb, top, from};
  setPlayIcon(true);
  let lastScroll = 0;
  const tick = () => {
    if (!play) return;
    const now = actx.currentTime;
    if (now > end + 0.2) { stopPlay(); if (st.loop) startPlay(0); return; }
    /* tactus: a quick drop on one beat, a quick lift on the next, held still in between (as in Cantus firmus) */
    {
      const el = Math.max(0, now - t0), bi = Math.floor(el / spb), tt = el - bi * spb;
      if (st.beatPend) setPend(now < start ? 24 : 24 * Math.cos(Math.PI * el / spb));
      const sign = metAt(top, bi), N = mensInfo(sign).T === 3 ? 3 : 2;
      let seg = 0; for (const m of top.mets) if (m.t <= bi + EPS) seg = m.t;
      const ph = ((bi - Math.round(seg)) % N + N) % N;
      const a1 = ph === 0 && bi > 0 ? 45 : 0, a2 = ph === N - 1 ? 45 : 0;
      const pr = Math.min(1, tt / Math.min(0.09, spb * 0.3)), e = 1 - Math.pow(1 - pr, 3);
      setHand(now < start ? 0 : a1 + (a2 - a1) * e);
    }
    const on = new Set();
    for (const e of events) if (e.a <= now && e.b > now) on.add(e.id);
    document.querySelectorAll('svg g.on').forEach(g => { if (!on.has(g.classList[0])) g.classList.remove('on'); });
    let first = null;
    on.forEach(id => document.querySelectorAll('svg g.' + id).forEach(g => { g.classList.add('on'); first = first || g; }));
    if (first) followHand(first);
    if (first && performance.now() - lastScroll > 900 && bringIntoView(first)) lastScroll = performance.now();
    play.raf = requestAnimationFrame(tick);
  };
  play.raf = requestAnimationFrame(tick);
}
$('#play').addEventListener('click', () => { if (play) stopPlay(); else startPlay(); });
/* the hand (and pendulum) stand beside the music that is sounding */
function followHand(el){
  const wr = $('.viewwrap').getBoundingClientRect(), r = el.getBoundingClientRect();
  const hb = $('#handBox').getBoundingClientRect().height || 200;
  const y = Math.max(10, Math.round(r.top - wr.top + r.height / 2 - hb * 0.45));
  if (Math.abs(y - handTop) < 24) return;
  handTop = y;
  $('#handBox').style.top = y + 'px'; $('#pendBox').style.top = y + 'px';
}

/* tell the site page how tall the app is */
let lastH = 0;
function postHeight(){
  if (!EMBED) return;
  requestAnimationFrame(() => {
    let h = document.documentElement.scrollHeight;
    const pop = document.querySelector('.pop.open .popbody');
    if (pop) h = Math.max(h, pop.getBoundingClientRect().bottom + window.scrollY + 20);
    if (h !== lastH) { lastH = h; parent.postMessage({choirbookHeight: h}, '*'); }
  });
}
let rw = 0, lastW = window.innerWidth;
window.addEventListener('resize', () => { if (window.innerWidth === lastW) return; lastW = window.innerWidth; clearTimeout(rw); rw = setTimeout(() => { sizeViewer(); render(); }, 150); });
if (EMBED) try { window.top.addEventListener('resize', () => { clearTimeout(rw); rw = setTimeout(() => { sizeViewer(); postHeight(); }, 150); }); } catch (e) {}

/* start */
(async () => {
  try { await document.fonts.load('100px "IM Fell English"'); await document.fonts.load('italic 100px "IM Fell English"'); } catch (e) {}
  const qs = new URLSearchParams(location.search);
  const want = qs.get('piece');
  pieceKey = want || st.piece || PIECES[0];
  if (want && qs.get('bar')) {
    const from = parseInt(qs.get('bar'), 10), to = parseInt(qs.get('to') || qs.get('bar'), 10);
    if (from > 0) mark = {piece: want, from, to: Math.max(from, to || from)};
  }
  syncUI(); sizeViewer();
  try { await loadPiece(pieceKey); }
  catch (e) {
    if (!want && pieceKey !== PIECES[0]) { pieceKey = PIECES[0]; try { await loadPiece(pieceKey); } catch (e2) { pagesEl.innerHTML = `<p class="msg">${esc(e2.message)}</p>`; } }
    else pagesEl.innerHTML = `<p class="msg">${esc(e.message)}</p>`;
  }
  buildPieceList().then(syncUI);
  if (/[?&]print=1/.test(location.search)) setTimeout(() => window.print(), 600);
})();
window.__cb = {st, get piece(){ return piece; }, render, parseKern, notate, ed, writeKern};
})();
</script>
</body>
