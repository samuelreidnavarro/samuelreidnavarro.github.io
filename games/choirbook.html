<!--
  ChoirBook: a reader and editor for mensural polyphony (score, parts, choir book openings),
  on Humdrum **kern files such as those of the Josquin Research Project.
  The app itself is the Scriptorium engine (scriptorium/scriptorium.js and .css), shared with
  CantusFirmus and Canon Maker; this page only names the app and its repertoire.
  A few pieces live in games/choirbook/*.krn (pieces below); the full library
  (games/choirbook/catalogue.json) is loaded from the public repositories of the Josquin Research
  Project, the 1520s Project and music21 (Palestrina), as collected by ReDiX (Ugo Bindini).
  Note shapes, clefs and accidentals are outlines from the Bravura music font
  by Steinberg Media Technologies, used under the SIL Open Font License 1.1.
-->
