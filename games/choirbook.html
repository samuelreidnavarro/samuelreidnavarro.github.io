<!--
  ChoirBook: a reader and editor for mensural polyphony (score, parts, choir book openings),
  on Humdrum **kern files such as those of the Josquin Research Project.
  The app itself is the Scriptorium engine (scriptorium/scriptorium.js and .css), shared with
  CantusFirmus and Canon Maker; this page only names the app and its repertoire.
  No pieces are copied here any more; the library
  (games/choirbook/catalogue.json) is loaded from the public repositories of the Josquin Research
  Project, the 1520s Project and music21 (Palestrina), as collected by ReDiX (Ugo Bindini).
  Note shapes, clefs and accidentals are outlines from the Bravura music font
  by Steinberg Media Technologies, used under the SIL Open Font License 1.1.
-->
<link rel="stylesheet" href="scriptorium/scriptorium.css?v=123">
</head>
<body>
<script>
window.SCRIPTORIUM = {
  id: 'choirbook', name: 'ChoirBook', page: 'choirbook.html', store: 'choirbook', msg: 'choirbook', catalogue: true,
  first: 'Jos/Jos2306-Ave_Maria_..._virgo_serena',
  moved: {
    'Jos2306-Ave_Maria_virgo_serena.krn': 'Jos/Jos2306-Ave_Maria_..._virgo_serena',
    'Jos0403a-Missa_Pange_lingua-Kyrie.krn': 'Jos/Jos0403a-Missa_Pange_lingua-Kyrie',
    'Jos2918-Nymphes_des_bois.krn': 'Jos/Jos2918-Nymphes_des_bois__Requiem',
    'Duf2012-Ave_regina_celorum_III.krn': 'Duf/Duf2012-Ave_regina_celorum_III',
    'Duf3015-Se_la_face_ay_pale.krn': 'Duf/Duf3015-Se_la_face_ay_pale'
  }
};
/* an example shown inside another page (Samuel's Musical Lexicon) keeps its own storage, so it never touches the visitor's ChoirBook */
if (/[?&]example=1/.test(location.search)) { window.SCRIPTORIUM.store = 'choirbook-example'; window.SCRIPTORIUM.defaults = Object.assign({}, window.SCRIPTORIUM.defaults, {staff: 'black'});
  /* every example starts fresh: only the link's own settings count */
  try { Object.keys(localStorage).filter(k => k.startsWith(window.SCRIPTORIUM.store + ':')).forEach(k => localStorage.removeItem(k)); } catch (e) {} }
</script>
