<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChoirBook</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 27 16 16 29 5 16Z' fill='%2324479A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+Double+Pica:ital@0;1&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<!--
  ChoirBook: a reader for mensural polyphony (score, parts, choir book openings).
  Reads Humdrum **kern files such as those of the Josquin Research Project.
  Everything is in this one file; a few pieces live in games/choirbook/*.krn (see PIECES below),
  the full library (games/choirbook/catalogue.json) is loaded from the public repositories of the
  Josquin Research Project, the 1520s Project and music21 (Palestrina). The catalogue was made
  with the data of ReDiX by Ugo Bindini (https://github.com/ugobindini/redix).
  Note shapes, clefs and accidentals are outlines from the Bravura music font
  by Steinberg Media Technologies, used under the SIL Open Font License 1.1.
-->
<style>
:root{
  --ground:#FBF7EF; --surface:#F4EDE0; --text:#2A2218; --muted:#7D6F5B; --line:#D6C8B0;
  --accent:#8E2A1E; --accent-ink:#F7F2E6;
  --leaf:#F3E8CC; --leaf-ink:#2A2218; --leaf-muted:#7A6A4E; --rule:#8E2A1E;
  --sel:#8E2A1E; --hov:#B8624A; --play:#8E2A1E; --del:#8E2A1E;
  --paper:none; --pen:#8E2A1E;
  color-scheme: light;
}
*{box-sizing:border-box}
.embedded,.embedded body{overflow:hidden;height:auto}
.embedded #title{display:none}
.embedded header.top .lede, .embedded header.top h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.embedded header.top{justify-content:flex-end;margin-bottom:6px}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--text);
  font:400 19px/1.45 "IM Fell English","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
.wrap{max-width:none;margin:0 auto;padding:22px clamp(14px,2.6vw,44px) 40px}
header.top{display:flex;flex-wrap:wrap;gap:14px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-family:"IM Fell Double Pica","IM Fell English",Georgia,serif;font-weight:400;font-size:clamp(2.2rem,4.4vw,3.2rem);line-height:1.02;margin:0;letter-spacing:-.012em}
.lede{margin:.4rem 0 0;color:var(--muted);font-style:italic;max-width:62ch}
.share{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.libwrap{position:relative}
.libbtn{display:inline-flex;align-items:center;gap:8px;background:var(--text);color:var(--ground);border-color:var(--text)}
.libbtn .chev{width:12px;height:12px;fill:currentColor}
.library{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:min(760px,calc(100vw - 28px));max-height:min(78vh,760px);
  overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px 10px;
  box-shadow:0 18px 40px -16px rgba(0,0,0,.45)}
.library h2{font-family:"IM Fell Double Pica","IM Fell English",Georgia,serif;font-size:17px;font-weight:700;margin:12px 8px 2px}
.library .gnote{margin:0 8px 6px;color:var(--muted);font-style:italic;font-size:14.5px}
.libhint{margin:6px 8px 4px;color:var(--muted);font-style:italic;font-size:14.5px}
.libtools{display:flex;flex-wrap:wrap;gap:6px;margin:6px 4px 4px;position:sticky;top:-6px;background:var(--surface);padding:6px 0;z-index:1}
.libtools input,.libtools select{font:inherit;font-size:15px;color:var(--text);background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-height:34px}
.libtools input{flex:1 1 220px}
.libtools select{flex:0 1 auto;max-width:100%}
.library .pc{display:block;width:100%;text-align:left;height:auto;min-height:0;line-height:1.3;padding:7px 10px;margin:0 0 4px;border:1px solid transparent;background:transparent;border-radius:6px}
.library .pc:hover:not(:disabled){border-color:var(--line);background:var(--ground)}
.library .pc[aria-current=true]{border-color:var(--text)}
.library .pc .t{display:block;font-size:17px}
.library .pc .c{display:block;font-size:14px;color:var(--muted);font-style:italic}
.library .more{display:block;margin:8px auto 2px}
.srcnote{margin:8px 2px 0;color:var(--muted);font-style:italic;font-size:14px}
.srcnote a{color:inherit}
.markbar{display:flex;align-items:center;gap:10px;margin:8px 2px 0;font-size:15px}
.markbar[hidden]{display:none}
#pages g.mark use,#pages g.mark .ink{fill:#2F4F8F}
#pages g.mark .ledger{stroke:#2F4F8F}
.catitem{display:block;width:100%;text-align:left;padding:10px 10px 8px;margin:0 0 6px;border:1px solid var(--line);background:transparent;border-radius:6px;height:auto;min-height:0;line-height:1.3}
.catitem:hover:not(:disabled){border-color:var(--text);background:var(--ground)}
.catitem .cathead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.catitem .t{font-family:"IM Fell Double Pica","IM Fell English",Georgia,serif;font-size:19px;font-weight:700}
.catitem .cnt{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;white-space:nowrap}
.catitem .d{display:block;font-size:14px;color:var(--muted);font-style:italic;margin-top:1px}
.catitem .pv{display:block;margin-top:6px;height:46px;background:var(--leaf);border-radius:3px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.catitem .pv svg{display:block;height:46px;width:auto}
.catitem .pv .staff{stroke:var(--rule)}
.catitem .pv use{fill:var(--leaf-ink)}
.catitem .pv .ledger{stroke:var(--leaf-ink)}
.catitem .first{display:block;margin-top:4px;font-size:13.5px;color:var(--muted)}
.libnav{padding:2px 0 0}
.libback{height:34px;min-height:34px;padding:0 10px 0 6px;gap:4px;background:transparent;border-color:transparent;color:var(--text)}
.libback:hover{border-color:var(--line);background:var(--ground)}
.libback .chev{width:12px;height:12px}
.catitem .chev{width:11px;height:11px}
.cfitem{display:block;width:100%;text-align:left;padding:8px 10px 6px;border:1px solid transparent;background:transparent;border-radius:6px;min-height:0;line-height:1.3}
.cfitem:hover:not(:disabled){border-color:var(--line);background:var(--ground)}
.cfitem .t{display:block;font-size:16.5px}
.cfitem .d{display:block;font-size:14px;color:var(--muted);font-style:italic;margin-top:1px}
.cfitem .pv{display:block;margin-top:6px;height:46px;background:var(--leaf);border-radius:3px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.cfitem .pv svg{display:block;height:46px;width:auto}
.cfitem .pv .staff{stroke:var(--rule)}
.cfitem .pv use{fill:var(--leaf-ink)}
.cfitem .pv .ledger{stroke:var(--leaf-ink)}
.cfitem .t,.cfitem .d,.catitem .d,.catitem .first{white-space:normal}
.catitem .pv .punct,.cfitem .pv .punct,.catitem .pv .prest,.cfitem .pv .prest{fill:var(--leaf-ink)}
#dotBtn svg{width:20px;height:20px;fill:currentColor}

button{font:inherit;font-size:15.5px;color:var(--text);background:var(--surface);border:1px solid var(--line);
  border-radius:6px;min-height:40px;padding:0 14px;cursor:pointer;line-height:1}
button:hover:not(:disabled){border-color:var(--text)}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.42;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=number]{font:inherit;font-size:15.5px;color:var(--text);background:var(--surface);
  border:1px solid var(--line);border-radius:6px;min-height:38px;padding:0 8px}
input[type=number]{width:4.6em}
input[type=range]{accent-color:var(--accent);width:120px}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;margin:0}

.tools{background:var(--ground);padding:6px 0 12px;z-index:5}
@media (min-width:760px) and (min-height:620px){ .tools{position:sticky;top:0} }
.tools .row{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-start}
.grp{display:flex;flex-direction:column;gap:5px}
.gl{font-size:14px;color:var(--muted);font-style:italic;white-space:nowrap}
.btns{display:flex;gap:4px;flex-wrap:wrap}
.ib{width:44px;height:44px;padding:0;display:grid;place-items:center}
.ib svg{width:36px;height:36px;fill:currentColor;overflow:visible}
.ib.small svg{width:22px;height:22px}
.seg{display:flex}
.seg button{border-radius:0}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0;margin-left:-1px}
.tb{min-height:44px}
.pop{position:relative}
.popbtn{min-width:56px}
.popbtn .chev{width:11px;height:11px;fill:currentColor;margin-left:8px}
.popbody{display:none;position:absolute;left:-6px;top:calc(100% - 2px);z-index:15;padding:6px;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 28px -12px rgba(0,0,0,.4)}
.pop:hover .popbody,.pop:focus-within .popbody,.pop.open .popbody{display:block}
.popbody{width:max-content}
.popbody .btns:not(.col){flex-wrap:nowrap}
.popbody .col{flex-direction:column}
.popbody .col .tb{justify-content:flex-start;text-align:left;white-space:nowrap}
#advBtn .chev{transition:transform .15s}#advBtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.advt{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:8px 6px 4px;margin-top:2px;border-top:1px solid var(--line)}
.advt[hidden]{display:none}
.advt .seg{display:flex}.advt .seg button{flex:1;justify-content:center}
.advt select{min-height:40px}
.advt .ivrow{display:flex;gap:6px}.advt .ivrow select{flex:1 1 auto;min-width:0}.advt .ivrow select[hidden]{display:none}
.advt .check{display:flex;align-items:center;gap:8px;white-space:nowrap}
.popbody .col .advt #advGo{justify-content:center;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (max-width:700px){#popXform{position:static}#popXform .popbody{left:0;right:0;width:auto}.advt .check{white-space:normal}#popLook{position:static}#popLook .popbody{left:0;right:0;width:auto}.staffset{grid-template-columns:auto 1fr}.staffset input[type=range]{width:100%}}
.staffset{display:grid;grid-template-columns:auto 150px;gap:8px 12px;align-items:center;padding:4px 8px}
.staffset input[type=range]{width:150px}
.staffset .btns{display:flex;gap:2px}
.staffset .btns .tb{min-width:44px}
.tools .row .spacer{flex:1}
.tools .row .ctl{align-self:flex-start;margin-top:20px}
.tools .row #clear{align-self:flex-start;margin-top:15px}

.settings{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;margin:2px 0 12px}
label.ctl{display:flex;align-items:center;gap:8px;color:var(--muted)}
.settings .spacer{flex:1}

.leaf{position:relative;background:#EFE3C7 var(--paper);background-size:512px 512px;color:var(--leaf-ink);border-radius:3px;padding:16px 22px 18px;
  box-shadow:0 1px 1px rgba(60,40,10,.14),0 14px 32px -14px rgba(50,34,8,.42),inset 0 0 70px rgba(150,108,40,.13),inset 0 0 0 1px rgba(120,90,40,.16)}
#title{display:block;width:100%;font:italic 400 1.4rem/1.3 "IM Fell English","Palatino Linotype",Palatino,Georgia,serif;
  color:var(--leaf-ink);background:transparent;border:0;border-bottom:1px dashed transparent;padding:2px 0 4px;border-radius:0}
#title:hover{border-bottom-color:rgba(31,26,20,.25)}
#title:focus-visible{outline:none;border-bottom-color:var(--sel)}
#title::placeholder{color:rgba(31,26,20,.42)}
#score{margin-top:4px;cursor:crosshair;touch-action:manipulation;user-select:none;-webkit-user-select:none;border-radius:2px}
#score:focus-visible{outline:1.5px solid rgba(142,42,30,.4);outline-offset:6px}
#score svg{display:block;overflow:visible}
#score .staff{stroke:var(--rule)}
#score .ledger{stroke:var(--leaf-ink)}
#score use,#score .bar,#score .dot{fill:var(--leaf-ink)}
#score .punct,#score .prest{fill:var(--leaf-ink)}
#score .it.hov .punct,#score .it.hov .prest{fill:var(--hov)}
#score .it.sel .punct,#score .it.sel .prest{fill:var(--sel)}
#score .it.play .punct,#score .it.play .prest{fill:var(--play)}
#score use.clefhov{fill:var(--hov)}
#score .it.hov use{fill:var(--hov)}
#score .it.hov .ledger{stroke:var(--hov)}
#score .menshov{stroke:var(--hov)}
#score .it.dim{opacity:.28}
#score use.sigghost{opacity:.26}
#score use.sigghost.on{opacity:.85;fill:var(--hov)}
#score .it.sel use{fill:var(--sel)}
#score .it.sel .ledger{stroke:var(--sel)}
#score .it.play use{fill:var(--play)}
#score .it.play .ledger{stroke:var(--play)}
#score .selbg{fill:var(--sel);opacity:.1}
#score .ghost{opacity:.62}
#score .mic{opacity:.5;pointer-events:none}
#score .take use,#score .take .punct,#score .take .prest{fill:var(--pen)}
#score .take .ledger{stroke:var(--pen)}
#score .take .tie{fill:none;stroke:var(--pen);stroke-width:.12;stroke-linecap:round}
#score .mic .micdot,#score .mic use{fill:var(--pen)}
#score .mic .ledger{stroke:var(--pen)}
#mic svg{width:17px;height:17px;margin:0 4px -3px -2px;fill:currentColor}
.split{display:inline-flex;align-items:center}
.latrow{display:flex;align-items:center;gap:6px;padding:6px 6px 2px 10px;margin-top:4px;border-top:1px solid var(--line);color:var(--muted);font-size:16px}
.latrow input{width:4.2em;height:30px;min-height:30px;text-align:center}
.latrow #micClap{margin-left:auto}
#singOpts{padding:0 7px;min-width:0}
#singOpts .chev{margin-left:0}
#score .ghost use{fill:var(--sel)}
#score .ghost .ledger{stroke:var(--sel)}
#score .caret{fill:var(--sel);opacity:.75}
#score .hint{fill:var(--leaf-muted);font:italic 1.15px "IM Fell English","Palatino Linotype",Palatino,Georgia,serif}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.transport{display:flex;flex-wrap:wrap;align-items:flex-start;gap:18px 34px;margin-top:16px;padding-top:18px;border-top:1px solid var(--line)}
.tp-play{display:flex;gap:8px;align-items:center}
#play{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-width:110px;font-size:17px;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px}
#play svg{width:14px;height:14px;fill:currentColor}
.tactus{display:flex;flex-direction:column;gap:8px}
.vignette{width:176px;height:142px;background:var(--leaf);border:1.5px solid var(--leaf-ink);outline:1px solid var(--leaf-ink);
  outline-offset:-5px;overflow:hidden;border-radius:1px}
.handbox{position:absolute;right:0;top:4px;width:calc(250px * var(--hand-sc,1));height:calc(202px * var(--hand-sc,1));opacity:var(--hand-op,.3);pointer-events:none;z-index:0;transition:top .35s ease}
.handbox svg{display:block;width:100%;height:100%;transform:scaleX(-1)}
#title,#score{position:relative;z-index:1}
.tempo-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.eq{font-size:22px;color:var(--text);padding:0 2px}
.permin{color:var(--muted);margin-right:6px}
.unitpick{position:relative}
.unitbtn{width:58px;grid-template-columns:1fr 12px;gap:0;padding:0 4px 0 2px}
.unitbtn svg{width:34px;height:34px;fill:currentColor}
.unitbtn .chev{width:12px;height:12px;fill:currentColor}
#unitList{left:0;bottom:calc(100% + 6px);min-width:190px}
.menu{position:absolute;z-index:20;margin:0;padding:4px;list-style:none;color:var(--text);
  background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 28px -10px rgba(0,0,0,.35)}
.menu:focus{outline:none}
.menu li{display:flex;align-items:center;gap:10px;padding:3px 12px 3px 4px;border-radius:4px;cursor:pointer;font-size:16px}
.menu li svg{width:32px;height:32px;fill:currentColor;flex:none}
.menu li[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.menu li.active:not([aria-selected="true"]){outline:2px solid var(--accent);outline-offset:-2px}
.menu li:hover:not([aria-selected="true"]){background:color-mix(in srgb,var(--accent) 12%,transparent)}
#clefMenu{display:grid;grid-template-columns:repeat(5,64px);gap:2px;padding:6px}
#clefMenu[hidden]{display:none}
#clefMenu li{flex-direction:column;gap:0;padding:4px 2px 4px;font-size:14px;text-align:center;line-height:1.2}
#clefMenu li svg{width:40px;height:78px;overflow:visible}
#clefMenu li.flatopt{grid-column:span 5;flex-direction:row;justify-content:center;gap:8px;padding:4px 8px;border-top:1px solid var(--line);border-radius:0 0 4px 4px;margin-top:2px}
#clefMenu li.flatopt svg{width:40px;height:30px}
#clefMenu li.off{opacity:.3;pointer-events:none}
.stepper{display:flex}
.stepper button{min-width:38px;padding:0;font-size:20px;border-radius:0}
.stepper button:first-child{border-radius:6px 0 0 6px}
.stepper button:last-child{border-radius:0 6px 6px 0}
.stepper input{border-radius:0;border-left:0;border-right:0;width:3.6em;text-align:center;min-height:40px;font-size:17px;
  -moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#heart{color:var(--rule)}
#heart svg{width:22px;height:22px}
.tune{display:grid;grid-template-columns:auto 150px 3.4em;gap:4px 10px;align-items:center;margin-top:6px;padding-top:8px;border-top:1px solid var(--line);width:100%}
.tune .tg{grid-column:1/-1;font-style:italic;color:var(--muted);font-size:15px;margin-top:4px}
.tune label{color:var(--muted);font-size:16px}
.tune input[type=range]{width:150px}
.tune output{font-variant-numeric:tabular-nums;font-size:15px;color:var(--text);text-align:right}
.tp-side[hidden]{display:none}
.tp-side{display:flex;flex-direction:column;gap:8px;align-items:flex-start}

details.help{margin-top:26px;max-width:760px}
details.help summary{cursor:pointer;color:var(--text);font-size:17px}
.help p{color:var(--muted);margin:.6rem 0}
.help table{border-collapse:collapse;margin-top:8px;font-size:16px}
.help td{padding:5px 18px 5px 0;vertical-align:top}
.help td:first-child{white-space:nowrap}
kbd{font:inherit;font-size:14.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 6px;background:var(--surface)}
footer{margin-top:30px;color:var(--muted);font-size:14.5px}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--ground);
  padding:10px 16px;border-radius:6px;font-size:16px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){ #toast{transition:none} }
@media (max-width:640px){
  .wrap{padding:18px 14px 40px}
  .leaf{padding:12px 12px 14px}
  .ib{width:40px;height:40px}
  .ib svg{width:32px;height:32px}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ================= Layout v2: one control height, one rhythm ================= */
:root{--h:40px}
button,select,input[type=number]{height:var(--h);min-height:var(--h);font-size:16px}
button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;white-space:nowrap}
select{padding:0 10px}
.ib{width:var(--h);padding:0}
.ib svg{width:22px;height:22px;fill:currentColor}
.tb{min-height:var(--h)}
.cfitem{height:auto;min-height:0;display:block}
.chev{width:11px;height:11px;fill:currentColor;flex:none}
header.top{margin-bottom:10px}
.tools{padding:4px 0 10px;position:static}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 8px}
.bar .spacer,.transport .spacer{flex:1 1 16px}
.vsep{width:1px;height:24px;background:var(--line);margin:0 6px;flex:none}
.pop{position:relative}
.popbtn{min-width:0}
.popbtn svg:not(.chev){width:22px;height:22px;fill:currentColor}
#accBtns{display:flex;gap:4px}
#accBtns .ib svg{width:20px;height:22px}
label.ctl{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:16px}
.libbtn{gap:8px}
.leaf{margin-top:2px}
.transport{display:flex;flex-wrap:wrap;align-items:center;gap:10px 8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
#play{min-width:104px;font-size:16px}
#play svg{width:13px;height:13px}
.tempo-row{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.unitbtn{width:auto;padding:0 8px 0 4px;gap:2px}
.unitbtn svg{width:30px;height:30px}
.stepper button{min-width:var(--h);height:var(--h);padding:0;font-size:20px}
.stepper input{height:var(--h);min-height:var(--h);font-size:16px}
.tp-side{display:flex;flex-wrap:wrap;gap:18px 56px;align-items:flex-start;margin-top:12px;padding:14px 18px 16px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.tp-side[hidden]{display:none}
.tune{display:contents;border:0;margin:0;padding:0}
.tcol{display:grid;grid-template-columns:auto 150px 3.4em;gap:6px 12px;align-items:center;align-content:start}
.tcol .tg{grid-column:1/-1;font-style:italic;color:var(--muted);font-size:15px;margin:0 0 2px}
.tcol label{color:var(--muted);font-size:16px}
.tcol input[type=range]{width:150px}
.tcol output{font-variant-numeric:tabular-nums;font-size:15px;text-align:right}
.tcol .check{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:8px}
.tcol button{grid-column:1/-1;justify-self:start;margin-top:4px}
#reg{width:176px}
.grow{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.tp-side{flex-direction:row}
@media (max-width:700px){ .vsep{display:none} .bar .spacer,.transport .spacer{flex-basis:100%;height:0} }
/* ================= Design E: grouped pods, one red, parchment score ================= */
:root{--h:34px}
button,select,input[type=number]{height:var(--h);min-height:var(--h)}
button{background:transparent;border:0;border-radius:9px;padding:0 13px;font-size:17px}
button:hover:not(:disabled){background:rgba(255,255,255,.72);border-color:transparent}
button[aria-pressed="true"]:hover:not(:disabled){background:#6F2017;color:var(--accent-ink)}
.podg{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:11px;background:rgba(42,34,24,.075);flex-wrap:nowrap}
.podg .ib{width:var(--h);height:var(--h)}
.podg .ib svg{width:20px;height:22px}
.podg .unitbtn svg:not(.chev){width:26px;height:26px}
.podg #heart svg{width:20px;height:20px}
.bar{gap:10px 12px}
.grow{gap:12px}
.libbtn,.libbtn:hover:not(:disabled){color:var(--text)}
.libbtn{background:transparent}
.libwrap{display:inline-flex}
.podg select{background:transparent;border:0;border-radius:9px;padding:0 6px;color:var(--text)}
.podg select:hover{background:rgba(255,255,255,.72)}
.podg label.ctl{gap:2px;padding-left:10px}
.podg .stepper button,.podg .stepper button:first-child,.podg .stepper button:last-child{border-radius:9px;margin:0}
.podg .stepper input{background:transparent;border:0;border-radius:0;font-size:19px;width:3.2em;padding:0}
.podg .unitbtn{width:auto}
.tempo-row{flex-wrap:nowrap;gap:2px}
.tempo-row .eq{padding:0 2px;font-size:20px;color:var(--muted)}
#play{width:60px;height:60px;min-width:0;padding:0;border-radius:50%;background:var(--accent);color:var(--accent-ink)}
#play:hover:not(:disabled){background:var(--text);color:var(--accent-ink)}
#play span{display:none}
#play svg{width:22px;height:22px}
.transport{border-top:0;padding-top:0;margin-top:16px;gap:10px 12px;align-items:center}
.transport .popbody{top:auto;bottom:calc(100% - 2px)}
.handbox{color:#2A2218}
.handbox[hidden]{display:none}
.pendbox.both{right:calc(190px * var(--hand-sc,1))}
#reg{width:178px}
@media (max-width:700px){
  .podg{flex-wrap:wrap}
  .grow{display:contents;margin-left:0}
  .bar{position:relative}
  #libPod{order:-3}
  #clearPod{order:-2}
  #libPod .libwrap{position:static}
  #libPod .library{position:absolute;left:0;right:0;width:auto;max-height:60vh;top:50px;margin-top:0}
  #editPod{order:-1}
  #navPod{order:-1}
}
/* ================= Below the score: playback on the left; sound, appearance and full screen on the right ================= */
.transport{gap:10px 12px}
.tp-main,.tp-stack{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.tp-tools{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:nowrap}
.tp-tools .popbody{left:auto;right:-6px}
.podg label.vol{padding:0 8px 0 9px;gap:7px}
.vol svg{width:20px;height:20px;fill:currentColor;flex:none}
.vol input[type=range]{width:72px}
#fsBtn svg{width:20px;height:20px}
#fsBtn .fs-out,.isfs #fsBtn .fs-in{display:none}
.isfs #fsBtn .fs-out{display:inline}
#fsBtn[hidden]{display:none}
.staffset #darkBtn{grid-column:1/-1;justify-content:flex-start;margin-top:2px}
.staffset .ctl,#linesLabel{color:var(--muted);font-size:16px}
#linesLabel{padding-left:10px}
.tcol #reg{width:100%}
.tcol select{grid-column:2/-1;width:100%;max-width:none}
.tcol .hz{grid-column:2/-1;display:flex;align-items:center;gap:6px;color:var(--muted)}
.tcol .tg:not(:first-child){margin-top:8px}
.transport button:not(.ib):not(#play){padding:0 10px}
.transport #singOpts{padding:0 7px}
@media (max-width:700px){
  .transport .podg{flex-wrap:nowrap}
  .tp-main{flex-wrap:nowrap;width:100%;gap:10px}
  #play{width:54px;height:54px;flex:none}
  .tp-stack{flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
  .tp-tools{margin-left:0;width:100%;justify-content:space-between;position:relative}
  .transport button:not(.ib):not(#play){padding:0 9px;font-size:16px}
  .transport #singOpts{padding:0 5px}
  .tempo-row .eq{padding:0}
  .podg .stepper input{width:2.6em;font-size:18px}
  .tp-tools{flex-wrap:wrap;gap:8px}
  #podSound{flex:1 1 100%;min-width:0}
  .podg label.vol{flex:1 1 auto;min-width:0}
  .vol input[type=range]{flex:1 1 auto;width:auto;min-width:50px}
}
@media (max-width:389px){
  #play{width:48px;height:48px}
  .tp-main{gap:8px}
  .transport button:not(.ib):not(#play){padding:0 7px}
  .transport #singOpts{padding:0 4px}
}
@media (max-width:350px){ .tp-main{flex-wrap:wrap} }
.isfs.embedded,.isfs.embedded body{overflow:auto;height:auto}
.isfs.embedded{overflow-y:auto;height:100%}

/* ================= Focus: only the music, on the dark brown ground ================= */
html.focus{--ground:#15110D;background:#15110D}
html.focus body{background:#15110D}
html.focus .wrap>:not(.leaf){display:none}
html.focus .wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:56px clamp(14px,3vw,48px) 40px}
html.focus .leaf{box-shadow:0 1px 1px rgba(0,0,0,.6),0 24px 50px -18px rgba(0,0,0,.95),inset 0 0 70px rgba(150,108,40,.13),inset 0 0 0 1px rgba(120,90,40,.16)}
html.focus.embedded,html.focus.embedded body{overflow:auto}
.focusbar{display:none;position:fixed;top:12px;right:12px;z-index:40;gap:6px;opacity:.4;transition:opacity .2s}
html.focus .focusbar{display:flex}
.focusbar:hover,.focusbar:focus-within{opacity:1}
.focusbar button,.focusbar button:hover:not(:disabled){width:40px;height:40px;min-height:40px;padding:0;border-radius:50%;background:rgba(255,238,210,.12);color:#ECE2D0}
.focusbar button:hover:not(:disabled){background:rgba(255,238,210,.22)}
.focusbar svg{width:15px;height:15px;fill:currentColor}
#fExit svg{width:20px;height:20px}
#focusBtn[hidden]{display:none}
.hzctl{gap:4px!important;padding:0 2px 0 8px!important;white-space:nowrap}
.hzctl input[type=number]{width:3.4em;height:28px;min-height:28px;padding:0 3px;text-align:center;font-size:16px;background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:7px}
html.dark .hzctl input[type=number]{background:rgba(255,238,210,.06)}
@media (min-width:1000px) and (max-width:1439px){
  .transport,.tp-main,.tp-stack{gap:10px}
  .transport button:not(.ib):not(#play){padding:0 8px;font-size:16px}
  .vol input[type=range]{width:56px}
  .hzctl .eqs{display:none}
  .hzctl input[type=number]{width:3em}
  .tp-tools{gap:8px}
  .podg label.vol{padding:0 4px 0 7px;gap:5px}
  #play{width:54px;height:54px}
}

/* Count-in: a field beside the metronome; the beats counted down large over the score */
#podCount{height:calc(var(--h) + 6px);box-sizing:border-box}
.podg label.cntin{gap:7px;padding:0 3px 0 9px;white-space:nowrap;color:var(--muted)}
.cntin input[type=number]{width:2.3em;height:28px;min-height:28px;padding:0 2px;text-align:center;font-size:16px;background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:7px;-moz-appearance:textfield}
.cntin input::-webkit-inner-spin-button,.cntin input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
html.dark .cntin input[type=number]{background:rgba(255,238,210,.06)}
#countBox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:3;font-size:clamp(90px,16vw,180px);line-height:1;color:var(--accent);font-variant-numeric:lining-nums}
#countBox[hidden]{display:none}
#countBox span{animation:cntpop .5s ease-out both}
@keyframes cntpop{from{transform:scale(1.25);opacity:0}25%{opacity:.85}to{transform:scale(1);opacity:.55}}
@media (prefers-reduced-motion: reduce){ #countBox span{animation:none;opacity:.6} }
@media (max-width:700px){ #podCount{order:3} }
@media (min-width:701px) and (max-width:999px){ .tp-main{flex-wrap:nowrap} .tp-stack{min-width:0} }
@media (min-width:1000px) and (max-width:1439px){ .podg label.cntin{font-size:15px;gap:5px;padding:0 2px 0 7px} .cntin input[type=number]{width:2.1em}
  .transport,.tp-main,.tp-stack{gap:8px} .vol input[type=range]{width:44px} }

/* ================= Dark mode: the room goes dark, the parchment stays as it is ================= */
html.dark{--ground:#15110D;--surface:#211B15;--text:#ECE2D0;--muted:#A5957B;--line:#3A3027;--accent:#A53627;--accent-ink:#FBF4E8;color-scheme:dark}
html.dark .podg{background:rgba(255,238,210,.075)}
html.dark button:hover:not(:disabled),html.dark .podg select:hover{background:rgba(255,238,210,.12)}
html.dark button[aria-pressed="true"]:hover:not(:disabled){background:#86281C}
html.dark #play:hover:not(:disabled){background:var(--text);color:var(--ground)}
html.dark :focus-visible{outline-color:#D9826F}
html.dark .leaf{box-shadow:0 1px 1px rgba(0,0,0,.6),0 24px 50px -18px rgba(0,0,0,.95),inset 0 0 70px rgba(150,108,40,.13),inset 0 0 0 1px rgba(120,90,40,.16)}
html.dark .popbody,html.dark .menu,html.dark .library{box-shadow:0 14px 34px -10px rgba(0,0,0,.85)}
/* ================= ChoirBook ================= */
.embedded header.top{display:none}
.embedded .wrap{padding-top:4px}
[hidden]{display:none !important}
.viewer{position:relative;padding:18px 0 34px}
/* pages below each other: an invisible frame, as wide as a page and as tall as the window, that scrolls through
   the pages when the pointer is on the music; beside it, the website scrolls (to the controls below) */
@media (min-width:701px){
  .viewer.frame{height:var(--vh,calc(100vh - 220px));min-height:360px;overflow-y:auto;overflow-x:hidden;margin:0 auto;padding:14px 0 26px;scrollbar-width:none}
  .viewer.frame::-webkit-scrollbar{display:none}
}
/* pages side by side: the row scrolls sideways, the page itself still scrolls up and down */
.viewer.horiz{overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:thin;padding:22px 64px 34px}
.viewer.horiz #pages{flex-direction:row;align-items:flex-start;width:max-content;gap:34px}
.viewer.horiz #pages>.page,.viewer.horiz #pages>.opening{scroll-snap-align:center}
.pagenav{position:absolute;top:50%;z-index:4;width:46px;height:46px;min-height:0;padding:0;border-radius:50%;transform:translateY(-50%);
  background:rgba(42,34,24,.62);color:#FBF4E8;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
.pagenav:hover:not(:disabled){background:var(--accent);color:var(--accent-ink)}
.pagenav:disabled{opacity:0;pointer-events:none}
.pagenav svg{width:20px;height:20px;fill:currentColor}
.pagenav.prev{left:8px}.pagenav.next{right:8px}
.viewwrap:not(.horiz) .pagenav{display:none}
@media (max-width:700px){ .viewer.horiz{padding:14px 26px 30px} .pagenav{width:38px;height:38px} .pagenav.prev{left:2px} .pagenav.next{right:2px} }
/* paper colours other than parchment: flat, without the parchment's browned edges */
html.flatpaper .page{background-image:none;box-shadow:0 1px 1px rgba(0,0,0,.12),0 14px 32px -14px rgba(0,0,0,.35)}
html.flatpaper .opening .page + .page{box-shadow:inset 16px 0 20px -18px rgba(0,0,0,.22),0 1px 1px rgba(0,0,0,.12),0 14px 32px -14px rgba(0,0,0,.35)}
.swatch.pick{position:relative;overflow:hidden;cursor:pointer}
.swatch.pick i{background:conic-gradient(#c0392b,#d4a017,#5a8f3a,#2f6f9f,#7a4f9a,#c0392b)}
.swatch.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.swatch.pick[aria-pressed="true"] i{background:var(--c)}
#pages{display:flex;flex-direction:column;align-items:center;gap:30px}
.opening{display:flex;justify-content:center;max-width:100%}
.opening.stack{flex-direction:column;align-items:center;gap:30px}
.opening.stack .page{border-radius:3px}
.opening .page:first-child{border-radius:3px 0 0 3px}
.opening .page:last-child{border-radius:0 3px 3px 0}
.opening .page + .page{box-shadow:inset 18px 0 22px -18px rgba(70,46,10,.35),0 1px 1px rgba(60,40,10,.14),0 14px 32px -14px rgba(50,34,8,.42)}
.page{position:relative;background:var(--pagebg,#EFE3C7) var(--paper);background-size:512px 512px;color:var(--leaf-ink);border-radius:3px;flex:none;
  box-shadow:0 1px 1px rgba(60,40,10,.14),0 14px 32px -14px rgba(50,34,8,.42),inset 0 0 70px rgba(150,108,40,.13),inset 0 0 0 1px rgba(120,90,40,.16)}
.page svg{display:block;width:100%;height:100%}
.pnum{position:absolute;bottom:-23px;left:0;right:0;text-align:center;font-size:13px;color:var(--muted)}
#pages svg .staff{stroke:var(--staff,#8E2A1E)}
#pages svg .ledger,#pages svg .barl,#pages svg .tie,#pages svg .ms{stroke:var(--leaf-ink)}
#pages svg use,#pages svg .ink{fill:var(--leaf-ink)}
#pages svg text.foot{opacity:.8}
#pages svg text{fill:var(--leaf-ink);font-family:"IM Fell English","Palatino Linotype",Palatino,Georgia,serif}
#pages svg .title{font-family:"IM Fell Double Pica","IM Fell English",Georgia,serif}
#pages svg g.on use,#pages svg g.on .ink{fill:var(--accent)}
#pages svg g.on .ledger{stroke:var(--accent)}
.msg{color:var(--muted);font-style:italic;padding:30px 0}
.editbar{margin-top:10px}
.editbar .ib svg{width:20px;height:22px;fill:currentColor}
#valBtns .ib svg,#accBtns .ib svg,#restBtn svg{width:24px;height:24px}
.selinfo{color:var(--muted);font-style:italic;font-size:16px}
#pages g.sel use,#pages g.sel .ink{fill:var(--accent)}
#pages g.sel .ledger{stroke:var(--accent)}
#pages .caret{fill:var(--accent);opacity:.75;pointer-events:none}
#pages g[class^="n"]{cursor:pointer}
#pages .hit{fill:transparent}
/* the sounding (and the selected) note: a faint box over the height of the staff, as a selection in CantusFirmus */
#pages .selbg{fill:transparent;pointer-events:none}
#pages svg g.on .selbg,#pages g.sel .selbg{fill:var(--sel);opacity:.1}
.viewwrap{position:relative}
/* full screen */
.fsbtn{position:absolute;top:4px;left:6px;z-index:5;width:32px;height:32px;min-height:0;padding:0;border-radius:6px;display:flex;align-items:center;justify-content:center;
  background:rgba(42,34,24,.45);color:#FBF4E8;border:0;transition:opacity .4s}
.fsbtn:hover{background:var(--accent);color:var(--accent-ink)}
.fsbtn svg{width:18px;height:18px;fill:currentColor}
.fsctl{display:none}
.viewwrap.fs{position:fixed;inset:0;z-index:1000;background:var(--ground);overflow:hidden}
.viewwrap.fs .viewer{width:auto !important;height:100% !important;max-width:none;margin:0;padding:24px 0 90px;overflow:auto;scrollbar-width:none}
.viewwrap.fs .viewer::-webkit-scrollbar{display:none}
.viewwrap.fs .viewer.horiz{padding:24px 64px}
.viewwrap.fs .fsbtn{left:12px !important;top:12px}
.viewwrap.fs .fsctl{display:flex;position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:6;gap:10px;transition:opacity .4s}
.fsctl button{width:58px;height:58px;min-height:0;padding:0;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;
  background:rgba(42,34,24,.62);color:#FBF4E8;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
.fsctl button:hover{background:var(--accent);color:var(--accent-ink)}
.fsctl svg{width:22px;height:22px;fill:currentColor}
.viewwrap.fs.idle .fsbtn,.viewwrap.fs.idle .fsctl{opacity:0;pointer-events:none}
.viewwrap.fs.idle{cursor:none}
.viewwrap .handbox{top:10px;right:22px;z-index:3}
.viewwrap .pendbox.both{right:calc(22px + 190px * var(--hand-sc,1))}
.drop .viewer{outline:2px dashed var(--accent);outline-offset:4px}
.popbody .btns.col .tb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.voices{border-collapse:collapse;margin:2px 4px}
.voices input.vname{font:inherit;font-size:16px;width:9em;padding:3px 6px;min-height:30px;height:30px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--text)}
.voices input.vname:hover,.voices input.vname:focus{border-color:var(--line);background:var(--ground)}
.voices select.vclef{font:inherit;font-size:15px;min-height:30px;height:30px;padding:0 4px;border:1px solid var(--line);border-radius:6px;background:var(--ground);color:var(--text)}
.voices .vbtn{height:30px;min-height:30px;padding:0 8px;font-size:15px}
.voices .vdel{width:30px;padding:0;color:var(--muted)}
.voices tfoot td{padding-top:8px;text-align:left}
.voices tfoot button{height:32px;min-height:32px;padding:0 10px;font-size:15px}
#popVoices .popbody{max-width:calc(100vw - 28px);overflow-x:auto}
.voices .drag{display:inline-block;cursor:grab;color:var(--muted);padding:2px 6px;touch-action:none;user-select:none;-webkit-user-select:none;font-size:18px;line-height:1}
.voices .drag:active{cursor:grabbing}
.voices tr.dragging{opacity:.45}
.voices tr.dropbefore td{box-shadow:inset 0 2px 0 var(--accent)}
.voices tr.dropafter td{box-shadow:inset 0 -2px 0 var(--accent)}
.voices .vexp{width:30px;padding:0;color:var(--muted)}
.voices .vexp svg{width:17px;height:17px;fill:currentColor}
.voices .vexp:hover{color:var(--text)}
#popExport .popbody{left:auto;right:-6px}
/* the clef on the staff opens a menu of clefs */
#pages .clefhit{cursor:pointer}
#pages .clefhit:hover use{fill:var(--hov)}
#clefPick{position:absolute;z-index:25;min-width:220px}
#clefPick[hidden]{display:none}
#clefPick li{padding:6px 12px}
/* writing with the mouse: the note that a click would write */
#pages .ghost{opacity:.55;pointer-events:none}
#pages .ghost use{fill:var(--accent)}
#pages .ghost .ledger{stroke:var(--accent)}
body.editing #pages .stafhit{cursor:crosshair}
.pagemeta{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.pagemeta input{font:inherit;font-size:16px;min-height:32px;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--ground);color:var(--text)}
.library .mine,.library .lrow{display:flex;gap:6px;align-items:center}
.library .lrow .pc{flex:1}
.library .fav{flex:none;width:32px;height:32px;min-height:32px;padding:0;border:0;background:transparent;color:var(--muted);display:inline-grid;place-items:center}
.library .fav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.library .fav:hover{color:var(--text)}
.library .fav[aria-pressed="true"]{color:var(--accent)}
.library .fav[aria-pressed="true"] svg{fill:currentColor}
@media (hover:hover){ .library .lrow .fav[aria-pressed="false"]{opacity:0} .library .lrow:hover .fav,.library .lrow .fav:focus-visible{opacity:1} }
.library .mine .pc{flex:1}
.library .mine .mdel{flex:none;width:32px;height:32px;min-height:32px;padding:0;color:var(--muted)}
.voices th{font-weight:400;font-style:italic;color:var(--muted);font-size:14.5px;padding:0 8px 6px;text-align:center}
.voices td{padding:5px 8px;text-align:center;font-size:17px}
.voices td:first-child{text-align:left;white-space:nowrap;padding-left:4px}
#popVoices .popbody{max-width:calc(100vw - 24px);overflow-x:auto}
@media (max-width:560px){
  .voices th{padding:0 3px 6px;font-size:13px}
  .voices td{padding:4px 3px}
  .voices input.vname{width:6.5em}
  .voices .drag{padding:2px 2px}
}
.staffset .btns .tb{min-width:0;padding:0 11px}
#popLook .staffset,#popPage .staffset{grid-template-columns:auto minmax(150px,auto)}
.staffset .lab{color:var(--muted);font-size:16px}
.swatches{display:flex;gap:6px}
.swatch{width:var(--h);height:var(--h);min-width:0;padding:0;border-radius:50%;display:grid;place-items:center}
.swatch i{display:block;width:20px;height:20px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatch[aria-pressed="true"]{background:transparent !important;box-shadow:inset 0 0 0 2px var(--accent)}
.unitglyph{width:26px;height:26px;fill:currentColor;flex:none;margin:0 2px 0 8px}
.library .pc{display:block;width:100%;text-align:left;height:auto;min-height:0;padding:9px 10px 8px;margin:0 0 4px;line-height:1.3;border-radius:6px}
.library .pc .t{display:block;font-family:"IM Fell Double Pica","IM Fell English",Georgia,serif;font-size:19px}
.library .pc .c{display:block;font-size:14.5px;color:var(--muted);font-style:italic}
.library .pc[aria-current="true"]{box-shadow:inset 0 0 0 1px var(--accent)}
@media (max-width:700px){
  .viewer{padding:14px 8px 30px}
  #popView,#popVoices,#popPage{position:static}
  #popView .popbody,#popVoices .popbody,#popPage .popbody{left:0;right:0;width:auto}
}
@media print{
  html,body{background:#fff !important;overflow:visible !important;height:auto !important}
  .wrap{padding:0 !important}
  header.top,.tools,.transport,.pnum,.msg,.handbox,.pendbox,.fsbtn,.fsctl,#countBox,.pagenav,#toast,#clefPick,.markbar,.srcnote{display:none !important}
  .viewer{height:auto !important;width:auto !important;overflow:visible !important;padding:0 !important;background:none !important;box-shadow:none !important}
  #pages{display:block !important;gap:0;width:auto !important}
  .opening{display:block}
  .page{background:#fff !important;box-shadow:none !important;border-radius:0 !important;break-after:page;page-break-after:always;margin:0}
  .page:last-child{break-after:auto}
}
</style>
<style id="pagerule">@page{size:A4 portrait;margin:0}</style>
</head>
<body>
<main class="wrap">
  <header class="top"><h1>ChoirBook</h1></header>

  <section class="tools" aria-label="View">
    <div class="bar">
      <div class="podg" id="editPod"><button class="ib" id="editBtn" aria-pressed="false" aria-label="Edit" title="Edit: change, add and remove notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 17.3 14.8 6l3.2 3.2L6.7 20.5 3 21Zm13.7-12.6 1.4-1.4a1.5 1.5 0 0 1 2.1 0l1.1 1.1a1.5 1.5 0 0 1 0 2.1l-1.4 1.4Z"/></svg></button></div>
      <div class="podg"><div class="pop" id="popView">
        <button class="tb popbtn" id="viewBtn" aria-haspopup="true" aria-expanded="false"><span id="viewName">Score</span><svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.2 6 8.4 10 4.2 8.9 3.1 6 6.1 3.1 3.1Z"/></svg></button>
        <div class="popbody"><div class="btns col" id="viewList" role="group" aria-label="View">
          <button class="tb" data-v="score">Score</button><button class="tb" data-v="parts">Parts</button><button class="tb" data-v="choir">Choirbook</button>
        </div></div>
      </div></div>
      <div class="podg"><div class="pop" id="popVoices">
        <button class="tb popbtn" aria-haspopup="true" aria-expanded="false">Voices<svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.2 6 8.4 10 4.2 8.9 3.1 6 6.1 3.1 3.1Z"/></svg></button>
        <div class="popbody"><table class="voices" id="voiceTable"></table></div>
      </div></div>
      <div class="podg"><div class="pop" id="popPage">
        <button class="tb popbtn" aria-haspopup="true" aria-expanded="false">Page<svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.2 6 8.4 10 4.2 8.9 3.1 6 6.1 3.1 3.1Z"/></svg></button>
        <div class="popbody"><div class="staffset">
          <span class="lab">Size</span><div class="btns" id="paperSeg" role="group" aria-label="Paper size"><button class="tb" data-v="A3">A3</button><button class="tb" data-v="A4">A4</button><button class="tb" data-v="A5">A5</button><button class="tb" data-v="web">Web</button></div>
          <span class="lab">Orientation</span><div class="btns" id="orientSeg" role="group" aria-label="Orientation"><button class="tb" data-v="portrait">Portrait</button><button class="tb" data-v="landscape">Landscape</button></div>
          <div class="pagemeta"><label class="lab" for="metaTitle">Title</label><input id="metaTitle" type="text" autocomplete="off"><label class="lab" for="metaComp">Composer</label><input id="metaComp" type="text" autocomplete="off"></div>
          <span class="lab">Pages</span><div class="btns" id="flowSeg" role="group" aria-label="Pages"><button class="tb" data-v="vertical">Vertical</button><button class="tb" data-v="horizontal">Horizontal</button></div>
        </div></div>
      </div></div>
      <div class="grow">
        <div class="podg"><div class="libwrap">
          <button id="libBtn" class="libbtn" aria-haspopup="true" aria-expanded="false" aria-controls="library">Pieces<svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.2 6 8.4 10 4.2 8.9 3.1 6 6.1 3.1 3.1Z"/></svg></button>
          <div id="library" class="library" role="dialog" aria-label="Pieces" hidden></div>
        </div></div>
        <div class="podg">
          <button id="newBtn" title="A new, empty score to write polyphony in">New score</button>
          <button id="openBtn">Open file</button>
          <div class="pop" id="popExport">
            <button class="tb popbtn" aria-haspopup="true" aria-expanded="false">Export<svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.2 6 8.4 10 4.2 8.9 3.1 6 6.1 3.1 3.1Z"/></svg></button>
            <div class="popbody"><div class="btns col" id="exportList">
              <button class="tb" id="printBtn">Print</button>
              <button class="tb" id="saveBtn" title="Save this piece, with your changes, as a .krn file">Download .krn</button>
              <button class="tb" id="keepBtn" title="Keep a copy of this piece, with your changes, in My scores">Save to My scores</button>
            </div></div>
          </div>
        </div>
      </div>
      <input type="file" id="fileIn" accept=".krn,.kern,.txt,.musicxml,.xml,.mxl,.mscz,.mscx,.mid,.midi,.ly" hidden>
    </div>
    <div class="bar editbar" id="editBar" hidden></div>
  </section>

  <div class="markbar" id="markBar" hidden><span id="markTxt"></span><button id="markClear">Clear marking</button></div>
  <div class="viewwrap">
    <section class="viewer" id="viewer" aria-label="Music"><div id="pages"></div></section>
    <button class="fsbtn" id="fsBtn" aria-label="Full screen" title="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="fsIcon" d="M3 3h7v2.4H5.4V10H3Zm11 0h7v7h-2.4V5.4H14ZM3 14h2.4v4.6H10V21H3Zm15.6 0H21v7h-7v-2.4h4.6Z"/></svg></button>
    <div class="fsctl" id="fsCtl"><button id="fsPlay" aria-label="Play" title="Play"><svg viewBox="0 0 14 14" aria-hidden="true"><path id="fsPlayIcon" d="M3 1.5 12.5 7 3 12.5Z"/></svg></button></div>
    <button class="pagenav prev" id="pgPrev" aria-label="Previous page" title="Previous page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 4.6 8 12l7.4 7.4 1.6-1.6L11.2 12 17 6.2Z"/></svg></button>
    <div id="countBox" aria-live="off" hidden></div>
    <ul id="clefPick" class="menu" role="menu" aria-label="Clef" hidden></ul>
    <button class="pagenav next" id="pgNext" aria-label="Next page" title="Next page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 4.6 16 12l-7.4 7.4L7 17.8 12.8 12 7 6.2Z"/></svg></button>

  </div>

  <p class="srcnote" id="srcNote"></p>
  <section class="transport" aria-label="Playback and sound">
    <div class="tp-main">
    <button id="play" aria-label="Play" title="Play (space bar)"><svg viewBox="0 0 14 14" aria-hidden="true"><path id="playIcon" d="M2 1 13 7 2 13Z"/></svg><span>Play</span></button>
    <div class="tp-stack">
    <div class="podg" id="podModes">
    <button id="loop" aria-pressed="false" title="Repeat until stopped; adds a repeat sign at the end">Loop</button>
    <div class="pop" id="popMetro">
      <button class="tb popbtn" id="metro" aria-haspopup="true" title="How the beat is shown or heard">Metronome<svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.2 6 8.4 10 4.2 8.9 3.1 6 6.1 3.1 3.1Z"/></svg></button>
      <div class="popbody"><div class="btns col" id="beatList" role="group" aria-label="Beat">
        <button class="tb" data-beat="hand" data-keep aria-pressed="true">Hand (tactus)</button>
        <button class="tb" data-beat="pendulum" data-keep aria-pressed="false">Pendulum metronome</button>
        <button class="tb" data-beat="tick" data-keep aria-pressed="false">Audible tick</button>
      </div></div>
    </div>
    </div>
    <div class="podg" id="podCount"><label class="ctl cntin" title="Beats counted in, with clicks, before the music starts. Empty or 0: none"><span class="cntlbl">Count-in</span><input type="number" id="countIn" min="0" max="32" step="1" inputmode="numeric" placeholder="0" aria-label="Beats to count in"></label></div>
    <div class="tempo-row podg" role="group" aria-label="Tempo">
      <div class="unitpick">
        <button id="unitBtn" class="unitbtn" aria-haspopup="listbox" aria-expanded="false"></button>
        <ul id="unitList" class="menu" role="listbox" aria-label="Note value that gets the beat" tabindex="-1" hidden></ul>
      </div>
      <span class="eq" aria-hidden="true">=</span>
      <div class="stepper">
        <button id="tempoDown" aria-label="Slower" title="Slower">−</button>
        <input type="number" id="tempo" min="10" max="300" step="1" inputmode="numeric" aria-label="Beats per minute">
        <button id="tempoUp" aria-label="Faster" title="Faster">+</button>
      </div>
      <button id="tap" title="Tap the beat twice or more: the tempo follows your taps">Tap</button>
      <button id="heart" class="ib" aria-label="Semibrevis at the pulse: 60 per minute" title="Semibrevis = 60 per minute, a resting pulse (Gaffurius takes the semibrevis as one heartbeat)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.2s-7.6-4.7-9.7-9.4C.8 8.4 2.9 4.8 6.5 4.8c2.2 0 3.7 1.3 5.5 3.3 1.8-2 3.3-3.3 5.5-3.3 3.6 0 5.7 3.6 4.2 7-2.1 4.7-9.7 9.4-9.7 9.4Z"/></svg></button>
    </div>
    </div>
    </div>

          <label class="ctl" for="ss">Space between systems</label><input type="range" id="ss" min="0" max="3" step="0.05">
          <span class="lab">Syllable dashes</span><div class="btns" id="dashSeg" role="group" aria-label="Syllable dashes"><button class="tb" data-v="on">On</button><button class="tb" data-v="off">Off</button></div>

          <label class="ctl" for="handSize">Hand size</label><input type="range" id="handSize" min="0.4" max="2.5" step="0.05">
          <span class="lab" id="verseLab">Verse</span><div class="btns" id="verseSeg" role="group" aria-label="Verse"></div>
        </div></div>
      </div></div>
    </div>
  </section>

  <section class="tp-side" id="tpSide" aria-label="Sound settings" hidden>
    <div class="tcol">

      <label for="room">Room</label><input type="range" id="room" min="0" max="100" step="1"><output id="ro"></output>
      <label class="check"><input type="checkbox" id="audition"> Hear notes while editing</label>
      <button id="copySound" title="Copies the current sound settings as text, to send to whoever is tuning the sound">Copy sound settings</button>
    </div>
    <div class="tune" id="tune"></div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
</main>

Organ.init(st, {

  units: ['Mx', 'L', 'B', 'S', 'M', 'Sm', 'F'], unitIcon: k => glyphIcon(k, 0.25), unitName: k => UNIT_NAMES[k]

let piece = null;           /* parsed piece */

let pieceKey = null;

/* ------------------------------------------------------------------ */
/* Text measuring                                                      */
/* ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ */
/* Preparing voices for layout                                         */
/* ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ */
/* Horizontal layout                                                   */
/* ------------------------------------------------------------------ */
/* horizontal spacing: at 0 the notes stand as close as they can without touching; the slider adds room by duration */
const spring = d => 0.05 + 0.25 * Math.min(1, st.hs) + (0.8 + 2.3 * Math.pow(Math.max(d, 0.05), 0.6)) * st.hs;

/* columns for a set of voices over [a, b) */

  for (const br of piece.bars) if (br.t > a + EPS && br.t < b - EPS) col(br.t).bar = br.type;

/* break columns into lines of the given width; returns [{from, to}] */

  const lines = [];

/* ------------------------------------------------------------------ */
/* Drawing                                                             */
/* ------------------------------------------------------------------ */
const use = (k, x, y) => `<use href="#g-${k}" x="${f(x)}" y="${f(y)}"/>`;

/* One line of one voice's staff. ctx: {v, cols(from..to), xs, top, x0, x1, last, showNotes, showLyr, first} */

/* ------------------------------------------------------------------ */
/* Systems: a set of voices laid out together, line by line            */
/* ------------------------------------------------------------------ */
function headerW(v){

/* build lines for voices over [a,b) at width W; returns lines with x positions */

  if (!cols.length) return [];
  const hw = Math.max(...vlist.map(headerW));
  const indent = opts.indent || 0;
  const avail = W - hw;

  return br.map((L, li) => {
    const ind = li === 0 ? indent : 0;
    const startX = ind + hw + cols[L.from].left;
    const last = li === br.length - 1;
    const lastCol = cols[L.to - 1];
    const natural = lastCol.x - cols[L.from].x;

/* vertical room a voice needs in a line */

}

/* draw one system (several voices stacked) at y; returns {svg, h} */

/* ------------------------------------------------------------------ */
/* Pages                                                               */
/* ------------------------------------------------------------------ */
const PAPER = {A3: [297, 420], A4: [210, 297], A5: [148, 210]};
function pageGeom(){

    /* the two pages of an opening side by side, or one below the other on a narrow screen */
    const w = (st.view === 'choir' && avail >= 660 ? avail / 2 : avail) / (96 / 25.4), sp = st.size * 1.2, H = 100000;
    return {web: true, wmm: w, hmm: H * sp, sp, W: w / sp, H, M: Math.min(w, 297) * 0.065 / sp};

/* the foot of a page: the credits on the first, the title and the page number on the others */

    const who = piece.composer ? `${piece.title}, ${piece.composer}` : piece.title;
    s += `<text class="foot" x="${f(G.M)}" y="${f(base)}" font-size="${f(fs)}" font-style="italic">${esc(who)}</text>`;

}
function pageSvg(G, body){

}
function titleBlock(G, x0, x1, y, sub){

  let h = 4.6;

function visibleVoices(){ return piece.voices.filter(v => vis(v.idx).on); }

function layoutScore(G){

/* Choir book: openings with the voices spread over the two pages; every opening covers the same music in each voice */
function choirSides(vlist){
  const n = vlist.length;

/* ------------------------------------------------------------------ */
/* Render                                                              */
/* ------------------------------------------------------------------ */

}

}
/* pages side by side: the arrows move one page (one opening in the choir book) left or right */
const navItems = () => [...pagesEl.children].filter(c => c.classList.contains('page') || c.classList.contains('opening'));
function navIndex(){
  const items = navItems(), mid = viewerEl.scrollLeft + viewerEl.clientWidth / 2;
  let best = 0, bd = Infinity;
  items.forEach((c, i) => { const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid); if (d < bd) { bd = d; best = i; } });

function syncNav(){
  const horiz = st.flow === 'horizontal' && st.paper !== 'web';
  const max = viewerEl.scrollWidth - viewerEl.clientWidth;
  $('#pgPrev').disabled = !horiz || viewerEl.scrollLeft <= 2;
  $('#pgNext').disabled = !horiz || viewerEl.scrollLeft >= max - 2;
}
$('#pgPrev').addEventListener('click', () => goPage(-1));
$('#pgNext').addEventListener('click', () => goPage(1));
viewerEl.addEventListener('scroll', () => syncNav(), {passive: true});
viewerEl.addEventListener('wheel', e => {
  if (st.flow !== 'horizontal' || e.ctrlKey || Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
  if (!e.target.closest('.page')) return;
  const max = viewerEl.scrollWidth - viewerEl.clientWidth;
  const d = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? viewerEl.clientWidth : 1);
  if ((d < 0 && viewerEl.scrollLeft <= 0) || (d > 0 && viewerEl.scrollLeft >= max - 1)) return;   /* at the end of the row the website scrolls on */
  e.preventDefault();
  viewerEl.scrollLeft += d;
}, {passive: false});
/* bring a note into sight: in the row of pages, and in the window (or the site page around the app) */
function bringIntoView(el, force){
  const r = el.getBoundingClientRect();
  let top = 0, bottom = window.innerHeight;
  if (EMBED) {
    try { const fr = window.frameElement.getBoundingClientRect(), H = window.top.innerHeight; top = -fr.top; bottom = H - fr.top; }
    catch (e) { top = 0; bottom = window.innerHeight; }
  }
  let vr = viewerEl.getBoundingClientRect();
  if (viewerEl.classList.contains('frame') && (r.top < vr.top + 20 || r.bottom > vr.bottom - 20)) {
    viewerEl.scrollTo({top: viewerEl.scrollTop + r.top - vr.top - vr.height / 3, behavior: force ? 'auto' : 'smooth'});
    if (r.top >= Math.max(top, vr.top) - 2 && vr.bottom <= bottom + 2) return true;
    vr = viewerEl.getBoundingClientRect();
    if (vr.top >= top - 2 && vr.bottom <= bottom + 2) return true;
    const y = vr.top - top - 10;
    if (EMBED) { try { window.top.scrollBy({top: y, behavior: 'smooth'}); return true; } catch (e) {} }
    window.scrollBy({top: y, behavior: 'smooth'});
    return true;
  }
  const offX = st.flow === 'horizontal' && (r.left < vr.left + 50 || r.right > vr.right - 50);
  const offY = r.top < top + 20 || r.bottom > bottom - 20;
  if (!force && !offX && !offY) return false;
  if (offX) { const c = navItems().find(c => c.contains(el)); if (c) viewerEl.scrollTo({left: c.offsetLeft + c.offsetWidth / 2 - viewerEl.clientWidth / 2, behavior: 'smooth'}); }
  if (offY) {
    const y = r.top - top - (bottom - top) / 3;
    if (EMBED) { try { window.top.scrollBy({top: y, behavior: 'smooth'}); return true; } catch (e) {} }
    window.scrollBy({top: y, behavior: 'smooth'});
  }
  return true;
}
function pageDiv(svg, G, sc, extra){
  let hmm = G.hmm;
  if (G.web) { const m = /viewBox="0 0 [-\d.]+ ([\d.]+)"/.exec(svg); if (m) hmm = +m[1] * G.sp; }
  return `<div class="page" style="width:${f(G.wmm * 96 / 25.4 * sc)}px;height:${f(hmm * 96 / 25.4 * sc)}px" data-w="${G.wmm}" data-h="${hmm}">${svg}${extra}</div>`;
}

let CAT = null, CATBY = {};

const SRC_FROM = {jrp: 'the Josquin Research Project, josquin.stanford.edu', '1520': 'the 1520s Project, 1520s-project.org',
  pal: 'the music21 corpus, github.com/cuthbertLab/music21'};
/* what the first page says about where the score comes from, who made it and its copyright */
function creditText(){
  const m = (piece && piece.meta) || {};
  const e = CATBY[pieceKey];
  const s = e ? e.s : (m.jrpid || (pieceKey && PIECES.includes(pieceKey)) ? 'jrp' : null);
  const parts = [];
  const mine = pieceKey && pieceKey.startsWith('mine:');
  if (s && !mine) parts.push(`Score from ${SRC_FROM[s]}.`);
  else if (s && mine) parts.push(`Based on a score from ${SRC_FROM[s]}.`);
  if (m.SMS) parts.push(`Source: ${m.SMS}.`);
  if (m.YOR) parts.push(`After ${m.YOR.replace(/\.$/, '')}.`);
  if (m.EED) parts.push(`Edited by ${m.EED.replace(/\.$/, '')}.`);
  else if (m.ENC) parts.push(`Encoded by ${m.ENC.replace(/\.$/, '')}.`);
  if (m.YEC) parts.push(m.YEC.replace(/\.?$/, '.'));
  return {about: parts.join(' '), made: `Made with ${APP_NAME}, ${APP_URL}`};
}
const SRC_NAMES = {jrp: ['Josquin Research Project', 'https://josquin.stanford.edu', ''],
  '1520': ['The 1520s Project', 'https://1520s-project.org', ''],
  pal: ['music21 corpus (Palestrina, encoded by John Miller)', 'https://github.com/cuthbertLab/music21', '']};
let catPromise = null;
function loadCatalogue(){
  if (!catPromise) catPromise = fetch('choirbook/catalogue.json').then(r => r.json()).then(j => {
    CAT = j; CAT.pieces.forEach(e => { CATBY[e.k] = e; });
    return CAT;
  });
  return catPromise;
}
function catUrl(e){
  if (e.h) return 'choirbook/redix-progressio/' + e.k + '.krn';
  return CAT.sources[e.s] + (e.u || (e.s === 'pal' ? e.k.slice(4) : e.k) + '.krn');
}
async function pieceUrl(key){
  if (PIECES.includes(key)) return 'choirbook/' + key;
  await loadCatalogue();
  const e = CATBY[key];
  if (!e) throw new Error('This piece is not in the library: ' + key);
  return catUrl(e);
}
function showSource(key){
  const el = $('#srcNote'); if (!el) return;
  const e = CATBY[key];
  if (!e) { el.textContent = ''; return; }
  const [n, href] = SRC_NAMES[e.s] || ['', '', ''];
  const lic = piece && piece.meta && piece.meta.YEC;
  el.innerHTML = `Score: <a href="${esc(href)}" target="_blank" rel="noopener">${esc(n)}</a>${lic ? '. ' + esc(lic) : ''} · <a href="${esc(catUrl(e))}" target="_blank" rel="noopener">source file</a>`;
}
/* the address shows the open piece, so it can be bookmarked or shared */
function setAddress(key, extra){
  const q = '?piece=' + encodeURIComponent(key).replace(/%2F/g, '/') + (extra || '');
  try { history.replaceState(null, '', location.pathname + q); } catch (e) {}
  if (EMBED) try { parent.postMessage({choirbookQuery: q}, '*'); } catch (e) {}

/* marked bars (e.g. from a ReDiX Progressio search result) */
let mark = null;
function barTime(n){
  if (!piece || !piece.barNums) return null;
  const b = piece.barNums.find(x => x.n === n);
  if (b) return b.t;
  if (n <= 1) return 0;
  return null;
}
function applyMark(){
  const box = $('#markBar');
  if (!mark || mark.piece !== pieceKey || !piece) { if (box) box.hidden = true; return; }
  const t0 = barTime(mark.from);
  let t1 = barTime(mark.to + 1); if (t1 === null) t1 = piece.end;
  box.hidden = false;
  $('#markTxt').textContent = mark.from === mark.to ? `Bar ${mark.from} is marked in blue.` : `Bars ${mark.from}–${mark.to} are marked in blue.`;
  if (t0 === null) { $('#markTxt').textContent = `Bar ${mark.from} was not found in this score.`; return; }
  let first = null;
  for (const v of piece.voices) for (const q of (v.syms || [])) {
    if (q.t === undefined || q.t < t0 - EPS || q.t >= t1 - EPS) continue;
    document.querySelectorAll('#pages g.' + q.id).forEach(g => { g.classList.add('mark'); if (!first) first = g; });
  }
  if (first && !mark.scrolled) { mark.scrolled = true; setTimeout(() => { try { if (typeof bringIntoView === 'function') bringIntoView(first, true); else first.scrollIntoView({block: 'center'}); } catch (e) {} }, 60); }
}
/* My scores: new scores, and cantus firmi brought over from the CantusFirmus app, kept in this browser */
const MINE_KEY = 'choirbook:mine:v1';
function mineAll(){ try { return JSON.parse(localStorage.getItem(MINE_KEY) || '{}'); } catch (e) { return {}; } }
function mineSave(all){ try { localStorage.setItem(MINE_KEY, JSON.stringify(all)); } catch (e) {} }
function mineAdd(title, text){

async function loadPiece(file){
  let text = cache[file];
  if (!text && file.startsWith('mine:')) {
    const m = mineAll()[file];
    if (!m) throw new Error('This score is no longer kept in this browser.');
    text = m.text;
  }
  if (!text) {
    const r = await fetch(await pieceUrl(file));
    if (!r.ok) throw new Error('Could not load ' + file);
    text = cache[file] = await r.text();
  }
  stopPlay();
  let saved = null; try { saved = localStorage.getItem('choirbook:edit:' + file); } catch (e) {}
  piece = null;
  if (saved && file.startsWith('mine:')) { try { piece = parseKern(saved); piece.text = saved; } catch (e) { piece = null; } }
  if (!piece) piece = parseKern(text);
  pieceKey = file;
  if (typeof ed !== 'undefined') { ed.sel = null; ed.undo = []; ed.redo = []; ed.warned = false; }
  resetLook();
  st.piece = file; save();
  st.verse = 0;
  showSource(file);
  syncUI();
  render();
}
function loadText(name, text){
  try {
    stopPlay();
    piece = parseKern(text);
    pieceKey = 'file:' + name;
    if (typeof ed !== 'undefined') { ed.sel = null; ed.undo = []; ed.redo = []; ed.warned = false; }
    resetLook();
    syncUI(); render();
  } catch (e) { pagesEl.innerHTML = `<p class="msg">${esc(e.message)}</p>`; }
}
const meta = {};

const GENRES = {Mass: 'Mass movements', Motet: 'Motets', Song: 'Songs', Other: 'Other'};
function nameOf(c){ const i = c.indexOf(', '); return i > 0 ? c.slice(i + 2) + ' ' + c.slice(0, i) : c; }
function itemHtml(key, title, sub){
  return `<button class="pc" data-p="${esc(key)}" aria-current="${key === pieceKey}"><span class="t">${esc(title)}</span><span class="c">${esc(sub)}</span></button>`;
}
function fold(x){ return x.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
function libList(){
  const box = $('#libList'); if (!box || !CAT) return;
  const words = fold(lib.q).split(/\s+/).filter(Boolean);
  let list = CAT.pieces.filter(e => {
    if (lib.comp && e.c !== lib.comp) return false;
    if (lib.genre && e.g !== lib.genre) return false;
    if (lib.voices && (lib.voices === '6' ? e.v < 6 : String(e.v) !== lib.voices)) return false;
    if (words.length) { const h = e._f || (e._f = fold(e.t + ' ' + e.c + ' ' + nameOf(e.c) + ' ' + e.k)); if (!words.every(w => h.includes(w))) return false; }
    return true;
  });
  const by = {composer: (a, b) => a.c.localeCompare(b.c) || a.t.localeCompare(b.t),
    title: (a, b) => a.t.localeCompare(b.t) || a.c.localeCompare(b.c),
    voices: (a, b) => a.v - b.v || a.c.localeCompare(b.c) || a.t.localeCompare(b.t)}[lib.sort];
  list.sort(by);
  const n = list.length, show = list.slice(0, lib.shown);
  let html = `<p class="libhint">${n} piece${n === 1 ? '' : 's'}${n > show.length ? ` (showing ${show.length})` : ''}</p>`;
  const favs = favAll();
  html += show.map(e => `<div class="lrow">${itemHtml(e.k, e.t, `${nameOf(e.c)}${e.a ? ' (attributed)' : ''}${e.d ? ', ' + e.d : ''} · ${e.v} voices · ${(GENRES[e.g] || e.g).replace(/s$/, '')}`)}${favBtn(e.k, !!favs[e.k], e.t)}</div>`).join('');
  if (n > show.length) html += `<button class="more" id="libMore">Show more</button>`;
  box.innerHTML = html;
}

/* Writing **kern back out (for edits, and to download)                */
/* ------------------------------------------------------------------ */
function recipOf(d){
  for (let dots = 0; dots <= 2; dots++) {
    const base = d / (2 - Math.pow(0.5, dots));
    const k = Math.log2(base);
    if (Math.abs(k - Math.round(k)) < 1e-6 && k >= -7 && k <= 3) {
      const r = Math.round(k) >= 1 ? '0'.repeat(Math.round(k)) : String(Math.round(1 / base));
      return r + '.'.repeat(dots);
    }
  }
  /* rational value M/N of a whole note: N%M */
  for (let n = 1; n <= 96; n++) { const m = d * n; if (Math.abs(m - Math.round(m)) < 1e-6) return n + '%' + Math.round(m); }
  return '1';
}
function pitchTok(step){

  return oct >= 4 ? L.repeat(oct - 3) : L.toUpperCase().repeat(4 - oct);
}
function noteTok(e, tie){

    if (e.alt !== null && e.alt !== undefined) s += e.alt < 0 ? '-'.repeat(-e.alt) : e.alt > 0 ? '#'.repeat(e.alt) : 'n';
    if (e.ed) s += 'i';
    if (tie === 'mid') s += '_';
    if (tie === 'end') s += ']';
  }
  if (e.long) s += 'l';
  if (e.ferm) s += ';';
  return s;
}

  let t = 0;
  for (const e of v.events) { e.t = rt(t); t = rt(t + e.d); }

  const at = ei => ei < v.events.length ? v.events[ei].t : v.end;
  for (const arr of [v.mets, v.keys, v.clefs]) for (const m of arr) m.t = at(m.ei);

  else commit(() => { for (const i of s.src) { const e = v.events[i]; e.rest = true; e.tieStart = e.tieEnd = e.tieMid = false; } ed.sel = null; ed.ins = {vi, ei: s.src[s.src.length - 1] + 1}; });
}
/* what the shared note-input tools (shared/note-input.js) need from this app */
const CBA = {
  edit: () => ed.on,
  state(){
    const s = selSym(), t = targetSym(), v = curVoice();
    return {selected: !!s, dur: s ? valKey(s) : ed.val, rest: s ? s.rest : ed.inRest,
      target: t && {r: t.rest, a: accOf(t), p: t.dot}, canUndo: ed.undo.length > 0, canRedo: ed.redo.length > 0,
      hasNotes: !!(piece && piece.voices.length), durs: v && v.syms ? v.syms.map(valKey) : []};
  },
  setDur(k){
    ed.val = k;
    if (selSym()) OPS.value(k);
    else { ed.inRest = false; syncEdit(); }
  },
  setRestMode(rest){
    ed.inRest = rest;
    const s = selSym();
    if (s && s.rest !== rest) OPS.rest(); else syncEdit();
  },
  toggleAcc(a){
    const t = targetSym(), v = curVoice(); if (!t || t.rest) return;
    const off = accOf(t) === a;
    commit(() => { for (const i of t.src) { const e = v.events[i]; e.alt = off ? implied(v, e.step, e.t) : ACC_ALT[a]; e.ed = false; } });
    const e = curVoice().events[t.src[0]]; if (e) hear(e.step, e.alt);
  },
  toggleDot(){
    const t = targetSym(), v = curVoice(); if (!t || t.rest) return;
    commit(() => {
      const e = v.events[t.src[0]];
      const total = t.src.reduce((a, i) => a + v.events[i].d, 0);
      e.d = rt(t.dot ? total / 1.5 : total * 1.5); e.tieStart = e.tieEnd = e.tieMid = false;
      dropEvents(v, t.src.slice(1));
    });
  },
  stepPitch(d){
    const t = targetSym(), v = curVoice(); if (!t || t.rest) return;
    commit(() => { for (const i of t.src) { const e = v.events[i]; moveStep(v, e, clampStep(e.step + d)); } });
    const e = curVoice().events[t.src[0]]; if (e) hear(e.step, e.alt);
  },
  moveSel(dir){
    if (!piece) return;
    let vi = ed.sel ? ed.sel.vi : ed.ins ? ed.ins.vi : null;
    if (vi === null) { const vs = visibleVoices(); if (!vs.length) return; vi = vs[0].idx; }
    const v = piece.voices[vi], syms = v.syms || [];
    if (!syms.length) return;
    const s = selSym();
    let k;
    if (s) k = syms.indexOf(s) + dir;
    else if (ed.ins) {
      const c = ed.ins.ei;
      k = dir < 0 ? syms.findIndex(q => q.src.includes(c - 1)) : syms.findIndex(q => q.src[0] >= c);
      if (k < 0) k = dir < 0 ? 0 : syms.length - 1;
    } else k = 0;
    const q = syms[Math.max(0, Math.min(syms.length - 1, k))];
    ed.sel = {vi, ei: q.src[0]}; ed.ins = {vi, ei: q.src[q.src.length - 1] + 1};

  },
  deleteTarget(){
    const t = targetSym(), v = curVoice(); if (!t) return;
    const vi = v.idx, first = t.src[0];
    commit(() => { dropEvents(v, t.src); ed.sel = null; ed.ins = {vi, ei: first}; });
  },
  typeNote(L){
    const v = curVoice(); if (!v) return;
    const idx = insertionIndex(v), ref = refStepBefore(v, idx), li = 'CDEFGAB'.indexOf(L);
    let best = null;
    for (let o = 0; o <= 8; o++) {
      const s = 7 * o + li;
      if (s < STEP_MIN || s > STEP_MAX) continue;
      if (best === null || Math.abs(s - ref) < Math.abs(best - ref)) best = s;
    }
    ed.inRest = false;
    insertEvent(v.idx, idx, best, false);
  },
  typeRest(){
    const v = curVoice(); if (!v) return;
    const idx = insertionIndex(v);
    insertEvent(v.idx, idx, refStepBefore(v, idx), true);
  },
  undo: () => undo(), redo: () => redo(),
  deselect(){ if (ed.sel) { ed.sel = null; showSel(); } },
  togglePlay(){ if (play) stopPlay(); else startPlay(); },
  scaleAll(dir){ const v = curVoice(); if (v) commit(() => { for (const e of v.events) e.d = rt(dir < 0 ? e.d * 2 : e.d / 2); }); },
  shiftOctave(dir){ const v = curVoice(); if (v) commit(() => { for (const e of v.events) if (!e.rest) e.step = clampStep(e.step + 7 * dir); }); },
  mutate: fn => commit(fn),
  pitched(){
    const v = curVoice();
    return v ? v.events.filter(e => !e.rest).map(e => ({e, v, s: e.step, alter: e.alt || 0})) : [];
  },
  setPitch(h, s, alter){
    const e = h.e, imp = implied(h.v, s, e.t);
    e.step = s; e.ed = false;
    e.alt = alter === null ? imp : alter === 0 && !imp ? null : alter;
  },
  range: [STEP_MIN, STEP_MAX],
  toast: m => toast(m)
