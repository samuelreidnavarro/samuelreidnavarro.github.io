<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choir book</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 27 16 16 29 5 16Z' fill='%2324479A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+Double+Pica:ital@0;1&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<!--
  Choir book: a reader for mensural polyphony (score, parts, choir book openings).
  Reads Humdrum **kern files such as those of the Josquin Research Project.
  Everything is in this one file; pieces live in games/choirbook/*.krn (see PIECES below).
  Note shapes, clefs and accidentals are outlines from the Bravura music font
  by Steinberg Media Technologies, used under the SIL Open Font License 1.1.
-->
<style>
:root{
  --ground:#FBF7EF; --surface:#F4EDE0; --text:#2A2218; --muted:#7D6F5B; --line:#D6C8B0;
  --accent:#8E2A1E; --accent-ink:#F7F2E6;
  --leaf-ink:#2A2218; --rule:#8E2A1E; --paper:none;
  color-scheme: light;
}
*{box-sizing:border-box}
.embedded,.embedded body{overflow:hidden;height:auto}
.embedded header.top{display:none}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--text);
  font:400 19px/1.45 "IM Fell English","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
.wrap{margin:0 auto;padding:22px clamp(14px,2.6vw,44px) 40px}
.embedded .wrap{padding-top:6px}
header.top{margin-bottom:14px}
h1{font-family:"IM Fell Double Pica","IM Fell English",Georgia,serif;font-weight:400;font-size:clamp(2.2rem,4.4vw,3.2rem);line-height:1.02;margin:0}
button{font:inherit;font-size:15.5px;color:var(--text);background:var(--surface);border:1px solid var(--line);
  border-radius:6px;min-height:40px;padding:0 14px;cursor:pointer;line-height:1;display:inline-flex;align-items:center;gap:8px}
button:hover:not(:disabled){border-color:var(--text)}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.42;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:inherit;font-size:15.5px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:38px;padding:0 8px}
input[type=range]{accent-color:var(--accent);width:150px}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;margin:0}
.chev{width:11px;height:11px;fill:currentColor}
.ib{width:44px;height:44px;padding:0;justify-content:center}
.ib svg{width:22px;height:22px;fill:currentColor}

.tools{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding:4px 0 14px;background:var(--ground);z-index:5}
@media (min-width:760px) and (min-height:620px){ .tools{position:sticky;top:0} }
.tools .spacer{flex:1}
.pod{display:flex;gap:2px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px}
.pod > button,.pod > .pop > button{border-color:transparent;background:transparent;min-height:38px}
.pod > button:hover:not(:disabled),.pod > .pop > button:hover{border-color:var(--line)}
.pod > button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex}
.seg button{border-radius:0;justify-content:center}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button + button{margin-left:-1px}
.pop{position:relative}
.popbody{display:none;position:absolute;left:-4px;top:calc(100% + 2px);z-index:15;padding:10px;background:var(--surface);width:max-content;max-width:calc(100vw - 24px);
  border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 28px -12px rgba(0,0,0,.4)}
.pop.right .popbody{left:auto;right:-4px}
.pop.open .popbody{display:block}
.grid{display:grid;grid-template-columns:auto auto;gap:10px 14px;align-items:center}
.grid .lab{color:var(--muted);font-style:italic;font-size:15.5px;white-space:nowrap}
.grid .val{display:flex;align-items:center;gap:8px}
.grid .val output{font-size:14px;color:var(--muted);min-width:2.6em}
.voices{border-collapse:collapse}
.voices th{font-weight:400;font-style:italic;color:var(--muted);font-size:14.5px;padding:0 8px 6px;text-align:center}
.voices td{padding:4px 8px;text-align:center}
.voices td:first-child{text-align:left;white-space:nowrap;padding-left:2px}
.piecelist{display:flex;flex-direction:column;gap:4px;min-width:min(420px,calc(100vw - 48px))}
.piecelist button{display:block;text-align:left;height:auto;padding:9px 12px 8px;line-height:1.25;border-color:transparent;background:transparent}
.piecelist button:hover{border-color:var(--line);background:var(--ground)}
.piecelist button[aria-current="true"]{border-color:var(--accent)}
.piecelist .t{display:block;font-family:"IM Fell Double Pica","IM Fell English",Georgia,serif;font-size:18px}
.piecelist .c{display:block;font-size:14.5px;color:var(--muted);font-style:italic}
.piecelist hr{border:0;border-top:1px solid var(--line);margin:6px 0}

#pages{display:flex;flex-direction:column;align-items:center;gap:26px}
.opening{display:flex;gap:0;justify-content:center;max-width:100%}
.opening .page:first-child{border-radius:3px 0 0 3px}
.opening .page:last-child{border-radius:0 3px 3px 0}
.opening .page + .page{box-shadow:inset 18px 0 22px -18px rgba(70,46,10,.35),0 1px 1px rgba(60,40,10,.14),0 14px 32px -14px rgba(50,34,8,.42)}
.page{position:relative;background:#EFE3C7 var(--paper);background-size:512px 512px;color:var(--leaf-ink);border-radius:3px;flex:none;
  box-shadow:0 1px 1px rgba(60,40,10,.14),0 14px 32px -14px rgba(50,34,8,.42),inset 0 0 70px rgba(150,108,40,.13),inset 0 0 0 1px rgba(120,90,40,.16)}
.page svg{display:block;width:100%;height:100%}
.pnum{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:13px;color:var(--muted)}
svg .staff{stroke:var(--rule)}
svg .ledger,svg .barl,svg .tie,svg .ms{stroke:var(--leaf-ink)}
svg use,svg .ink{fill:var(--leaf-ink)}
svg text{fill:var(--leaf-ink);font-family:"IM Fell English","Palatino Linotype",Palatino,Georgia,serif}
svg .title{font-family:"IM Fell Double Pica","IM Fell English",Georgia,serif}
svg .playing use{fill:var(--accent)}
.msg{color:var(--muted);font-style:italic;padding:30px 0}
.drop{outline:2px dashed var(--accent);outline-offset:6px}
[hidden]{display:none !important}
@media (max-width:700px){
  .pop{position:static}
  .popbody{position:absolute;left:12px !important;right:12px !important;width:auto;top:auto;margin-top:4px}
  .tools{position:relative}
  .grid{grid-template-columns:1fr}
  .grid .lab{margin-bottom:-6px}
  .seg{flex-wrap:wrap}
  input[type=range]{width:100%;flex:1}
}
.play{width:48px;height:48px;border-radius:50%;padding:0;justify-content:center;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.play svg{width:20px;height:20px;fill:currentColor}
.play:hover:not(:disabled){border-color:var(--text)}
.tempo{display:flex;align-items:center;gap:6px;color:var(--muted);font-style:italic;font-size:15.5px}
.tempo input{width:4.2em;font:inherit;font-style:normal;font-size:15.5px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:38px;padding:0 6px}
svg g.on use,svg g.on .ink{fill:var(--accent)}
svg g.on .ledger{stroke:var(--accent)}

@media print{
  html,body{background:#fff !important}
  .wrap{padding:0 !important}
  header.top,.tools,.pnum,.msg{display:none !important}
  #pages{display:block;gap:0}
  .opening{display:block}
  .page{background:#fff !important;box-shadow:none !important;border-radius:0 !important;break-after:page;page-break-after:always;margin:0}
  .page:last-child{break-after:auto}
}
</style>
<style id="pagerule">@page{size:A4 portrait;margin:0}</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>Choir book</h1></header>
  <div class="tools" id="tools">
    <div class="pop" id="popPieces">
      <button class="popbtn" id="piecesBtn" aria-haspopup="true" aria-expanded="false">Pieces <svg class="chev" viewBox="0 0 12 12"><path d="M2 4.2 6 8.4 10 4.2 8.9 3.1 6 6.1 3.1 3.1Z"/></svg></button>
      <div class="popbody"><div class="piecelist" id="pieceList"></div></div>
    </div>
    <div class="seg" id="viewSeg" role="group" aria-label="View">
      <button data-v="score">Score</button><button data-v="parts">Parts</button><button data-v="choir">Choir book</button>
    </div>
    <div class="pop" id="popVoices">
      <button class="popbtn" aria-haspopup="true" aria-expanded="false">Voices <svg class="chev" viewBox="0 0 12 12"><path d="M2 4.2 6 8.4 10 4.2 8.9 3.1 6 6.1 3.1 3.1Z"/></svg></button>
      <div class="popbody"><table class="voices" id="voiceTable"></table></div>
    </div>
    <div class="pop" id="popLook">
      <button class="popbtn" aria-haspopup="true" aria-expanded="false">Appearance <svg class="chev" viewBox="0 0 12 12"><path d="M2 4.2 6 8.4 10 4.2 8.9 3.1 6 6.1 3.1 3.1Z"/></svg></button>
      <div class="popbody"><div class="grid">
        <span class="lab">Notation</span><div class="seg" id="notaSeg"><button data-v="real">Real mensural</button><button data-v="fake">Fake mensural</button></div>
        <span class="lab">Clefs</span><div class="seg" id="clefSeg"><button data-v="mens">Mensural</button><button data-v="modern">Modern</button></div>
        <span class="lab">Barlines</span><div class="seg" id="barSeg"><button data-v="none">None</button><button data-v="tick">Ticks</button><button data-v="mstrich">Mensurstrich</button><button data-v="full">Full</button></div>
        <span class="lab">Staff size</span><div class="val"><input type="range" id="size" min="1" max="4" step="0.05"><output id="sizeOut"></output></div>
        <span class="lab">Horizontal spacing</span><div class="val"><input type="range" id="hs" min="0.3" max="2.5" step="0.05"><output id="hsOut"></output></div>
        <span class="lab">Vertical spacing</span><div class="val"><input type="range" id="vs" min="0.2" max="3" step="0.05"><output id="vsOut"></output></div>
        <span class="lab">Editorial accidentals</span><div class="val"><input type="checkbox" id="edAcc"></div>
        <span class="lab" id="verseLab">Verse</span><div class="val"><select id="verse"></select></div>
      </div></div>
    </div>
    <div class="pop" id="popPage">
      <button class="popbtn" aria-haspopup="true" aria-expanded="false">Page <svg class="chev" viewBox="0 0 12 12"><path d="M2 4.2 6 8.4 10 4.2 8.9 3.1 6 6.1 3.1 3.1Z"/></svg></button>
      <div class="popbody"><div class="grid">
        <span class="lab">Size</span><div class="seg" id="paperSeg"><button data-v="A3">A3</button><button data-v="A4">A4</button><button data-v="A5">A5</button></div>
        <span class="lab">Orientation</span><div class="seg" id="orientSeg"><button data-v="portrait">Portrait</button><button data-v="landscape">Landscape</button></div>
      </div></div>
    </div>
    <button class="play" id="playBtn" aria-label="Play" title="Play"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" d="M7 4.5v15l12.5-7.5Z"/></svg></button>
    <label class="tempo" title="Semibreves per minute">Tempo <input type="number" id="tempo" min="20" max="240" step="1"></label>
    <span class="spacer"></span>
    <button id="openBtn">Open file</button>
    <input type="file" id="fileIn" accept=".krn,.kern,.txt" hidden>
    <button id="printBtn">Print</button>
  </div>
  <div id="pages"></div>
</div>

  c2:       {bottom:26, g:'c2', pos:2},
  c3:       {bottom:24, g:'c3', pos:4},
  c4:       {bottom:22, g:'c4', pos:6},
  c5:       {bottom:20, g:'c5', pos:8},
  f3:       {bottom:20, g:'fP', pos:4},
  bass:     {bottom:18, g:'fP', pos:6}

/* ------------------------------------------------------------------ */
/* Humdrum **kern reader                                               */
/* ------------------------------------------------------------------ */

/* ------------------------------------------------------------------ */
/* Mensuration signs                                                   */

/* clef for a voice: as encoded, or a mensural C/F clef that keeps the range on the staff */
function chooseClef(v, mode){

/* State                                                               */

const KEY = 'choirbook:v1';
const st = {

let piece = null;           /* parsed piece */
let pieceKey = null;
const cache = {};

/* per-voice switches: in the layout, notes, lyrics */

/* ------------------------------------------------------------------ */
/* Text measuring                                                      */
/* ------------------------------------------------------------------ */

    s += barSvg(c.bar, bx, tops, single, segs);
  }
  /* a barline that falls on the line break goes at the line end */
  if (!line.endsPiece) {
    const br = piece.bars.find(b => eq(b.t, line.tEnd));
    if (br && br.type === 'double') s += barSvg('double', line.x1 - 0.4, tops, single, segs);
  }
  if (line.endsPiece) s += finalBar(line.x1 - 0.9, tops);
  /* left edge: a thin line joining the staves in score */
  if (vlist.length > 1 && opts.join) s += vl(line.x0, tops[0], tops[tops.length - 1] + 4, 'barl', 0.14);
  return {svg: s, h: yy - y, tops};
}

/* ------------------------------------------------------------------ */
/* Pages                                                               */
/* ------------------------------------------------------------------ */
const PAPER = {A3: [297, 420], A4: [210, 297], A5: [148, 210]};
function pageGeom(){
  let [w, h] = PAPER[st.paper] || PAPER.A4;
  if (st.orient === 'landscape') [w, h] = [h, w];
  const sp = st.size * (st.paper === 'A5' ? 0.82 : st.paper === 'A3' ? 1.25 : 1);
  const m = Math.min(w, h) * 0.065;
  return {wmm: w, hmm: h, sp, W: w / sp, H: h / sp, M: m / sp};
}
function pageSvg(G, body){
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${f(G.W)} ${f(G.H)}" preserveAspectRatio="xMidYMid meet">${body}</svg>`;
}
function titleBlock(G, x0, x1, y, sub){
  let s = `<text class="title" x="${f((x0 + x1) / 2)}" y="${f(y + 3.2)}" font-size="3.4" text-anchor="middle">${esc(piece.title)}</text>`;
  let h = 4.6;
  if (sub) { s += `<text x="${f((x0 + x1) / 2)}" y="${f(y + h + 1.9)}" font-size="2.2" text-anchor="middle" font-style="italic">${esc(sub)}</text>`; h += 2.8; }
  if (piece.composer) { s += `<text x="${f(x1)}" y="${f(y + h + 1.6)}" font-size="1.9" text-anchor="end">${esc(piece.composer)}</text>`; h += 2.4; }
  return {svg: s, h: h + 1.2};
}
function visibleVoices(){ return piece.voices.filter(v => vis(v.idx).on); }

function layoutScore(G){
  const vlist = visibleVoices();
  if (!vlist.length) return [];
  const names = vlist.map(v => v.name);
  const indent = Math.max(...names.map(n => textW(n, 1.8, true))) + 1.4;
  const W = G.W - 2 * G.M;
  const lines = buildLines(vlist, 0, piece.end + 1, W, {indent});
  return paginate(G, lines, vlist, (line, li) => li === 0 ? {names, join: true} : {join: true}, null);
}
function paginate(G, lines, vlist, optsFor, sub){
  const pages = [];
  let body = '', y = G.M, first = true;
  const sysGap = 2.2 * st.vs + 1;
  const newPage = () => { pages.push(body); body = ''; y = G.M; };
  if (first) { const tb = titleBlock(G, G.M, G.W - G.M, y, sub); body += tb.svg; y += tb.h; }
  lines.forEach((line, li) => {
    const probe = drawSystem(vlist, line, 0, optsFor(line, li));
    if (y + probe.h > G.H - G.M && body) newPage();
    const sys = drawSystem(vlist, line, y, optsFor(line, li));
    body += `<g transform="translate(${f(G.M)} 0)">${sys.svg}</g>`;
    y += sys.h + sysGap;
  });
  if (body) pages.push(body);
  return pages.map(b => pageSvg(G, b));
}
function layoutParts(G){
  const out = [];
  const W = G.W - 2 * G.M;
  for (const v of visibleVoices()) {
    const lines = buildLines([v], 0, piece.end + 1, W, {});
    out.push(...paginate(G, lines, [v], () => ({}), v.name));
  }
  return out;
}

/* Choir book: openings with the voices spread over the two pages; every opening covers the same music in each voice */
function choirSides(vlist){
  const n = vlist.length;
  if (n === 1) return [[vlist[0]], []];
  if (n === 2) return [[vlist[0]], [vlist[1]]];
  if (n === 3) return [[vlist[0]], [vlist[1], vlist[2]]];
  const L = [], R = [];
  vlist.forEach((v, i) => (i % 2 ? R : L).push(v));
  return [L, R];
}
function layoutChoir(G){
  const vlist = visibleVoices();
  if (!vlist.length) return [];
  const sides = choirSides(vlist);
  const W = G.W - 2 * G.M;
  /* each voice's own columns, spaced once */
  const lyrOn = v => vis(v.idx).lyr;
  const vcols = new Map(vlist.map(v => [v, columns([v], 0, piece.end + 1, lyrOn)]));
  /* opening boundaries where no voice holds a note across */
  const times = new Set();
  for (const v of vlist) for (const s of v.syms) times.add(s.t);
  for (const b of piece.bars) times.add(b.t);
  const holds = (v, t) => v.syms.some(s => s.t < t - EPS && s.end > t + EPS);
  let cands = [...times].filter(t => t > EPS && vlist.every(v => !holds(v, t))).sort((a, b) => a - b);
  cands.push(piece.end + 1);
  /* lines a voice needs for [a,b) */
  const hdr = new Map(vlist.map(v => [v, headerW(v)]));
  const linesNeeded = (v, a, b) => {
    const cols = vcols.get(v).filter(c => c.t >= a - EPS && c.t < b - EPS);
    if (!cols.length) return 0;
    return breakLines(cols, W - hdr.get(v)).length;
  };
  const sysPitch = v => {
    const lyr = vis(v.idx).lyr && v.syms.some(s => s.text);
    return 4 + 2.4 + (lyr ? 3.0 : 0) + 1.6 * st.vs;
  };
  /* region heights per side; the first opening carries the title */
  const tb = titleBlock(G, G.M, G.W - G.M, G.M, null);
  const capacity = (side, top) => {
    const H = G.H - G.M - top;
    const n = side.length || 1;
    const per = H / n;
    return side.map(v => Math.max(1, Math.floor((per - 2.4) / sysPitch(v))));
  };
  const openings = [];
  let a = 0, guard = 0;
  while (a < piece.end - EPS && guard++ < 500) {
    const top = G.M + (openings.length === 0 ? tb.h : 0) + 0.4;
    const caps = new Map();
    sides.forEach(side => capacity(side, top).forEach((c, k) => caps.set(side[k], c)));
    const fits = b => vlist.every(v => linesNeeded(v, a, b) <= caps.get(v));
    let lo = cands.findIndex(t => t > a + EPS);
    if (lo < 0) break;
    let hi = cands.length - 1, best = lo;
    if (fits(cands[hi])) best = hi;
    else {
      while (lo <= hi) { const mid = (lo + hi) >> 1; if (fits(cands[mid])) { best = mid; lo = mid + 1; } else hi = mid - 1; }
    }
    const b = cands[best];
    openings.push({a, b, top, caps});
    a = b;
  }
  /* draw */
  const pages = [];
  openings.forEach((op, oi) => {
    sides.forEach((side, si) => {
      let body = '';
      if (oi === 0 && si === 0) body += titleBlock(G, G.M, G.W - G.M, G.M, null).svg;
      const H = G.H - G.M - op.top, per = H / (side.length || 1);
      side.forEach((v, k) => {
        const y0 = op.top + per * k;
        body += `<text x="${f(G.M)}" y="${f(y0 + 1.6)}" font-size="1.8" font-style="italic">${esc(v.name)}</text>`;
        const lines = buildLines([v], op.a, op.b, W, {raggedLast: true});
        const pitch = sysPitch(v);
        lines.forEach((line, li) => {
          const room = lineRoom(v, line);
          const ty = y0 + 2.4 + li * pitch + Math.max(1.2, Math.min(room.above, 2.4));
          const sys = drawSystem([v], line, ty - Math.min(room.above, 2.4) - 0, {});
          body += `<g transform="translate(${f(G.M)} 0)">${sys.svg}</g>`;
        });
      });
      pages.push({svg: pageSvg(G, body), side: si, opening: oi});
    });
  });
  return pages;
}

/* ------------------------------------------------------------------ */
/* Render                                                              */
/* ------------------------------------------------------------------ */
const pagesEl = $('#pages');
let defsDone = false;
function defs(){
  if (defsDone) return;
  const d = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  d.setAttribute('width', '0'); d.setAttribute('height', '0'); d.style.position = 'absolute';
  d.innerHTML = '<defs>' + Object.entries(GLY).map(([k, v]) => `<path id="g-${k}" d="${v.d}"/>`).join('') + '</defs>';
  document.body.appendChild(d);
  defsDone = true;
}
function render(){
  if (!piece) return;
  defs();
  prepare();
  const G = pageGeom();
  document.getElementById('pagerule').textContent = `@page{size:${st.paper} ${st.orient};margin:0}`;
  let html = '';
  const avail = pagesEl.clientWidth || window.innerWidth - 40;
  const pxmm = 96 / 25.4;
  if (st.view === 'choir') {
    const pages = layoutChoir(G);
    const sc = Math.min(1.25, avail / (2 * G.wmm * pxmm));
    for (let i = 0; i < pages.length; i += 2) {
      html += `<div class="opening">`;
      for (const p of pages.slice(i, i + 2)) html += pageDiv(p.svg, G, sc, '');
      html += `</div>`;
    }
    if (!pages.length) html = '<p class="msg">No voices are shown.</p>';
  } else {
    const pages = st.view === 'parts' ? layoutParts(G) : layoutScore(G);
    const sc = Math.min(1.25, avail / (G.wmm * pxmm));
    pages.forEach((p, i) => { html += pageDiv(p, G, sc, `<span class="pnum">${i + 1}</span>`); });
    if (!pages.length) html = '<p class="msg">No voices are shown.</p>';
  }
  pagesEl.innerHTML = html;
  postHeight();
}
function pageDiv(svg, G, sc, extra){
  return `<div class="page" style="width:${f(G.wmm * 96 / 25.4 * sc)}px;height:${f(G.hmm * 96 / 25.4 * sc)}px" data-w="${G.wmm}" data-h="${G.hmm}">${svg}${extra}</div>`;
}
/* print at true paper size */
window.addEventListener('beforeprint', () => {
  document.querySelectorAll('.page').forEach(p => { p.dataset.sw = p.style.width; p.dataset.sh = p.style.height; p.style.width = p.dataset.w + 'mm'; p.style.height = p.dataset.h + 'mm'; });
});
window.addEventListener('afterprint', () => {
  document.querySelectorAll('.page').forEach(p => { p.style.width = p.dataset.sw; p.style.height = p.dataset.sh; });
});

/* ------------------------------------------------------------------ */
/* Loading pieces                                                      */
/* ------------------------------------------------------------------ */
async function loadPiece(file){
  let text = cache[file];
  if (!text) {
    const r = await fetch('choirbook/' + file);
    if (!r.ok) throw new Error('Could not load ' + file);
    text = cache[file] = await r.text();
  }
  stopPlay();
  piece = parseKern(text);
  pieceKey = file;
  st.piece = file; save();
  st.verse = 0;
  syncUI();
  render();
}
function loadText(name, text){
  try {
    stopPlay();
    piece = parseKern(text);
    pieceKey = 'file:' + name;
    syncUI(); render();
  } catch (e) { pagesEl.innerHTML = `<p class="msg">${esc(e.message)}</p>`; }
}
const meta = {};
async function buildPieceList(){
  const list = $('#pieceList');
  await Promise.all(PIECES.map(async p => {
    try {
      const r = await fetch('choirbook/' + p); const t = await r.text(); cache[p] = t;
      const pc = parseKern(t); meta[p] = {title: pc.title, composer: pc.composer};
    } catch (e) { meta[p] = {title: p, composer: ''}; }
  }));
  list.innerHTML = PIECES.map(p => `<button data-p="${esc(p)}"${p === pieceKey ? ' aria-current="true"' : ''}><span class="t">${esc(meta[p].title)}</span><span class="c">${esc(meta[p].composer)}</span></button>`).join('');
}

/* ------------------------------------------------------------------ */
/* Controls                                                            */
/* ------------------------------------------------------------------ */
function segInit(id, key, after){
  const el = $(id);
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    st[key] = b.dataset.v; save(); syncUI(); render(); if (after) after();
  });
}
function syncUI(){
  const segs = {'#viewSeg': 'view', '#notaSeg': 'nota', '#clefSeg': 'clefs', '#barSeg': 'bars', '#paperSeg': 'paper', '#orientSeg': 'orient'};
  for (const [id, k] of Object.entries(segs)) $(id).querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === st[k])));
  for (const k of ['size', 'hs', 'vs']) { $('#' + k).value = st[k]; }
  $('#sizeOut').textContent = (st.size * 4).toFixed(1) + ' mm';
  $('#hsOut').textContent = st.hs.toFixed(2);
  $('#vsOut').textContent = st.vs.toFixed(2);
  $('#edAcc').checked = st.edAcc;
  $('#tempo').value = st.tempo;
  /* verses */
  const nv = piece ? Math.max(1, ...piece.voices.map(v => v.verses)) : 1;
  $('#verseLab').hidden = $('#verse').parentNode.hidden = nv < 2;
  $('#verse').innerHTML = Array.from({length: nv}, (_, i) => `<option value="${i}"${i === st.verse ? ' selected' : ''}>${i + 1}</option>`).join('');
  /* voice table */
  if (piece) {
    const row = (v) => {
      const s = vis(v.idx);
      const cb = (k, label) => `<td><input type="checkbox" data-i="${v.idx}" data-k="${k}" aria-label="${esc(v.name)}: ${label}"${s[k] ? ' checked' : ''}${k !== 'on' && !s.on ? ' disabled' : ''}></td>`;
      return `<tr><td>${esc(v.name)}</td>${cb('on', 'shown')}${cb('notes', 'notes')}${cb('lyr', 'lyrics')}</tr>`;
    };
    $('#voiceTable').innerHTML = `<tr><th></th><th>Shown</th><th>Notes</th><th>Lyrics</th></tr>` + piece.voices.map(row).join('');
  }
  document.querySelectorAll('#pieceList button').forEach(b => b.setAttribute('aria-current', String(b.dataset.p === pieceKey)));
}
segInit('#viewSeg', 'view'); segInit('#notaSeg', 'nota'); segInit('#clefSeg', 'clefs'); segInit('#barSeg', 'bars');
segInit('#paperSeg', 'paper'); segInit('#orientSeg', 'orient');
let rq = 0;
const later = () => { cancelAnimationFrame(rq); rq = requestAnimationFrame(render); };
for (const k of ['size', 'hs', 'vs']) $('#' + k).addEventListener('input', e => { st[k] = +e.target.value; save(); syncUI(); later(); });
$('#edAcc').addEventListener('change', e => { st.edAcc = e.target.checked; save(); render(); });
$('#verse').addEventListener('change', e => { st.verse = +e.target.value; save(); render(); });
$('#voiceTable').addEventListener('change', e => {
  const c = e.target; if (!c.dataset.k) return;
  vis(+c.dataset.i)[c.dataset.k] = c.checked; save(); syncUI(); render();
  if (play && c.dataset.k === 'on') { stopPlay(); startPlay(); }
});
$('#pieceList').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  closePops(); loadPiece(b.dataset.p).catch(err => { pagesEl.innerHTML = `<p class="msg">${esc(err.message)}</p>`; });
});
/* pop-overs open on click */
function closePops(except){ document.querySelectorAll('.pop.open').forEach(p => { if (p !== except) { p.classList.remove('open'); p.querySelector('button').setAttribute('aria-expanded', 'false'); } }); }
document.querySelectorAll('.pop > button').forEach(b => b.addEventListener('click', () => {
  const p = b.parentNode, open = !p.classList.contains('open');
  closePops(p); p.classList.toggle('open', open); b.setAttribute('aria-expanded', String(open));
  postHeight();
}));
document.addEventListener('click', e => { if (!e.target.closest('.pop')) closePops(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePops();
  if (e.key === ' ' && !/INPUT|SELECT|BUTTON|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); if (play) stopPlay(); else startPlay(); }
});
/* open a file from the computer, or drop one on the page */
$('#openBtn').addEventListener('click', () => $('#fileIn').click());
$('#fileIn').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  file.text().then(t => loadText(file.name, t));
  e.target.value = '';
});
document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drop'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drop'); });
document.addEventListener('drop', e => {
  e.preventDefault(); document.body.classList.remove('drop');
  const file = e.dataTransfer.files[0]; if (file) file.text().then(t => loadText(file.name, t));
});
$('#printBtn').addEventListener('click', () => {
  if (EMBED && !pieceKey.startsWith('file:')) { window.open('choirbook.html?print=1', '_blank'); return; }
  window.print();
});

/* ------------------------------------------------------------------ */
/* Playback: a small organ, every shown voice                          */
/* ------------------------------------------------------------------ */
const SEMI = [0, 2, 4, 5, 7, 9, 11];
let actx = null, wave = null, play = null;
function midiOf(s){
  const oct = Math.floor(s.step / 7), idx = ((s.step % 7) + 7) % 7;
  return 12 * (oct + 1) + SEMI[idx] + (s.alt || 0);
}
function setPlayIcon(on){
  $('#playIcon').setAttribute('d', on ? 'M6 5h4.5v14H6Zm7.5 0H18v14h-4.5Z' : 'M7 4.5v15l12.5-7.5Z');
  $('#playBtn').setAttribute('aria-label', on ? 'Stop' : 'Play'); $('#playBtn').title = on ? 'Stop' : 'Play';
}
function stopPlay(){
  if (!play) return;
  play.nodes.forEach(n => { try { n.stop(); } catch (e) {} });
  play.master.gain.setTargetAtTime(0, actx.currentTime, 0.03);
  cancelAnimationFrame(play.raf);
  document.querySelectorAll('svg g.on').forEach(g => g.classList.remove('on'));
  play = null; setPlayIcon(false);
}
function startPlay(){
  if (!piece) return;
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  if (!wave) {
    const n = 9, re = new Float32Array(n), im = new Float32Array(n);
    [0, 1, 0.55, 0.32, 0.22, 0.12, 0.08, 0.05, 0.03].forEach((a, i) => { im[i] = a; });
    wave = actx.createPeriodicWave(re, im);
  }
  const voices = visibleVoices();
  const spb = 60 / Math.max(20, st.tempo || 90);       /* seconds per semibreve */
  const master = actx.createGain(); master.gain.value = 0.5 / Math.sqrt(Math.max(1, voices.length));
  master.connect(actx.destination);
  const t0 = actx.currentTime + 0.12, nodes = [], events = [];
  voices.forEach(v => {
    const pan = actx.createStereoPanner ? actx.createStereoPanner() : null;
    const out = pan || master;
    if (pan) { pan.pan.value = voices.length > 1 ? -0.5 + v.idx / (piece.voices.length - 1 || 1) : 0; pan.connect(master); }
    for (let k = 0; k < v.syms.length; k++) {
      const s = v.syms[k];
      if (s.rest) continue;
      /* tied pieces sound as one note */
      let d = s.d, j = k;
      while (v.syms[j].tieNext && v.syms[j + 1] && !v.syms[j + 1].rest && v.syms[j + 1].step === s.step) { j++; d += v.syms[j].d; }
      const a = t0 + s.t * spb, b = t0 + (s.t + d) * spb;
      const o = actx.createOscillator(), g = actx.createGain();
      o.setPeriodicWave(wave);
      o.frequency.value = 440 * Math.pow(2, (midiOf(s) - 69) / 12);
      g.gain.setValueAtTime(0, a);
      g.gain.linearRampToValueAtTime(0.32, a + 0.03);
      g.gain.setValueAtTime(0.32, Math.max(a + 0.03, b - 0.06));
      g.gain.linearRampToValueAtTime(0, b);
      o.connect(g); g.connect(out);
      o.start(a); o.stop(b + 0.05);
      nodes.push(o);
      for (let q = k; q <= j; q++) events.push({a: t0 + v.syms[q].t * spb, b: t0 + v.syms[q].end * spb, id: v.syms[q].id});
      k = j;
    }
  });
  const end = t0 + piece.end * spb;
  play = {nodes, master, raf: 0};
  setPlayIcon(true);
  let lastScroll = 0;
  const tick = () => {
    if (!play) return;
    const now = actx.currentTime;
    if (now > end + 0.2) { stopPlay(); return; }
    const on = new Set();
    for (const e of events) if (e.a <= now && e.b > now) on.add(e.id);
    document.querySelectorAll('svg g.on').forEach(g => { if (!on.has(g.classList[0])) g.classList.remove('on'); });
    let first = null;
    on.forEach(id => document.querySelectorAll('svg g.' + id).forEach(g => { g.classList.add('on'); first = first || g; }));
    if (first && performance.now() - lastScroll > 900) {
      const r = first.getBoundingClientRect();
      if (r.top < 70 || r.bottom > window.innerHeight - 20) { first.scrollIntoView({block: 'center', behavior: 'smooth'}); lastScroll = performance.now(); }
    }
    play.raf = requestAnimationFrame(tick);
  };
  play.raf = requestAnimationFrame(tick);
}
$('#playBtn').addEventListener('click', () => { if (play) stopPlay(); else startPlay(); });
$('#tempo').addEventListener('change', e => { st.tempo = Math.max(20, Math.min(240, +e.target.value || 90)); save(); if (play) { stopPlay(); startPlay(); } });

/* tell the site page how tall the app is */
let lastH = 0;
function postHeight(){
  if (!EMBED) return;
  requestAnimationFrame(() => {
    let h = document.documentElement.scrollHeight;
    const pop = document.querySelector('.pop.open .popbody');
    if (pop) h = Math.max(h, pop.getBoundingClientRect().bottom + window.scrollY + 20);
    if (h !== lastH) { lastH = h; parent.postMessage({choirbookHeight: h}, '*'); }
  });
}
let rw = 0, lastW = window.innerWidth;
window.addEventListener('resize', () => { if (window.innerWidth === lastW) return; lastW = window.innerWidth; clearTimeout(rw); rw = setTimeout(render, 150); });

/* start */
(async () => {
  try { await document.fonts.load('100px "IM Fell English"'); await document.fonts.load('italic 100px "IM Fell English"'); } catch (e) {}
  pieceKey = PIECES.includes(st.piece) ? st.piece : PIECES[0];
  syncUI();
  try { await loadPiece(pieceKey); } catch (e) { pagesEl.innerHTML = `<p class="msg">${esc(e.message)}</p>`; }
  buildPieceList().then(syncUI);
  if (/[?&]print=1/.test(location.search)) setTimeout(() => window.print(), 600);
})();
window.__cb = {st, get piece(){ return piece; }, render, parseKern, notate};
})();
</script>
