  <script>
    // The game fills the window below the menu: as wide as fits, twice as wide as it is tall
    const frame = document.querySelector('.game');
    // (on a short screen, such as a phone on its side, it takes the whole height and the page scrolls to it)
    function fit() {
        const top = frame.getBoundingClientRect().top + window.scrollY, vh = window.innerHeight;
        let h = vh - top - 16;
        if (h < vh * 0.6) h = vh - 16;
        frame.style.setProperty('--fit-h', Math.max(160, h) + 'px');
    }
    fit(); window.addEventListener('resize', fit); document.fonts && document.fonts.ready.then(fit);
  </script>
